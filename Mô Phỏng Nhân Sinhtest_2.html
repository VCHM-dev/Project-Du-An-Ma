const inventoryService={
  add(x,id,q=1,ex){
    const d=ID[id];
    if(!ex&&(d.t==='pill'||d.t==='scroll'||d.t==='special'||d.t==='material')){
      const i=x.inv.find(i=>i.id===id&&!i.ex);
      if(i){i.q+=q;return}
    }
    const o={u:uid(),id,q};if(ex)o.ex=1;x.inv.push(o);
  },
  noBatch:['d2','d7','d8','d9','d10'],
  use(x,u,cnt=1){
    const it=x.inv.find(i=>i.u===u),d=it&&ID[it.id];
    if(!d)return;
    if(d.t==='material')return say('Nguyên liệu dùng để chế tạo ở tab Bách Nghệ');
    if(d.t==='scroll')return say('Trận Bàn thực chiến: kích hoạt trực tiếp trong Chiến Trường Lịch Luyện!');
    if(['d14','d15','d16'].includes(d.id))return say('Đan dược thực chiến: sử dụng trực tiếp trong Chiến Trường Lịch Luyện!');
    if(this.noBatch.includes(d.id))cnt=1;
    const f=PE[d.id];if(!f)return;
    const K=it.ex?2:1,hasTox=!!PT[d.id]&&!hasT(x,'t34');
    let used=0,lastMsg='';
    while(used<cnt&&it.q>0){
      if(cnt>1&&hasTox&&x.toxin>=80)break;
      const r=f(x,K);
      if(r&&r.e){if(used===0)return say(r.e);break}
      it.q--;used++;lastMsg=r;
      if(hasTox){const toxGain=(x.sect&&x.sect.id==='danduoc')||(x.ownSect&&x.ownSect.style===1)?Math.max(1,Math.round(PT[d.id]*.8)):PT[d.id];x.toxin=Math.min(100,x.toxin+toxGain)}
    }
    if(it.q<=0)x.inv=x.inv.filter(i=>i!==it);
    if(used>0){
      const nm=(it.ex?'Cực phẩm ':'')+d.n+(used>1?' ×'+used:'');
      say('Đã dùng '+nm+': '+lastMsg+(hasTox?' · Đan độc '+x.toxin+'/100':''));
    }
  }
};

  up(x,u){const t=x.tal.find(t=>t.u===u),c=this.cost(t);if(t.lv>=5)return say('Đã cấp tối đa');if(x.stones<c)return say('Cần '+c+' linh thạch');x.stones-=c;t.lv++;say('Nâng cấp '+TD[t.id].n+' lên cấp '+t.lv)},
  grant(x,id,src){const o=x.tal.find(t=>t.id===id);if(o){if(o.lv<5)o.lv++;return'trùng → tăng cấp'}x.tal.push({u:uid(),id,lv:1,on:false,src});return'mới'}
};

const characterStatsService={
  compute(x){
    const b=BODIES[x.body],r=ROOTS[x.root],rank=x.realm*9+x.layer,k=8+rank*1.5,m={};
    talentInventoryService.active(x).forEach(t=>addm(m,TD[t.id].e,(1+.25*(t.lv-1))*(1+.08*x.body)));
    const eqItems=[];
    for(const t in x.eq){const it=x.inv.find(i=>i.u===x.eq[t]);if(it){eqItems.push(it);addm(m,ID[it.id].s,eqMul(x,it))}}
    const eqTechs=[];
    for(const id in x.tech)if(x.tech[id]&&x.tech[id].eq&&QD[id]){eqTechs.push(id);addm(m,QD[id].e,techniqueService.power(x,id))}
    if(x.tm)m.tam=(m.tam||0)-8;
    const ab=2*Object.keys(x.ach||{}).length+10*(x.reborn||0),px=x.px||{},base={the:k+b.a+ab+(px.the||0),linh:k+Math.round(r.c*4)+ab+(px.linh||0),ngo:k+ab+(px.ngo||0),than:k+ab+(px.than||0),tam:k+ab+(px.tam||0),van:k+x.van+ab+(x.activeArray==='van'?Math.round(15*av(x)):0)},a={},bonus={};
    ATTR.forEach(n=>{a[n]=Math.round(base[n]+(m[n]||0));bonus[n]=a[n]-base[n]});
    const flatMul=Math.pow(1.85,x.realm),realmMul=Math.pow(2.05,x.realm)*(1+x.layer*.1),gfMul=1+(x.gfBuff||0);
    let luc=Math.round((a.the*1.4+a.linh*1.1+a.ngo*.7+(m.luc||0)*flatMul)*realmMul*gfMul);
    let thu=Math.round((a.the*2.2+a.tam*1.0+(m.thu||0)*flatMul)*realmMul*gfMul);
    let toc=Math.round((a.linh*1.3+a.than*.9+(m.toc||0)*flatMul)*realmMul*gfMul);
    if(x.activeArray==='ho')thu=Math.round(thu*(1+.25*av(x)));
    if(x.activeArray==='hon')thu=Math.round(thu*(1+.3*av(x)));
    if(x.activeArray==='tru'&&advOn)luc=Math.round(luc*(1+.6*av(x)));
    if(x.activeArray==='hon'&&advOn)luc=Math.round(luc*(1+.4*av(x)));
    const sb=typeof sectService!=='undefined'?sectService.buff(x):{};
    const cb=typeof compService!=='undefined'?compService.buff(x):{};
    if(sb.luc||cb.luc)luc=Math.round(luc*(1+(sb.luc||0)+(cb.luc||0)));
    if(sb.thu||cb.thu)thu=Math.round(thu*(1+(sb.thu||0)+(cb.thu||0)));
    if(cb.toc)toc=Math.round(toc*(1+cb.toc));
    const maxHp=Math.round((a.the*8.5+a.than*3.5+100)*realmMul*gfMul),maxMp=Math.round((a.linh*6+a.than*5+60)*realmMul*gfMul);
    const rawPen=a.ngo*.25+eqItems.reduce((acc,it)=>acc+(it.ql===2?15:it.ql===3?30:0),0);
    const pen=.80*rawPen/(rawPen+60);
    const rawCrit=10+a.van*.25+(eqTechs.some(id=>(QD[id].sp||[]).includes('burst'))?15:0)+((sb.crit||0)+(cb.crit||0))*100;
    const crit=.70*rawCrit/(rawCrit+55);
    const critDmg=1.5+.80*a.than/(a.than+150);
    const dRaw=a.van*.6+a.linh*.4;
    const dodge=.40*dRaw/(dRaw+180);
    return{attr:a,bonus,luc,thu,toc,maxHp,maxMp,pen,crit,critDmg,dodge,tc:(m.tc||0)+(sb.tc||0)+(cb.tc||0),pb:(sb.pb||0)+(cb.pb||0),realmMul};
  }
};

const cultivationService={
  need:x=>Math.round(100*Math.pow(2.2,x.realm)*(1+x.layer*.35)),
  life:x=>LIFE[x.realm]+x.lifeB,
  cost:x=>Math.max(50*(x.realm+1)**2,Math.round(55*Math.pow(1.75,x.realm))),
  npt:x=>15+x.realm*8,
  chance(x){const st=characterStatsService.compute(x);return clamp(.55+(st.attr.tam-this.npt(x))*.01+x.pb+(x.pity||0)+(st.pb||0)-.004*(x.toxin||0),.1,.95)},
  train(x){
    if(x.age>=this.life(x))return say('Thọ nguyên cạn kiệt, cần đột phá hoặc dùng Thọ Nguyên Đan');
    const st=characterStatsService.compute(x);
    const raw=.9*22*Math.pow(1.95,x.realm)*(1+st.attr.ngo/25)*BODIES[x.body].c*ROOTS[x.root].c*(1+st.tc);
    const g=Math.max(1,Math.round(raw*(1-.004*(x.toxin||0))*(x.activeArray==='tu'?1+.3*av(x):x.activeArray==='hon'?1+.5*av(x):1)));
    x.age++;x.xp+=g;x.total+=g;
    if(x.toxin>0)x.toxin=Math.max(0,x.toxin-(x.activeArray==='duoc'?3:1));
    if(typeof sectService!=='undefined')sectService.tickYear(x);
    say('Bế quan 1 năm, thu được '+g+' tu vi'+(x.toxin>0?' (đan độc '+x.toxin+')':''));
  },
  auto(x){let n=0,up=0;while(n<3000){if(x.age>=this.life(x)-5){say(`Dừng: thọ nguyên còn dưới 5 năm (đã bế quan ${n} năm, lên ${up} tầng)`);return}if(this.check(x)[0][0]){if(x.layer<8){this.go(x);up++;continue}say(`Bế quan ${n} năm, lên ${up} tầng, đã tới cửa đột phá cảnh giới`);return}this.train(x);n++}say('Đã bế quan '+n+' năm, lên '+up+' tầng')},
  check(x){
    const n=this.need(x),st=characterStatsService.compute(x),r=[[x.xp>=n,`Tu vi ${x.xp.toLocaleString('vi-VN')}/${n.toLocaleString('vi-VN')}`]];
    if(x.layer===8){
      if(x.realm>=REALMS.length-1)r.push([false,'Hỗn Nguyên viên mãn: đã chứng đắc vô thượng đại đạo']);
      else{
        r.push([st.attr.tam>=this.npt(x),`Tâm cảnh ≥ ${this.npt(x)} (hiện ${st.attr.tam})`],[!x.tm,'Không nhiễm tâm ma'],[x.stones>=this.cost(x),`Linh thạch ≥ ${this.cost(x).toLocaleString('vi-VN')}`]);
        if(x.realm===8)r.push([st.thu>=150000,`Phòng ngự ≥ 150.000 để gánh Phi Thăng Tiên Kiếp (hiện ${st.thu.toLocaleString('vi-VN')})`]);
      }
    }
    return r;
  },
  go(x){
    if(!this.check(x).every(c=>c[0]))return say('Chưa đủ điều kiện đột phá');
    const n=this.need(x);
    if(x.layer<8){x.xp-=n;x.layer++;return log(`Đột phá thành công: ${REALMS[x.realm]} tầng ${x.layer+1}`)}
    x.stones-=this.cost(x);const p=this.chance(x);x.pb=0;
    if(Math.random()>p){x.pity=Math.min(.2,(x.pity||0)+.04);
      x.xp=Math.max(0,x.xp-Math.round(n*.25));
      let msg='Đột phá thất bại, tổn thất tu vi';
      if(Math.random()<.5){
        if(x.activeArray==='khon'&&Math.random()<.5*av(x))msg+=' (Cửu Cung Khốn Ma Trận đã trấn áp tâm ma)';
        else{x.tm=true;msg+=' và nhiễm tâm ma'}
      }
      return log(msg);
    }
    const t=x.realm+1;
    if(t>=2){
      const k=190*Math.pow(2.15,t),tb=typeof compService!=='undefined'?compService.tribBonus(x):0,ch=clamp(characterStatsService.compute(x).thu/k+tb,.15,.95);
      if(Math.random()>ch){x.pity=Math.min(.2,(x.pity||0)+.04);x.xp=Math.max(0,x.xp-Math.round(n*.35));x.tm=true;return log('Thiên kiếp giáng xuống, vượt kiếp thất bại, nhiễm tâm ma')}
    }
    const before=characterStatsService.compute(x),lifeBefore=this.life(x),r0=x.realm;
    x.xp-=n;x.realm=t;x.layer=0;x.pity=0;
    x.tm=false;x.toxin=Math.max(0,(x.toxin||0)-(15+t*2));x.van=(x.van||0)+2;
    const after=characterStatsService.compute(x),lifeAfter=this.life(x);
    if(!ui._inLab&&typeof s!=='undefined'&&x===s)ui.brkInfo={r0,r1:t,before,after,lifeBefore,lifeAfter};
    if(t===9){x.ascended=(x.ascended||0)+1;log('⚡✨ Vượt qua Cửu Trọng Phi Thăng Kiếp, phá toái hư không, phi thăng Tiên Giới thành tựu Chân Tiên!')}
    else log(`Đột phá cảnh giới thành công: ${REALMS[t]}${t>=2?' (đã vượt thiên kiếp)':''} · Tẩy kinh phạt tủy (+2 thuộc tính gốc, +2 Khí vận, thanh lọc đan độc)!`);
  }
};

const destinyService={
  dest:x=>['Bình Phàm','Phúc Duyên','Thiên Tuyển','Khí Vận Chi Tử','Thiên Đạo Sủng Nhi'][x.van<10?0:x.van<30?1:x.van<60?2:x.van<100?3:4],

const SECTS=[

  {id:'danduoc',n:'Đan Đỉnh Các',tag:'Trung Lập · Đan Đạo',d:'Thánh địa luyện đan, tăng Tốc độ tu luyện (+15% gốc) & giảm 20% Đan độc.',b:{tc:.15},col:'#34d399'},
  {id:'huyenam',n:'Huyền Âm Ma Tông',tag:'Ma Đạo · Huyết Sát',d:'Tu luyện tà công bá đạo, tăng Bạo kích (+12% gốc) & Hút máu khi giao chiến.',b:{crit:.12},col:'#f472b6'},
  {id:'vanphap',n:'Vạn Pháp Thư Viện',tag:'Cổ Tông · Trận Pháp',d:'Tàng thư vạn quyển, tăng Phòng ngự (+15% gốc) & Tỷ lệ đột phá (+5% gốc).',b:{thu:.15,pb:.05},col:'#fbbf24'}
];
const SECT_RANKS=[['Ngoại Môn Đệ Tử',0,1],['Nội Môn Đệ Tử',100,1.2],['Chân Truyền Đệ Tử',400,1.5],['Trưởng Lão',1200,1.8],['Thái Thượng Trưởng Lão',3000,2.2]];
const SECT_SHOP=[
  {id:'d1',q:3,c:25},{id:'d3',q:2,c:40},{id:'m7',q:5,c:35},{id:'m8',q:3,c:70},{id:'m9',q:2,c:160},
  {id:'d14',q:1,c:90},{id:'d15',q:1,c:90},{id:'b1',q:1,c:140},{id:'d6',q:1,c:180},{id:'d7',q:1,c:220}
];
const VEIN_NAMES=['Sơ Cấp Linh Mạch','Hạ Phẩm Linh Mạch','Trung Phẩm Linh Mạch','Thượng Phẩm Linh Mạch','Cực Phẩm Linh Mạch','Địa Mạch Tổ Long','Thiên Mạch Tiên Tuyền'];
const DISC_LN=['Lâm','Trần','Diệp','Tô','Mộ','Hàn','Tiêu','Vân','Sở','Cố','Lục','Thẩm'];
const DISC_FN=['Thanh','Vân','Huyền','Dạ','Bạch','Minh','Nguyệt','Phong','Sương','Vũ','Tuyết','Hạo'];
const DISC_QN=['Phàm Tư','Thiên Tài','Yêu Nghiệt'];
const SECT_STYLES=[
  {n:'Kiếm Tu Sơn Môn',d:'+18% Lực chiến toàn diện',b:{luc:.18}},

  {n:'Huyết Ma Bá Tông',d:'+15% Bạo kích & Hút máu thực chiến',b:{crit:.15}},
  {n:'Vạn Pháp Cổ Tông',d:'+20% Phòng ngự & +6% Tỷ lệ đột phá',b:{thu:.20,pb:.06}}
];
const sectService={
  rankOf:tot=>SECT_RANKS.reduce((a,r,i)=>tot>=r[1]?i:a,0),
  buff(x){
    if(x.ownSect){
      const os=x.ownSect,st=SECT_STYLES[os.style]||SECT_STYLES[0],b=Object.assign({},st.b);
      b.tc=(b.tc||0)+.08*(os.veinLv||1);
      return b;
    }
    if(x.sect){
      const sc=SECTS.find(s=>s.id===x.sect.id);if(!sc)return{};
      const rk=this.rankOf(x.sect.total||0),mul=SECT_RANKS[rk][2],b={};
      for(const k in sc.b)b[k]=sc.b[k]*mul;
      return b;
    }
    return{};
  },
  join(x,id){
    if(x.ownSect)return say('Đạo hữu đã Khai Tông Lập Phái, không thể bái nhập tông môn khác');
    const sc=SECTS.find(s=>s.id===id);if(!sc)return;
    x.sect={id,contrib:0,total:0,lastAge:-1};
    say('Đã bái nhập '+sc.n+' với thân phận Ngoại Môn Đệ Tử!');
  },
  leave(x){
    if(!x.sect)return;
    const sc=SECTS.find(s=>s.id===x.sect.id);
    x.sect=null;
    say('Đã rời khỏi '+(sc?sc.n:'tông môn'));
  },
  mission(x,tp){
    if(!x.sect)return;
    if(x.sect.lastAge===x.age)return say('Năm nay đã hoàn thành nhiệm vụ tông môn, hãy bế quan sang năm sau');
    if(tp!==1&&x.age>=cultivationService.life(x))return say('Thọ nguyên cạn kiệt');
    const sc=SECTS.find(s=>s.id===x.sect.id);
    let cGain=0,msg='';
    if(tp===0){
      x.age++;cGain=30+Math.floor(Math.random()*16);
      const ls=Math.round(30*Math.pow(1.6,x.realm));x.stones+=ls;
      msg=`Tuần sơn hộ đạo (+${cGain} Cống hiến, +${ls.toLocaleString('vi-VN')} linh thạch)`;
    }else if(tp===1){
      const cost=25*(x.realm+1);if(x.stones<cost)return say('Cần '+cost+' linh thạch để hiến nạp');
      x.stones-=cost;cGain=40;
      msg=`Hiến nạp tài nguyên (+${cGain} Cống hiến)`;
    }else{
      x.age++;cGain=50+Math.floor(Math.random()*26);
      const xp=Math.round(18*Math.pow(1.9,x.realm));x.xp+=xp;x.total+=xp;
      msg=`Chấp hành trừ yêu lệnh (+${cGain} Cống hiến, +${xp.toLocaleString('vi-VN')} tu vi)`;
    }
    x.sect.lastAge=x.age;x.sect.contrib+=cGain;x.sect.total+=cGain;
    const rk=this.rankOf(x.sect.total);
    say((sc?sc.n+': ':'')+msg+' · '+SECT_RANKS[rk][0]);
  },
  buy(x,idx){
    if(!x.sect)return;
    const o=SECT_SHOP[idx];if(!o)return;
    if(x.sect.contrib<o.c)return say('Cần '+o.c+' điểm Cống hiến');
    x.sect.contrib-=o.c;inventoryService.add(x,o.id,o.q);
    say('Đổi thành công '+ID[o.id].n+' ×'+o.q);
  },
  found(x,name,style){
    if(x.realm<3)return say('Cần đạt cảnh giới Nguyên Anh trở lên mới có thể Khai Tông Lập Phái');
    if(x.ownSect)return say('Đã lập sơn môn rồi');
    if(x.stones<5000)return say('Cần 5,000 linh thạch để khai sơn lập phái');
    x.stones-=5000;x.sect=null;
    const nm=(name||'').trim().slice(0,28)||(x.name+' Tiên Tông');
    x.ownSect={name:nm,style:clamp(+style||0,0,3),veinLv:1,disciples:[],vaultStones:0,vaultXp:0,years:0};
    log('🏔 Khai Tông Lập Phái thành công: sáng lập «'+nm+'»!');
    say('Chúc mừng Đạo hữu khai sơn lập phái «'+nm+'»!');
  },
  veinCost(lv){return{stones:Math.round(3000*Math.pow(2.4,lv-1)),ore:4*lv}},
  upgradeVein(x){
    const os=x.ownSect;if(!os||os.veinLv>=7)return;
    const c=this.veinCost(os.veinLv),m7=x.inv.filter(i=>i.id==='m7').reduce((a,i)=>a+i.q,0);
    if(x.stones<c.stones)return say('Cần '+c.stones.toLocaleString('vi-VN')+' linh thạch');
    if(m7<c.ore)return say('Cần '+c.ore+' Khoáng Thạch (hiện có '+m7+')');
    x.stones-=c.stones;takeM(x,{m7:c.ore});os.veinLv++;
    say('Nâng cấp Linh Mạch lên '+VEIN_NAMES[os.veinLv-1]+' (+'+(os.veinLv*8)+'% Tốc độ tu luyện)');
  },
  recruit(x){
    const os=x.ownSect;if(!os)return;
    const maxD=2+os.veinLv;
    if(os.disciples.length>=maxD)return say('Sơn môn đã đủ '+maxD+' đệ tử, hãy nâng cấp Linh Mạch để mở rộng');
    const cost=400*(x.realm+1);
    if(x.stones<cost)return say('Cần '+cost.toLocaleString('vi-VN')+' linh thạch để chiêu mộ đệ tử');
    x.stones-=cost;
    const r=Math.random(),q=r<.08?2:r<.35?1:0;
    const nm=pick(DISC_LN)+' '+pick(DISC_FN);
    os.disciples.push({u:uid(),n:nm,q,lv:1});
    say('Chiêu mộ được đệ tử ['+DISC_QN[q]+'] '+nm+'!');
  },
  trainDisciple(x,u){
    const os=x.ownSect,d=os&&os.disciples.find(i=>i.u===u);if(!d)return;
    if(d.lv>=10)return say(d.n+' đã đạt cấp tối đa (Lv.10)');
    const cost=200*d.lv*(d.q+1);
    if(x.stones<cost)return say('Cần '+cost.toLocaleString('vi-VN')+' linh thạch để bồi dưỡng '+d.n);
    x.stones-=cost;d.lv++;
    say('Bồi dưỡng '+d.n+' lên Lv.'+d.lv);
  },
  dismissDisciple(x,u){
    const os=x.ownSect;if(!os)return;
    os.disciples=os.disciples.filter(i=>i.u!==u);
    say('Đã cho đệ tử rời sơn môn');
  },
  tickYear(x){
    const os=x.ownSect;if(!os||(os.years||0)>=100)return;
    const discPow=os.disciples.reduce((a,d)=>a+d.lv*(d.q+1),0);
    const sGain=Math.round((os.veinLv*25+discPow*12)*Math.pow(1.45,x.realm));
    const xGain=Math.round((os.veinLv*8+discPow*5)*Math.pow(1.65,x.realm));
    os.vaultStones=(os.vaultStones||0)+sGain;
    os.vaultXp=(os.vaultXp||0)+xGain;
    os.years=(os.years||0)+1;
  },
  collectVault(x){
    const os=x.ownSect;if(!os||(!os.vaultStones&&!os.vaultXp))return say('Chưa có sản lượng tích lũy để thu hoạch');
    const ls=os.vaultStones||0,xp=os.vaultXp||0;
    x.stones+=ls;x.xp+=xp;x.total+=xp;
    os.vaultStones=0;os.vaultXp=0;os.years=0;
    say('Thu hoạch Linh Mạch & Đệ tử: +'+ls.toLocaleString('vi-VN')+' linh thạch, +'+xp.toLocaleString('vi-VN')+' tu vi!');
  }
};

  {id:'tovien',n:'Tô Vãn Tình',ti:'Thanh Vân Thánh Nữ',ico:'🗡',d:'Kiếm tâm thông minh. Song tu tăng mạnh Tu vi; Hộ pháp vượt Thiên Kiếp +10%.',b:{luc:.10,tc:.10},trib:.10,sp:'xp'},

const compService={
  buff(x){
    const b={};
    if(x.pet&&x.pets&&x.pets[x.pet]){
      const p=PETS.find(i=>i.id===x.pet),lv=x.pets[x.pet];
      if(p){for(const k in p.b)b[k]=(b[k]||0)+p.b[k]+(p.per[k]||0)*(lv-1)}
    }
    if(x.partner){
      const pt=PARTNERS.find(i=>i.id===x.partner),aff=(x.pAff&&x.pAff[x.partner])||100;
      const mul=1+Math.floor(Math.max(0,aff-100)/100)*.25;
      if(pt){for(const k in pt.b)b[k]=(b[k]||0)+pt.b[k]*mul}
    }
    return b;
  },
  tribBonus(x){
    if(!x.partner)return 0;
    const pt=PARTNERS.find(i=>i.id===x.partner),aff=(x.pAff&&x.pAff[x.partner])||100;
    return pt?pt.trib*(1+Math.floor(Math.max(0,aff-100)/100)*.2):0;
  },
  tameCost:()=>({stones:500,m4:2}),
  tame(x,id){
    if(x.pets&&x.pets[id])return say('Đã thu phục Linh Thú này rồi');
    const c=this.tameCost(),m4=mq(x,'m4');
    if(x.stones<c.stones)return say('Cần '+c.stones+' linh thạch để lập Khế Ước Linh Thú');
    if(m4<c.m4)return say('Cần '+c.m4+' Yêu Đan Nhị Giai (hiện có '+m4+')');
    x.stones-=c.stones;takeM(x,{m4:c.m4});
    x.pets=x.pets||{};x.pets[id]=1;
    if(!x.pet)x.pet=id;
    const p=PETS.find(i=>i.id===id);
    say('🐉 Thu phục thành công '+p.n+' ('+PET_STAGES[0]+')!');
  },
  equipPet(x,id){
    if(!x.pets||!x.pets[id])return;
    x.pet=x.pet===id?null:id;
    const p=PETS.find(i=>i.id===id);
    say(x.pet?'Đã xuất chiến '+p.n:'Đã thu hồi '+p.n);
  },
  evolveCost(lv){const mat=lv<3?'m4':lv<5?'m5':'m6';return{stones:Math.round(600*Math.pow(2.2,lv-1)),mat,q:lv<3?lv*2:lv<5?(lv-2)*2:(lv-4)*2}},
  evolve(x,id){
    const lv=x.pets&&x.pets[id];if(!lv||lv>=7)return;
    const c=this.evolveCost(lv),has=mq(x,c.mat);
    if(x.stones<c.stones)return say('Cần '+c.stones.toLocaleString('vi-VN')+' linh thạch');
    if(has<c.q)return say('Cần '+c.q+' '+ID[c.mat].n+' (hiện có '+has+')');
    x.stones-=c.stones;takeM(x,{[c.mat]:c.q});
    x.pets[id]=lv+1;
    const p=PETS.find(i=>i.id===id);
    say(`✨ ${p.n} tiến hóa thành công lên [${PET_STAGES[lv]}] (Cấp ${lv+1}/7)!`);
  },
  gift(x,id){
    const pt=PARTNERS.find(i=>i.id===id);if(!pt)return;
    const cost=150*(x.realm+1);
    if(x.stones<cost)return say('Cần '+cost.toLocaleString('vi-VN')+' linh thạch để tặng lễ vật');
    x.stones-=cost;x.pAff=x.pAff||{};
    x.pAff[id]=(x.pAff[id]||0)+25;
    say(`🎁 Tặng lễ vật cho ${pt.n}: Hảo cảm +25 (hiện ${x.pAff[id]})`);
  },
  bond(x,id){
    const pt=PARTNERS.find(i=>i.id===id),aff=(x.pAff&&x.pAff[id])||0;
    if(!pt||aff<100)return say('Cần đạt 100 Hảo cảm mới có thể Kết Thành Đạo Lữ');
    x.partner=id;
    say(`💞 Đạo hữu và ${pt.n} chính thức Kết Thành Đạo Lữ, cùng bước trên con đường trường sinh!`);
  },
  dualCultivate(x){
    if(!x.partner)return;
    if(x.age>=cultivationService.life(x))return say('Thọ nguyên cạn kiệt');
    if(x.dualAge&&x.age<x.dualAge+3)return say('Cần nghỉ ngơi '+(x.dualAge+3-x.age)+' năm nữa mới có thể tiếp tục Song Tu');
    const pt=PARTNERS.find(i=>i.id===x.partner);
    const st=characterStatsService.compute(x);
    const base=Math.round(.9*22*Math.pow(1.95,x.realm)*(1+st.attr.ngo/25)*BODIES[x.body].c*ROOTS[x.root].c*(1+st.tc)*(pt.sp==='xp'?2.6:2.2));
    x.age++;x.xp+=base;x.total+=base;x.dualAge=x.age;
    x.pAff=x.pAff||{};x.pAff[x.partner]=(x.pAff[x.partner]||100)+15;
    let extra='';
    if(pt.sp==='detox'&&x.toxin>0){x.toxin=Math.max(0,x.toxin-15);extra=' · Thanh lọc -15 Đan độc'}
    else if(pt.sp==='mind'){x.px.tam=(x.px.tam||0)+1;x.van=(x.van||0)+1;extra=' · +1 Tâm cảnh, +1 Khí vận'}
    if(typeof sectService!=='undefined')sectService.tickYear(x);
    say(`💞 Song Tu cùng ${pt.n}: +${base.toLocaleString('vi-VN')} tu vi, +15 Hảo cảm${extra}!`);
  }
};

const foeOf=(i,mut)=>{const L=Math.round(22*Math.pow(2.18,i)),m=mut||null;return{luc:Math.round(2.8*L*(m?m.luc:1)),thu:Math.round(2.2*L*(m?m.thu:1)),toc:Math.round(2.1*L*(m?m.toc:1)),hp:Math.round(15*L*(m?m.hp:1)),el:ADV[i][2],mut:m}};

function skillOf(x,id){
  const d=QD[id];if(!d)return null;
  const p=techniqueService.power(x,id),sp=d.sp||[];
  let k='heal',cd=3,mp=.22,mul=1.35,tag='Hồi HP & Hộ Thuẫn';
  if(['q4','q11','q18'].includes(id)||/Quyền|Luyện thể/.test(d.ty)){k='break';cd=3;mp=.22;mul=1.45;tag='Phá Giáp -35% & Phản Chấn'}
  else if(['q7','q9','q10','q13'].includes(id)||/Thần hồn|Chưởng|Bí thuật/.test(d.ty)){k='stun';cd=4;mp=.26;mul=1.4;tag='Phong Ấn (Choáng 1 hiệp, ngắt tụ lực)'}
  else if(sp.includes('burst')||['q6','q17','q19'].includes(id)){k='exec';cd=3;mp=.25;mul=1.65;tag='Trảm Sát (×2.4 nếu địch <30% HP)'}
  else if(sp.includes('burn')||['q3','q14'].includes(id)){k='burn';cd=3;mp=.22;mul=1.5;tag='Thiêu Đốt 3 hiệp'}
  else if(sp.includes('drain')||['q12','q15'].includes(id)){k='drain';cd=3;mp=.24;mul=1.5;tag='Hút 35% sát thương thành HP'}
  return{id,n:d.n,k,cd,mpCost:mp,mul:Math.round(mul*(.85+.25*p)*100)/100,tag};
}

function calcSup(x,b){
  const diff=Math.max(0,b.i-x.realm);
  const mit=diff>0?clamp((b.counter?.5:0)+(x.bmWeapon?x.bmWeapon.lv*.025:0)+(x.gfSup||0),0,.85):0;
  b.diff=diff;b.supMit=mit;
  b.supDealt=diff>0?Math.max(.15,1-diff*.22*(1-mit)):1;
  b.supTaken=diff>0?1+diff*.25*(1-mit):1;
}

const adventureService={
  initBattle(x,i,forceMut){
    advOn=1;let st;try{st=characterStatsService.compute(x)}finally{advOn=0}
    const sn=STANCES[clamp(x.stance||0,0,2)];
    const mut=(forceMut||ui.forceMut||Math.random()<.22)?pick(MUTS):null;
    if(ui.forceMut)ui.forceMut=0;
    const f=foeOf(i,mut);
    const eqTechs=Object.keys(x.tech).filter(id=>x.tech[id]&&x.tech[id].eq&&QD[id]);
    const eqItems=EQT.map(t=>x.eq[t]&&x.inv.find(k=>k.u===x.eq[t])).filter(Boolean);
    const rootEl=ROOTS[x.root].el;
    const counter=x.root===8||(rootEl&&KE[rootEl]===f.el)||eqTechs.some(id=>KE[QD[id].el]===f.el);
    const hasSp=k=>eqTechs.some(id=>(QD[id].sp||[]).includes(k));
    const luc=Math.round(st.luc*sn.luc),thu=Math.round(st.thu*sn.thu),toc=Math.round(st.toc*sn.toc);
    const maxHp=st.maxHp,maxMp=st.maxMp;
    const pen=st.pen;
    const hasShield=eqItems.some(it=>it.id==='f1'||it.id==='f7'||it.id==='a2');
    const sh=hasShield?Math.round(thu*1.5):0;
    const skills=eqTechs.map(id=>skillOf(x,id)).filter(Boolean);
    const fn=(mut?`【Biến Dị · ${mut.n}】 `:'')+ADV[i][0];
    const logs=[`⚔ ${x.name} (${sn.n}) đối đầu ${fn} [Hệ ${ELN[f.el]}] tại ${ADV[i][1]}`];
    const pet=x.pet&&x.pets&&x.pets[x.pet]?{d:PETS.find(p=>p.id===x.pet),lv:x.pets[x.pet]}:null;
    const b={i,fn,f,mut,sn,luc,thu,toc,maxHp,hp:maxHp,maxMp,mp:maxMp,fh:f.hp,fMaxHp:f.hp,sh,r:0,counter,pen,crit:st.crit,critDmg:st.critDmg||1.5,dodge:st.dodge||0,pet:pet&&pet.d?pet:null,
      hasDrain:hasSp('drain')||(x.sect&&x.sect.id==='huyenam')||(x.ownSect&&x.ownSect.style===2),hasBurn:hasSp('burn')||eqItems.some(it=>it.id==='f5'),hasBurst:hasSp('burst'),
      skills,cd:{},guardCd:0,guardTurns:0,reflTurns:0,rageTurns:0,immuneTurns:0,poisonImmTurns:0,tb1:0,tb2:0,
      fBreak:0,fStun:0,fBurn:0,fBurnTurns:0,pPoison:0,fCharge:0,pills:2,logs,done:0,win:0,fled:0};
    calcSup(x,b);
    if(b.diff>0)logs.push(`⚠ Uy Áp Cảnh Giới (vượt ${b.diff} đại cảnh giới): sát thương gây ra ×${b.supDealt.toFixed(2)}, sát thương gánh chịu ×${b.supTaken.toFixed(2)} (đã giảm ${Math.round(b.supMit*100)}% uy áp).`);
    if(mut)logs.push(`👹 Cảnh báo Yêu Thú Biến Dị (${mut.n}): ${mut.d}`);
    if(counter)logs.push(`✨ Ngũ hành tương khắc (${ELN[f.el]} bị khắc chế): sát thương +${Math.round((.3+sn.ke)*100)}%!`);
    if(pen>0)logs.push(`🗡 Xuyên Giáp Pháp Bảo: bỏ qua ${Math.round(pen*100)}% phòng ngự địch.`);
    if(sh>0)logs.push(`🛡 Pháp bảo hộ thể kích hoạt: tạo Hộ Thuẫn ${sh} điểm.`);
    if(b.pet)logs.push(`${b.pet.d.ico} Linh Thú ${b.pet.d.n} [${PET_STAGES[b.pet.lv-1]}] xuất trận trợ chiến!`);
    return b;
  },
  step(x,b,act){
    if(b.done)return b;
    const usePill=pid=>{
      const list=pid?[pid]:['d1','d3','d12'];
      const cands=x.inv.filter(k=>list.includes(k.id)&&k.q>0);
      const it=cands.find(k=>k.ex)||cands[0];
      if(!it||b.pills<=0)return{err:'không còn đan dược phù hợp'};
      it.q--;if(it.q<=0)x.inv=x.inv.filter(k=>k!==it);b.pills--;
      if(PT[it.id]&&!hasT(x,'t34'))x.toxin=Math.min(100,(x.toxin||0)+PT[it.id]);
      let msg='';
      if(it.id==='d14'){b.rageTurns=3;msg=`dùng ${it.ex?'Cực phẩm ':''}Bạo Nguyên Đan (+45% Lực chiến, +20% Bạo kích 3 hiệp)`}
      else if(it.id==='d15'){const gSh=Math.round(b.thu);b.sh+=gSh;b.immuneTurns=2;b.pPoison=0;msg=`dùng ${it.ex?'Cực phẩm ':''}Kim Cang Hộ Tâm Đan (+${gSh} Thuẫn, miễn hiệu ứng xấu 2 hiệp)`}
      else if(it.id==='d16'){b.pPoison=0;b.poisonImmTurns=4;msg=`dùng ${it.ex?'Cực phẩm ':''}Bách Thảo Giải Độc Đan (giải độc & miễn độc 4 hiệp)`}
      else{const hm=b.pPoison>0&&b.poisonImmTurns<=0?.5:1,hl=Math.round(b.maxHp*.38*hm),ml=Math.round(b.maxMp*.45);b.hp=Math.min(b.maxHp,b.hp+hl);b.mp=Math.min(b.maxMp,b.mp+ml);b.pPoison=0;msg=`dùng ${it.ex?'Cực phẩm ':''}${ID[it.id].n} hồi +${hl} HP, +${ml} Linh lực, giải độc`}
      return{msg,free:!!it.ex};
    };
    if(act==='pill'||(typeof act==='string'&&act.slice(0,5)==='pill_')){
      const res=usePill(act==='pill'?null:act.slice(5));
      if(res.free){b.logs.push(`✨ Cực phẩm đan dược không tốn lượt (Hiệp ${b.r}): ${res.msg}`);return b}
      act={_pillMsg:res.err||res.msg};
    }
    b.r++;
    const hit=(a,d)=>Math.max(1,Math.round((a-d*.5)*(.88+Math.random()*.24)));
    const dg=(a,d,bon)=>Math.random()<clamp((d-a)*.005+(bon||0),0,.38);
    for(const k in b.cd)if(b.cd[k]>0)b.cd[k]--;
    if(b.guardCd>0)b.guardCd--;
    if(b.guardTurns>0)b.guardTurns--;
    if(b.reflTurns>0)b.reflTurns--;
    if(b.rageTurns>0)b.rageTurns--;
    if(b.immuneTurns>0)b.immuneTurns--;
    if(b.poisonImmTurns>0)b.poisonImmTurns--;
    if(b.fBreak>0)b.fBreak--;
    const healMul=b.pPoison>0&&b.poisonImmTurns<=0?.5:1;
    if(b.sn.regen>0&&b.hp>0){const rg=Math.max(1,Math.round(b.maxHp*b.sn.regen*healMul));b.hp=Math.min(b.maxHp,b.hp+rg)}
    b.mp=Math.min(b.maxMp,b.mp+Math.max(8,Math.round(b.maxMp*.08)));

    const doPlayer=()=>{
      if(b.hp<=0||b.fh<=0)return'';
      if(act&&act._pillMsg)return act._pillMsg;
      if(act==='tb_b1'||act==='tb_b2'){
        const bid=act==='tb_b1'?'b1':'b2',it=x.inv.find(k=>k.id===bid&&k.q>0);
        if(!it)return'không còn Trận Bàn '+ID[bid].n;
        it.q--;if(it.q<=0)x.inv=x.inv.filter(k=>k!==it);
        if(bid==='b1'){b.counter=1;b.tb1=1;calcSup(x,b);return`kích hoạt Ngũ Hành Nghịch Chuyển Bàn (ép khắc hệ +30% ST, giảm 50% Uy Áp)`}
        b.tb2=1;return`kích hoạt Tứ Tượng Tỏa Linh Bàn (áp chế nửa hiệu ứng Yêu Thú Biến Dị)`;
      }
      if(act==='guard'){
        const cost=Math.round(b.maxMp*.2);
        if(b.mp<cost||b.guardCd>0)act='atk';
        else{
          b.mp-=cost;b.guardCd=3;b.guardTurns=2;b.pPoison=0;
          const gainSh=Math.round(b.thu*1.6);b.sh+=gainSh;
          return`vận Hộ Thể Kim Quang (+${gainSh} Hộ Thuẫn, giảm 35% sát thương 2 hiệp)`;
        }
      }
      let sk=null;
      if(typeof act==='string'&&act.slice(0,3)==='sk_'){
        sk=b.skills.find(s=>s.id===act.slice(3));
        const cost=sk?Math.round(b.maxMp*sk.mpCost):0;
        if(!sk||b.cd[sk.id]>0||b.mp<cost)sk=null;
        else{b.mp-=cost;b.cd[sk.id]=sk.cd}
      }
      if(!sk)b.mp=Math.min(b.maxMp,b.mp+Math.round(b.maxMp*.08));
      if(!sk&&dg(b.toc,b.f.toc,0))return'địch né tránh';
      const pLuc=Math.round(b.luc*(b.rageTurns>0?1.45:1));
      const fThu=Math.round(b.f.thu*(b.fBreak>0?.65:1)*(1-(b.pen||0)));
      let d=hit(Math.round(pLuc*(sk?sk.mul:1)),fThu),tags=[];
      if(sk)tags.push(`Tuyệt kỹ ${sk.n}`);
      if(b.counter)d=Math.round(d*(1.3+b.sn.ke));
      if(b.supDealt<1)d=Math.max(1,Math.round(d*b.supDealt));
      if(sk&&sk.k==='exec'&&b.fh<b.fMaxHp*.3){d=Math.round(d*1.45);tags.push('Trảm Sát')}
      if(Math.random()<(b.crit||.1)+b.sn.crit+(b.rageTurns>0?.2:0)){d=Math.round(d*(b.critDmg||1.5));tags.push('Bạo kích')}
      b.fh-=d;
      if(b.mut&&b.mut.id==='thiet'&&b.fh>0){const rf=Math.max(1,Math.round(d*(b.tb2?.1:.2)));b.hp-=rf;tags.push(`Thiết Giáp phản ${rf}`)}
      if(sk&&sk.k==='break'){b.fBreak=3;b.reflTurns=2;tags.push('Phá Giáp 3 hiệp')}
      if(sk&&sk.k==='stun'){b.fStun=1;if(b.fCharge){b.fCharge=0;tags.push('Ngắt Tụ Lực!')}else tags.push('Phong Ấn 1 hiệp')}
      if((sk&&sk.k==='burn')||(b.hasBurn&&b.fBurnTurns<=0&&Math.random()<.35)){b.fBurn=Math.max(6,Math.round(pLuc*.2));b.fBurnTurns=3;tags.push('Thiêu Đốt')}
      if(sk&&sk.k==='drain'||b.hasDrain){const ratio=(sk&&sk.k==='drain'?.35:.15)*healMul,hl=Math.max(1,Math.round(d*ratio));b.hp=Math.min(b.maxHp,b.hp+hl);tags.push(`Hút máu +${hl}`)}
      if(sk&&sk.k==='heal'){const hl=Math.round(b.maxHp*.22*healMul),sh=Math.round(b.thu*.6);b.hp=Math.min(b.maxHp,b.hp+hl);b.sh+=sh;tags.push(`Hồi +${hl} HP, +${sh} Thuẫn`)}
      return`bạn gây ${d}${tags.length?' ['+tags.join(', ')+']':''}`;
    };

    const doFoe=()=>{
      if(b.fh<=0||b.hp<=0)return'địch gục';
      if(b.fStun>0){b.fStun=0;return'địch bị Phong Ấn, mất lượt!'}
      const loiPeriod=b.tb2?5:3;
      if(b.mut&&b.mut.id==='loi'&&!b.fCharge&&b.r%loiPeriod===(loiPeriod-1)){b.fCharge=1;return'⚡ Địch tụ lực Cuồng Lôi Phạt Thế (sát thương cực đại ở hiệp sau)!'}
      if(!b.fCharge&&dg(b.f.toc,b.toc,b.sn.dodge+(b.dodge||0))){return'bạn thân pháp né tránh'}
      let fLuc=b.f.luc,notes=[];
      if(b.mut&&b.mut.id==='huyet'&&b.fh<b.fMaxHp*.4){fLuc=Math.round(fLuc*(b.tb2?1.2:1.4));notes.push('Huyết Sát Cuồng Nộ')}
      if(b.fCharge){fLuc=Math.round(fLuc*2.2);b.fCharge=0;notes.push('⚡ Lôi Kiếp Đại Chiêu')}
      let d=hit(fLuc,b.thu);
      if(b.supTaken>1)d=Math.round(d*b.supTaken);
      if(b.guardTurns>0)d=Math.round(d*.65);
      if(b.sh>0){const blk=Math.min(b.sh,d);b.sh-=blk;d-=blk;notes.push(`thuẫn chặn ${blk}`)}
      b.hp-=d;
      if(b.reflTurns>0&&d>0){const rf=Math.max(1,Math.round(d*.25));b.fh-=rf;notes.push(`phản chấn ${rf}`)}
      if(b.mut&&b.mut.id==='huyet'&&b.fh<b.fMaxHp*.4&&d>0){const hl=Math.round(d*(b.tb2?.1:.2));b.fh=Math.min(b.fMaxHp,b.fh+hl);notes.push(`hút +${hl}`)}
      if(b.mut&&b.mut.id==='doc'&&d>0&&b.pPoison<=0&&b.immuneTurns<=0&&b.poisonImmTurns<=0&&Math.random()<(b.tb2?.25:.5)){b.pPoison=3;notes.push('gây Trúng Độc')}
      return`địch gây ${d}${notes.length?' ('+notes.join(', ')+')':''}`;
    };

    const first=b.toc>=b.f.toc?doPlayer():doFoe();
    const second=b.toc>=b.f.toc?(b.fh>0?doFoe():'địch gục'):(b.hp>0?doPlayer():'bạn gục');
    let dot='';
    if(b.pet&&b.hp>0&&b.fh>0){
      const pd=b.pet.d,lv=b.pet.lv;
      if(pd.sk==='shield'){const shG=Math.max(5,Math.round(b.thu*(.15+.05*lv))),dm=Math.max(1,Math.round(b.luc*(.14+.04*lv)*b.supDealt));b.sh+=shG;b.fh-=dm;dot+=`, ${pd.ico} ${pd.n} +${shG} Thuẫn & gây ${dm}`}
      else if(pd.sk==='burn'){const dm=Math.max(1,Math.round(b.luc*(.2+.06*lv)*b.supDealt));b.fh-=dm;if(Math.random()<.4&&b.fBurnTurns<=0){b.fBurn=Math.max(6,Math.round(b.luc*.18));b.fBurnTurns=2}dot+=`, ${pd.ico} ${pd.n} phun Chân Hỏa ${dm}`}
      else if(pd.sk==='heal'){const hl=Math.max(2,Math.round(b.maxHp*(.03+.01*lv)*healMul));b.hp=Math.min(b.maxHp,b.hp+hl);dot+=`, ${pd.ico} ${pd.n} hồi +${hl} HP`}
      else{const dm=Math.max(1,Math.round(b.luc*(.26+.07*lv)*b.supDealt));b.fh-=dm;dot+=`, ${pd.ico} ${pd.n} Hổ Trảo ${dm}`}
    }
    if(b.fBurnTurns>0&&b.fh>0){b.fh-=b.fBurn;b.fBurnTurns--;dot+=`, 🔥 thiêu đốt địch -${b.fBurn}`}
    if(b.pPoison>0&&b.hp>0){const pd=Math.max(2,Math.round(b.maxHp*(b.tb2?.025:.05)));b.hp-=pd;b.pPoison--;dot+=`, ☠ độc phát -${pd}`}
    b.logs.push(`Hiệp ${b.r}: ${first} · ${second}${dot} (HP bạn ${Math.max(0,b.hp)}/${b.maxHp} · MP ${b.mp} · Địch ${Math.max(0,b.fh)}/${b.fMaxHp})`);
    if(b.fh<=0||b.hp<=0||b.r>=25){b.done=1;b.win=b.fh<=0&&b.hp>0}
    return b;
  },
  autoPick(b,x){
    const inv=x?x.inv:(s?s.inv:[]),has=id=>inv.some(k=>k.id===id&&k.q>0);
    if(b.r<3){
      if(b.diff>0&&!b.counter&&!b.tb1&&has('b1'))return'tb_b1';
      if(b.mut&&!b.tb2&&has('b2'))return'tb_b2';
    }
    if(b.pPoison>0&&b.pills>0&&b.poisonImmTurns<=0&&has('d16'))return'pill_d16';
    if(b.hp<b.maxHp*.35&&b.pills>0&&['d1','d3','d12'].some(has))return'pill';
    if(b.hp<b.maxHp*.4&&b.guardCd<=0&&b.mp>=Math.round(b.maxMp*.2))return'guard';
    if(b.fCharge){
      const st=b.skills.find(sk=>sk.k==='stun'&&!b.cd[sk.id]&&b.mp>=Math.round(b.maxMp*sk.mpCost));
      if(st)return'sk_'+st.id;
      if(b.guardCd<=0&&b.mp>=Math.round(b.maxMp*.2))return'guard';
      if(b.pills>0&&b.sh<=0&&has('d15'))return'pill_d15';
    }
    if(b.diff>0&&b.rageTurns<=0&&b.pills>0&&has('d14'))return'pill_d14';
    for(const sk of b.skills)if(!b.cd[sk.id]&&b.mp>=Math.round(b.maxMp*sk.mpCost))return'sk_'+sk.id;
    return'atk';
  },
  simBattle(x,i,logs){
    const b=this.initBattle(x,i,false);
    while(!b.done)this.step(x,b,this.autoPick(b,x));
    if(logs)logs.push(...b.logs.slice(1));
    this.lastB=b;
    return b.win;
  },
  resolve(x,b,quiet){
    const i=b.i,L=quiet?null:(ui.al=b.logs);
    if(b.fled){
      const lo=Math.round(x.xp*.05);x.xp=Math.max(0,x.xp-lo);
      const t=`Rút lui an toàn khỏi ${b.fn}, chỉ hao tổn ${lo} tu vi.`;
      if(L)L.push(t);if(!quiet)say(t);
      return{ok:false,fled:true};
    }
    if(b.win){
      const mMul=b.mut?1.5:1;
      const fm=(x.farm=x.age>=((x.farm||{}).y||0)+10?{y:x.age,n:0}:x.farm),dm=Math.max(.3,Math.pow(.92,fm.n));fm.n++;
      const sn=Math.round(50*Math.pow(1.6,i)*dm*mMul),xp=Math.round(40*Math.pow(1.9,i)*dm*mMul);
      x.stones+=sn;x.xp+=xp;x.total+=xp;x.wins=(x.wins||0)+1;
      x.advWins=x.advWins||{};x.advWins[i]=(x.advWins[i]||0)+1;
      let t=`Thắng ${b.fn}! +${sn} linh thạch, +${xp} tu vi`,drops=[];
      const soulId=Object.keys(x.tech).find(id=>x.tech[id]&&x.tech[id].eq&&QD[id]&&(QD[id].sp||[]).includes('soul'));
      if(soulId){
        const bo=Math.round(xp*.35*techniqueService.power(x,soulId));
        x.xp+=bo;x.total+=bo;t+=`, ${QD[soulId].n} hút +${bo} tu vi`;
      }
      if(Math.random()<(b.mut?.75:.4)){const d=pick(ITEMS.filter(k=>k.t!=='material'&&k.r<=Math.min(6,i)));inventoryService.add(x,d.id);t+=', rơi '+d.n;drops.push(d.n)}
      const u=TECH.filter(k=>!x.tech[k.id]&&k.r<=i+1);
      if(u.length&&Math.random()<(b.mut?.32:.15)){const d=pick(u);techniqueService.learn(x,d.id);t+=', nhặt bí tịch '+d.n;drops.push('Bí tịch '+d.n)}
      const mtTier=Math.min(5,Math.round(i*.7)),pl=ITEMS.filter(k=>k.t==='material'&&k.r<=mtTier&&k.r>=Math.max(0,mtTier-2)),g=[];
      const cnt=(1+(Math.random()<.5?1:0))*(b.mut?2:1);
      for(let k=0;k<cnt;k++)g.push(pick(pl).id);
      const ex=(re,id)=>{const q=pl.filter(k=>re.test(k.id));if(hasT(x,id)&&q.length&&Math.random()<clamp(.25*talMul(x,id),.25,.85))g.push(pick(q).id)};
      ex(/^m[1-3]$/,'t38');ex(/^m([789])$/,'t39');
      g.forEach(id=>inventoryService.add(x,id,1));
      t+=', nguyên liệu: '+g.map(id=>ID[id].n).join(', ');
      if(L)L.push(t);
      if(!quiet)say(t);
      return{ok:true,sn,xp,drops};
    }else{
      const lo=Math.round(x.xp*.15),yr=2+(Math.random()*4|0);
      x.xp-=lo;x.lifeB-=yr;
      let t=`Thất bại trước ${b.fn}! mất ${lo} tu vi, giảm ${yr} năm thọ nguyên`;
      if(Math.random()<.3){x.tm=true;t+=', nhiễm tâm ma'}
      if(L)L.push(t);
      if(!quiet)say(t);
      return{ok:false};
    }
  },
  fight(x,i,quiet){
    if(x.age>=cultivationService.life(x)){if(!quiet)say('Thọ nguyên cạn kiệt, không thể lịch luyện');return{ok:false,stop:true}}
    x.age++;if(!quiet)ui.lastBoss=i;
    if(!quiet&&!ui.btlFast){
      ui.btl=this.initBattle(x,i,false);
      return{ok:false,manual:true};
    }
    this.simBattle(x,i,null);
    return this.resolve(x,this.lastB,quiet);
  },
  act(x,cmd){
    const b=ui.btl;if(!b)return;
    if(cmd==='close'){if(b.done)ui.btl=null;return}
    if(cmd==='flee'){if(!b.done){b.done=1;b.fled=1;this.resolve(x,b,false);ui.btl=null}return}
    if(cmd==='auto'){while(!b.done)this.step(x,b,this.autoPick(b,x));this.resolve(x,b,false);return}
    if(!b.done){
      this.step(x,b,cmd);
      if(b.done)this.resolve(x,b,false);
    }
  },
  sweep(x,i){
    if(!((x.advWins||{})[i]>0))return say('Cần đánh thắng ải này ít nhất 1 lần trước khi càn quét');
    let n=0,sn=0,xp=0,note='',drops=[];
    while(n<(ui.swn||10)){
      if(x.age>=cultivationService.life(x)-5){note='dừng do thọ nguyên còn dưới 5 năm';break}
      const r=this.fight(x,i,true);
      if(r.stop){note='thọ nguyên cạn kiệt';break}
      n++;
      if(!r.ok){note='gặp thất bại ở năm thứ '+n+', dừng càn quét';break}
      sn+=r.sn;xp+=r.xp;if(r.drops)drops.push(...r.drops);if(ui.swr&&r.drops&&r.drops.length){note='dừng vì rơi chiến lợi phẩm hiếm';break}
    }
    if(n===0)return say('Thọ nguyên còn dưới 5 năm, không thể càn quét');
    const dTxt=drops.length?`; chiến lợi phẩm hiếm: ${drops.join(', ')}`:'';
    say(`Càn quét ${ADV[i][0]} (${n} năm): +${sn.toLocaleString('vi-VN')} linh thạch, +${xp.toLocaleString('vi-VN')} tu vi và nguyên liệu${dTxt}${note?' ('+note+')':''}`);
  }
};

/* ===== PHƯỜNG THỊ ===== */
const AUC_NPCS=['Huyết Sát Lão Tổ','Thanh Liên Tiên Tử','Vạn Bảo Thương Chủ','Cổ Kiếm Chân Nhân','U Minh Quỷ Tôn','Thiên Cơ Tán Nhân'];
const shopService={
  gen(x){
    const l=[];
    for(let i=0;i<6;i++){
      const k=pick(['i','i','i','t','a']),u=TECH.filter(t=>!x.tech[t.id]);
      if(k==='t'&&u.length){const d=pick(u);l.push({k,id:d.id,p:Math.round(PR[d.r]*1.5),sold:0})}
      else if(k==='a'){const d=pick(TAL.filter(t=>t.r<=Math.min(6,x.realm+2)));l.push({k,id:d.id,p:PR[d.r]*2,sold:0})}
      else{const d=pick(ITEMS.filter(t=>t.r<=Math.min(6,x.realm+3)));l.push({k:'i',id:d.id,p:PR[d.r],sold:0})}
    }
    const mp=ITEMS.filter(t=>t.t==='material'&&t.r<=Math.min(5,x.realm+2));
    [5,4].forEach((sl,k)=>{if(k===0||Math.random()<.5){const d=pick(mp);l[sl]={k:'i',id:d.id,p:PR[d.r],sold:0}}});
    x.shop={age:x.age,l};
  },
  aucGen(x){
    const minR=Math.min(4,Math.max(1,x.realm)),maxR=Math.min(6,x.realm+3),lots=[];
    for(let i=0;i<3;i++){
      const tp=pick(['i','i','t','a']),u=TECH.filter(t=>!x.tech[t.id]&&t.r>=minR&&t.r<=maxR);
      let k='i',id='d6',base=100;
      if(tp==='t'&&u.length){const d=pick(u);k='t';id=d.id;base=Math.round(PR[d.r]*1.6)}
      else if(tp==='a'){const cands=TAL.filter(t=>t.r>=minR&&t.r<=maxR);const d=pick(cands.length?cands:TAL);k='a';id=d.id;base=Math.round(PR[d.r]*2)}
      else{const cands=ITEMS.filter(t=>t.t!=='material'&&t.r>=minR&&t.r<=maxR);const d=pick(cands.length?cands:ITEMS);k='i';id=d.id;base=Math.round(PR[d.r]*1.1)}
      lots.push({k,id,base,cur:base,npc:pick(AUC_NPCS),npcMax:Math.round(base*(1.35+Math.random()*.85)),round:0,done:0,won:0});
    }
    x.auc={age:x.age,lots};
    x.aucNext=x.age+10;
  },
  aucOpen(x){
    if(x.auc&&x.auc.lots.some(l=>!l.done))return say('Phiên Đấu Giá Vạn Bảo Lâu đang diễn ra!');
    if(x.stones<200)return say('Cần 200 linh thạch để mua Thiệp Mời mở sớm Đấu Giá Hội');
    x.stones-=200;this.aucGen(x);
    say('🏛 Đấu Giá Hội Vạn Bảo Lâu đã khai mạc!');
  },
  aucBid(x,idx,stepPct=.15){
    const a=x.auc,lot=a&&a.lots[idx];if(!lot||lot.done)return;
    if(x.aucRob)return say('Hãy xử lý sự kiện Chặn Đường Cướp Bảo trước!');
    const bid=Math.max(lot.cur+10,Math.round(lot.cur*(1+stepPct)));
    if(x.stones<bid)return say('Không đủ '+bid.toLocaleString('vi-VN')+' linh thạch để trả giá');
    lot.cur=bid;lot.round++;
    if(lot.round<3&&bid<lot.npcMax&&Math.random()<.65){
      const nBid=Math.min(lot.npcMax,Math.round(bid*(1.1+Math.random()*.12)));
      lot.cur=nBid;lot.npc=pick(AUC_NPCS);
      return say(`${lot.npc} lập tức hô giá đè lên ${nBid.toLocaleString('vi-VN')} linh thạch (Lượt ${lot.round}/3)!`);
    }
    x.stones-=bid;lot.done=1;lot.won=1;
    let nm='';
    if(lot.k==='t'){techniqueService.learn(x,lot.id);nm=QD[lot.id].n}
    else if(lot.k==='a'){nm=TD[lot.id].n;talentInventoryService.grant(x,lot.id,'Đấu Giá Vạn Bảo Lâu')}
    else{
      const d=ID[lot.id];nm=d.n;
      const ex=d.t==='pill'&&Math.random()<.35;
      inventoryService.add(x,lot.id,1,ex);
      if(EQT.includes(d.t)&&Math.random()<.25){const it=x.inv[x.inv.length-1];if(it)it.ql=1;nm+=' [Linh khí]'}
      if(ex)nm='Cực phẩm '+nm;
    }
    const dObj=lot.k==='t'?QD[lot.id]:lot.k==='a'?TD[lot.id]:ID[lot.id];
    if(dObj.r>=2&&Math.random()<.45){
      x.aucRob={nm,val:bid,f:foeOf(Math.max(0,x.realm))};
      say(`🏆 Trúng đấu giá ${nm}! ⚠ Vừa bước ra khỏi Vạn Bảo Lâu, có kẻ bịt mặt chặn đường cướp bảo!`);
    }else{
      say(`🏆 Chúc mừng Đạo hữu trúng đấu giá ${nm} với giá ${bid.toLocaleString('vi-VN')} linh thạch!`);
    }
  },
  aucPass(x,idx){
    const lot=x.auc&&x.auc.lots[idx];if(!lot||lot.done)return;
    lot.done=1;lot.won=0;
    say(`Đã bỏ qua lô hàng, ${lot.npc} thắng đấu giá.`);
  },
  aucRobAct(x,ch){
    const rb=x.aucRob;if(!rb)return;
    const st=characterStatsService.compute(x);
    if(ch===0){
      const myP=st.luc+st.thu,foeP=rb.f.luc+rb.f.thu;
      if(myP>=foeP*.9){
        const ls=Math.round(rb.val*.35),xp=Math.round(25*Math.pow(1.9,x.realm));
        x.stones+=ls;x.xp+=xp;x.total+=xp;x.aucRob=null;
        say(`⚔ Đánh bại kẻ cướp bảo! Bảo toàn ${rb.nm} và thu chiến lợi phẩm +${ls.toLocaleString('vi-VN')}💎, +${xp.toLocaleString('vi-VN')} tu vi!`);
      }else{
        const loss=Math.round(x.stones*.2);x.stones-=loss;x.aucRob=null;
        say(`💀 Đánh không lại, bị thương bỏ chạy mất ${loss.toLocaleString('vi-VN')} linh thạch (may mắn giữ được ${rb.nm})!`);
      }
    }else if(ch===1){
      const escCh=clamp(.4+(st.toc-rb.f.toc)*.002+st.attr.van*.004,.2,.9);
      if(Math.random()<escCh){x.aucRob=null;say(`💨 Thi triển Thân Pháp thoát thân thành công, bảo toàn ${rb.nm}!`)}
      else{const loss=Math.round(x.stones*.15);x.stones-=loss;x.aucRob=null;say(`⚠ Bỏ chạy bị truy kích, rơi mất ${loss.toLocaleString('vi-VN')} linh thạch!`)}
    }else{
      const fee=Math.min(x.stones,Math.round(rb.val*.2));x.stones-=fee;x.aucRob=null;
      say(`💎 Đã nộp ${fee.toLocaleString('vi-VN')} linh thạch lộ phí, bình an rời đi.`);
    }
  },
  tick(x){
    if(!x.shop||x.age>=x.shop.age+5)this.gen(x);
    if(x.age>=(x.aucNext||26)&&(!x.auc||x.auc.lots.every(l=>l.done))){this.aucGen(x);toast('🏛 Đấu Giá Hội Vạn Bảo Lâu đã khai mạc tại Phường Thị!')}

/* ===== HỆ THỐNG LƯU TRỮ THỐNG NHẤT (SAVE SERVICE · ADAPTER-READY) ===== */
const SV_DB='msns_saves_v1',SV_ST='slots',SV_FALLBACK='msns_slots_fb';
const b64uEnc=bytes=>{let b='';for(let i=0;i<bytes.length;i++)b+=String.fromCharCode(bytes[i]);return btoa(b).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')};
const b64uDec=str=>{const p=str.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((str.length+3)%4);const b=atob(p),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u};
const saveService={
  adapter:'local',
  fileHandle:null,
  fileName:'',
  _db(){return new Promise((res,rej)=>{if(typeof indexedDB==='undefined')return rej(0);const q=indexedDB.open(SV_DB,1);q.onupgradeneeded=()=>{if(!q.result.objectStoreNames.contains(SV_ST))q.result.createObjectStore(SV_ST,{keyPath:'id'})};q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  pack(x,slim=false){
    const c=JSON.parse(JSON.stringify(x));
    delete c.aiCfg;delete c.apiKey;delete c.cloudCfg;
    if(slim&&c.uiCfg){c.uiCfg.av='';c.uiCfg.bn='';c.uiCfg.wp=''}
    return{format:'msns_v2',saveId:c.saveId||uid(),rev:c.rev||1,updatedAt:c.updatedAt||Date.now(),data:c};
  },
  unpack(raw){
    let o=raw;
    if(typeof raw==='string'){
      const t=raw.trim();
      if(t.startsWith('{'))o=JSON.parse(t);
      else{
        try{o=JSON.parse(new TextDecoder().decode(b64uDec(t)))}
        catch(e){o=JSON.parse(decodeURIComponent(escape(atob(t))))}
      }
    }
    const d=(o&&o.format==='msns_v2'&&o.data)?o.data:o;
    if(!d||typeof d.realm!=='number'||!Array.isArray(d.tal))throw new Error('Dữ liệu save không hợp lệ');
    return d;
  },
  async listSlots(){
    try{
      const db=await this._db();
      return await new Promise((res,rej)=>{
        const tx=db.transaction(SV_ST,'readonly').objectStore(SV_ST).getAll();
        tx.onsuccess=()=>res((tx.result||[]).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)));
        tx.onerror=()=>rej(tx.error);
      });
    }catch(e){
      try{return JSON.parse(localStorage.getItem(SV_FALLBACK)||'[]').sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))}catch(er){return[]}
    }
  },
  async putSlot(slot){
    try{
      const db=await this._db();
      await new Promise((res,rej)=>{
        const tx=db.transaction(SV_ST,'readwrite');
        tx.objectStore(SV_ST).put(slot);
        tx.oncomplete=res;tx.onerror=()=>rej(tx.error);
      });
      const all=await this.listSlots();
      if(all.length>15){
        const db2=await this._db();
        const tx2=db2.transaction(SV_ST,'readwrite');
        all.slice(15).forEach(old=>tx2.objectStore(SV_ST).delete(old.id));
      }
    }catch(e){
      const all=await this.listSlots();
      const next=[slot,...all.filter(x=>x.id!==slot.id)].slice(0,5);
      try{localStorage.setItem(SV_FALLBACK,JSON.stringify(next))}catch(er){}
    }
  },
  async deleteSlot(id){
    try{
      const db=await this._db();
      await new Promise((res,rej)=>{const tx=db.transaction(SV_ST,'readwrite');tx.objectStore(SV_ST).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)});
    }catch(e){
      const next=(await this.listSlots()).filter(x=>x.id!==id);
      try{localStorage.setItem(SV_FALLBACK,JSON.stringify(next))}catch(er){}
    }
    ui.svSlots=await this.listSlots();
    toast('Đã xóa mốc lưu');
    render();
  },
  async quickSave(x,note='Lưu nhanh'){
    if(!x)return;
    x.saveId=x.saveId||uid();
    x.updatedAt=Date.now();
    x.rev=(x.rev||0)+1;
    store.save(x,true);
    const slot={id:'sv_'+Date.now()+'_'+uid().slice(-4),saveId:x.saveId,name:x.name||'Vô Danh',realm:x.realm||0,layer:x.layer||0,age:x.age||16,stones:x.stones||0,rev:x.rev,updatedAt:x.updatedAt,note,data:this.pack(x,false).data};
    await this.putSlot(slot);
    if(this.fileHandle){
      try{
        const w=await this.fileHandle.createWritable();
        await w.write(JSON.stringify(this.pack(x,ui.svSlim),null,1));
        await w.close();
        toast(`💾 Đã lưu mốc & cập nhật file ${this.fileName}`);
      }catch(e){
        this.fileHandle=null;this.fileName='';
        toast(`💾 Đã lưu mốc: ${slot.name} (${REALMS[slot.realm]} Tầng ${slot.layer+1})`);
      }
    }else{
      toast(`💾 Đã lưu mốc: ${slot.name} (${REALMS[slot.realm]} Tầng ${slot.layer+1})`);
    }
    if(ui.sv)ui.svSlots=await this.listSlots();
    render();
  },
  async loadSlot(id){
    const slots=await this.listSlots();
    const found=slots.find(x=>x.id===id);
    if(!found)return toast('Không tìm thấy mốc lưu','wn');
    ui.svPreview={data:found.data,src:'Kho trình duyệt ('+(found.note||'Mốc lưu')+')'};
    render();
  },
  exportFile(x){
    if(!x)return;
    const pkg=this.pack(x,ui.svSlim);
    const blob=new Blob([JSON.stringify(pkg,null,1)],{type:'application/json'});
    const a=document.createElement('a');
    const safeNm=(x.name||'VoDanh').replace(/[^a-zA-Z0-9_\u00C0-\u024F\u1E00-\u1EFF-]/g,'_').slice(0,20);
    a.href=URL.createObjectURL(blob);
    a.download=`MSNS_${safeNm}_${REALMS[x.realm]||''}.msns`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),1500);
    toast('⬇ Đã tải file sao lưu .msns');
  },
  async linkFile(x){
    if(!window.showSaveFilePicker)return toast('Trình duyệt này chưa hỗ trợ ghi đè file trực tiếp, hãy dùng nút Tải file .msns','wn');
    try{
      const safeNm=(x.name||'VoDanh').replace(/[^a-zA-Z0-9_-]/g,'_').slice(0,20);
      const h=await window.showSaveFilePicker({suggestedName:`MSNS_${safeNm}.msns`,types:[{description:'Mô Phỏng Nhân Sinh Save',accept:{'application/json':['.msns','.json']}}]});
      this.fileHandle=h;this.fileName=h.name||'save.msns';
      const w=await h.createWritable();
      await w.write(JSON.stringify(this.pack(x,ui.svSlim),null,1));
      await w.close();
      toast('🔗 Đã liên kết file: '+this.fileName+'. Từ nay bấm 💾 Lưu sẽ tự ghi đè file này!');
      render();
    }catch(e){if(e&&e.name!=='AbortError')toast('Không thể liên kết file','wn')}
  },
  importFile(file){
    if(!file)return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=this.unpack(String(r.result||''));
        ui.svPreview={data:d,src:'File: '+file.name};
        render();
      }catch(e){toast('❌ File save không hợp lệ hoặc bị hỏng','wn')}
    };
    r.readAsText(file);
  },
  importText(txt){
    try{
      const d=this.unpack(txt);
      ui.svPreview={data:d,src:'Mã văn bản / JSON'};
      render();
    }catch(e){toast('❌ Mã save không hợp lệ','wn')}
  },
  async createShareLink(x){
    if(!x)return;
    try{
      const json=JSON.stringify(this.pack(x,true));
      let token='';
      if(typeof CompressionStream!=='undefined'){
        const cs=new CompressionStream('gzip');
        const w=cs.writable.getWriter();
        w.write(new TextEncoder().encode(json));w.close();
        const buf=new Uint8Array(await new Response(cs.readable).arrayBuffer());
        token='gz.'+b64uEnc(buf);
      }else{
        token='u8.'+b64uEnc(new TextEncoder().encode(json));
      }
      const url=location.origin+location.pathname+'#s='+token;
      if(navigator.clipboard&&navigator.clipboard.writeText){
        await navigator.clipboard.writeText(url);
        toast(`🔗 Đã chép Link Chuyển Máy (${Math.round(url.length/102.4)/10} KB). Mở link trên máy khác để nạp!`);
      }else{
        ui.svShareUrl=url;render();
      }
    }catch(e){toast('Không tạo được link chuyển máy','wn')}
  },
  async checkHashImport(){
    try{
      const h=location.hash||'';
      if(!h.startsWith('#s='))return;
      const token=h.slice(3);
      let json='';
      if(token.startsWith('gz.')&&typeof DecompressionStream!=='undefined'){
        const ds=new DecompressionStream('gzip');
        const w=ds.writable.getWriter();
        w.write(b64uDec(token.slice(3)));w.close();
        json=new TextDecoder().decode(await new Response(ds.readable).arrayBuffer());
      }else if(token.startsWith('u8.')){
        json=new TextDecoder().decode(b64uDec(token.slice(3)));
      }else return;
      const d=this.unpack(json);
      ui.svPreview={data:d,src:'Link Chuyển Máy (#s=...)'};
      history.replaceState(null,'',location.pathname+location.search);
      render();
    }catch(e){toast('Link chuyển máy không hợp lệ hoặc trình duyệt không hỗ trợ giải nén','wn')}
  },
  applyImport(d){
    const oldUi=s&&s.uiCfg;
    s=d;
    if(oldUi&&s.uiCfg&&!s.uiCfg.av&&oldUi.av)s.uiCfg.av=oldUi.av;
    migrate();
    s.updatedAt=Date.now();
    store.save(s,true);
    ui.svPreview=null;ui.sv=false;
    toast('✅ Đã nạp dữ liệu nhân vật thành công!');
    render();
  }
};

    const t=ui.gdTour;if(!t)return;

    const vw=window.innerWidth,vh=window.innerHeight;
    if(el){
      const r0=el.getBoundingClientRect();
      if(r0.top<60||r0.bottom>vh-40)el.scrollIntoView({behavior:'smooth',block:'center'});
      const r=el.getBoundingClientRect(),pad=6;
      if(spot){
        spot.style.display='block';
        spot.style.top=Math.max(4,r.top-pad)+'px';
        spot.style.left=Math.max(4,r.left-pad)+'px';
        spot.style.width=Math.min(vw-8,r.width+pad*2)+'px';
        spot.style.height=Math.min(vh-8,r.height+pad*2)+'px';
      }
      const tw=tip.offsetWidth||340,th=tip.offsetHeight||190;
      let top=r.bottom+14;
      if(top+th>vh-12)top=Math.max(12,r.top-th-14);
      if(top+th>vh-12)top=Math.max(12,(vh-th)/2);
      let left=Math.max(12,Math.min(vw-tw-12,r.left+(r.width-tw)/2));
      tip.style.top=top+'px';tip.style.left=left+'px';tip.style.transform='none';
    }else{
      if(spot)spot.style.display='none';

const eqName=(x,t)=>{const it=x.inv.find(i=>i.u===x.eq[t]);return it?ID[it.id]:null};

function vChar(){
  const st=characterStatsService.compute(s),n=cultivationService.need(s),b=BODIES[s.body],r=ROOTS[s.root];
  const left=profileCard();
  const mid=`<div class="pn"><h3>Tu luyện</h3><div style="font-size:calc(var(--fs)*1.333);color:var(--jade)">${REALMS[s.realm]} · Tầng ${s.layer+1}</div><div class="bar"><i style="width:${clamp(s.xp/n*100,0,100)}%"></i></div><div class="row mu"><span>Tu vi ${s.xp.toLocaleString('vi-VN')}/${n.toLocaleString('vi-VN')} (tổng ${s.total.toLocaleString('vi-VN')})</span><span class='${s.age>cultivationService.life(s)*.8?'warn':''}'>Thọ nguyên ${s.age}/${cultivationService.life(s)}</span></div><div class="row"><span>Thể chất: ${b.n}</span><span>${r.n}</span></div>${s.tm?'<div class="bad">⚠ Đang nhiễm tâm ma</div>':''}</div>
  <div class="pn"><h3>Thuộc tính</h3><div class="st">${ATTR.map(k=>`<div>${SN[k]}<b>${st.attr[k]}</b><span class="mu">${st.bonus[k]?'+'+st.bonus[k]+' thêm':'gốc'}</span></div>`).join('')}<div>Sinh mệnh<b>${st.maxHp.toLocaleString('vi-VN')}</b></div><div>Linh lực<b>${st.maxMp.toLocaleString('vi-VN')}</b></div><div>Sức mạnh<b>${st.luc.toLocaleString('vi-VN')}</b></div><div>Phòng ngự<b>${st.thu.toLocaleString('vi-VN')}</b></div><div>Tốc độ<b>${st.toc.toLocaleString('vi-VN')}</b></div><div>Bạo / Xuyên giáp<b>${Math.round(st.crit*100)}% / ${Math.round(st.pen*100)}%</b></div><div>Né / ST Bạo kích<b>${Math.round((st.dodge||0)*100)}% / ${Math.round((st.critDmg||1.5)*100)}%</b></div></div><div class="mu" style="margin-top:6px">Hệ số cảnh giới: <b>×${st.realmMul.toFixed(1)}</b> · Tốc độ tu luyện thêm: +${Math.round(st.tc*100)}%</div>${(s.gfRuns||s.gfBuff||s.gfSup)?`<div class="ok" style="margin-top:4px">✨ Đạo Quả Bàn Tay Vàng (${s.gfRuns||0} kiếp): +${Math.round((s.gfBuff||0)*100)}% toàn chỉ số · -${Math.round((s.gfSup||0)*100)}% Uy Áp Cảnh Giới</div>`:''}</div>
  <div class="pn"><h3>Khí vận &amp; Nhân quả</h3><div class="row"><span>Mệnh cách</span><span>${destinyService.dest(s)}</span></div><div class="row"><span>Khí vận / Nhân quả / Nghiệp lực</span><span>${s.van} / ${s.nq} / ${s.ng}</span></div><div class="row"><span>Tỷ lệ gặp cơ duyên</span><span>${destinyService.chance(s).toFixed(1)}%</span></div>${btn('seek','','Tầm cơ duyên (30 linh thạch)')}</div>`;
  const act=talentInventoryService.active(s),right=`<div class="pn"><h3>Thiên phú kích hoạt (${act.length}/${talentInventoryService.slots(s)})</h3>${act.map(t=>{const mul=(1+.25*(t.lv-1))*(1+.08*s.body);return card(TD[t.id].r,TD[t.id].n+' Lv'+t.lv,fx(TD[t.id].e,mul)+(TD[t.id].d?'<br>'+esc(TD[t.id].d):''))}).join('')||'<span class="mu">Chưa kích hoạt thiên phú nào</span>'}</div>
  <div class="pn"><h3>Trang bị</h3>${EQT.map(t=>{const d=eqName(s,t);return `<div class="row"><span>${TL[t]}</span><span>${d?`<span style="color:${RC[d.r]}">${d.n}</span> ${btn('uneq',t,'Tháo')}`:'<span class="mu">trống</span>'}</span></div>`}).join('')}</div>`;
  return `<div class="g3"><div>${left}</div><div>${mid}</div><div>${right}</div></div><div class='pn'><h3>Thành tựu (mỗi cái +2 thuộc tính gốc vĩnh viễn)</h3><div class='grid'>${ACH.map(a=>{const o=s.ach[a[0]];return `<div class='card r${o?4:0}' style='--rc:${o?'#fbbf24':'#555'}'><b>${o?'🏆':'🔒'} ${a[1]}</b></div>`}).join('')}</div></div>`;

function vTal(){
  const sl=talentInventoryService.slots(s);
  return `<div class="pn"><h3>Thiên phú bản nguyên · ô kích hoạt ${talentInventoryService.active(s).length}/${sl}</h3><div class="mu">Ô mở rộng: Nguyên Anh, Hợp Thể, Kim Thủ Chỉ cấp 3, thành tựu hạng SSS. Thiên phú mới nhận luôn ở trạng thái chỉ sở hữu.</div></div><div class="grid">${s.tal.map(t=>{const d=TD[t.id],ok=talentInventoryService.ok(s,t);const mul=(1+.25*(t.lv-1))*(1+.08*s.body);return card(d.r,`${d.n} Lv${t.lv}`,`<b>${fx(d.e,mul)}</b>${t.lv>1||s.body>0?' <span class="ok">(hệ số ×'+mul.toFixed(2)+')</span>':''}${d.d?'<br>'+esc(d.d):''}<br>Trạng thái: ${t.on?'<span class="ok">Đang kích hoạt</span>':'Đang sở hữu'}<br>Nguồn: ${esc(t.src)}${d.rq?`<br>Điều kiện: ${d.rq.van?'khí vận gốc ≥ '+d.rq.van:'cảnh giới ≥ '+REALMS[d.rq.realm]}${ok?'':' <span class="bad">(chưa đạt)</span>'}`:''}`,btn('tgl',t.u,t.on?'Tháo':'Kích hoạt')+btn('tup',t.u,'Nâng cấp ('+talentInventoryService.cost(t)+')',t.lv>=5))}).join('')||'<span class="mu">Chưa thu thập thiên phú. Hãy chạy mô phỏng ở tab Kim Thủ Chỉ.</span>'}</div>`;
}

function vCul(){
  const c=cultivationService.check(s),major=s.layer===8;
  const pv=(major&&s.realm<REALMS.length-1)?(()=>{const st0=characterStatsService.compute(s),nx=Object.assign({},s,{realm:s.realm+1,layer:0,tm:false,van:(s.van||0)+2}),st1=characterStatsService.compute(nx),lf0=cultivationService.life(s),lf1=cultivationService.life(nx);const row=(lb,a,b)=>`<div class="row"><span>${lb}</span><span>${a.toLocaleString('vi-VN')} → <b class="ok">${b.toLocaleString('vi-VN')}</b></span></div>`;return `<div class="ainr" style="border-left-color:var(--gold);margin-top:8px"><b>✨ Dự báo lột xác khi lên ${REALMS[s.realm+1]}:</b>${row('Sinh mệnh',st0.maxHp,st1.maxHp)}${row('Linh lực',st0.maxMp,st1.maxMp)}${row('Sức mạnh',st0.luc,st1.luc)}${row('Phòng ngự',st0.thu,st1.thu)}${row('Tốc độ',st0.toc,st1.toc)}${row('Thọ nguyên tối đa',lf0,lf1)}<div class="mu" style="margin-top:4px">• Hệ số cảnh giới: ×${st0.realmMul.toFixed(1)} → <b class="ok">×${st1.realmMul.toFixed(1)}</b> · +2 toàn bộ 6 thuộc tính gốc · +2 Khí vận · Thanh lọc Tâm Ma &amp; Đan Độc</div></div>`})():'';
  return `<div class="pn"><div class="row"><span>Đan độc</span><b class="${s.toxin>40?'bad':''}">${s.toxin}/100</b></div><div class="bar${s.toxin>40?' warn':''}"><i style="width:${s.toxin}%"></i></div><div class="mu">Đan độc giảm tốc độ bế quan (tối đa -40%) và tỷ lệ đột phá. Mỗi năm bế quan giảm 1; Tịnh Tâm Đan giảm 15, Tẩy Tủy Đan giảm 60.</div></div>`
  +`<div class="pn"><h3>${REALMS[s.realm]} · Tầng ${s.layer+1}</h3><div class="bar"><i style="width:${clamp(s.xp/cultivationService.need(s)*100,0,100)}%"></i></div><div class="mu">Tu vi dư sau đột phá được giữ lại. Hết tầng 9 mới đột phá được cảnh giới lớn.</div><div class='mu ${s.age>cultivationService.life(s)*.8?'warn':''}'>Thọ nguyên ${s.age}/${cultivationService.life(s)}${s.age>cultivationService.life(s)*.8?' · SẮP CẠN':''}</div><div class='bar ${s.age>cultivationService.life(s)*.8?'warn':''}'><i style='width:${clamp(s.age/cultivationService.life(s)*100,0,100)}%'></i></div><div class="bt">${btn('train','','Bế quan (+1 tuổi)')}${btn('auto','','Bế quan liên tục')}${btn('brk','',major?'Đột phá cảnh giới':'Đột phá tầng')}</div></div><div class="pn"><h3>Điều kiện đột phá</h3>${c.map(x=>`<div class="${x[0]?'ok':'bad'}">${x[0]?'✔':'✘'} ${x[1]}</div>`).join('')}${major&&s.realm<REALMS.length-1?`<div class="mu">Tỷ lệ thành công: ${Math.round(cultivationService.chance(s)*100)}%${s.pb?' (đã có Phá Cảnh Đan)':''}. ${s.realm===8?'Đột phá Độ Kiếp Tầng 9 sẽ kích hoạt Phi Thăng Tiên Giới!':s.realm>=1?'Đột phá cảnh giới lớn phải vượt thiên kiếp (dựa vào phòng ngự).':''}</div>`:''}${pv}${s.tm?'<div class="bad">Tâm ma: Tâm cảnh -8 và chặn đột phá cảnh giới. Dùng Tịnh Tâm Đan trong Kho đồ.</div>':''}</div>`
  +(s.realm>=8?`<div class="pn"><h3>✨ Tiên Lộ &amp; Luân Hồi Chuyển Thế (Kiếp thứ ${(s.reborn||0)+1})</h3><div class="mu">Đạt tới Độ Kiếp viên mãn, ngươi có thể tiếp tục xung kích cảnh giới Tiên Giới (Chân Tiên → Hỗn Nguyên) hoặc thực hiện <b>Binh Giải Chuyển Thế</b>: quay về tuổi 16 Luyện Khí với +15 Tiên Thiên Khí Vận vĩnh viễn, +10 toàn bộ thuộc tính gốc vĩnh viễn, giữ nguyên Bản Mệnh Pháp Bảo và 1 Thiên Phú bản mệnh đã chọn.</div>${s.tal.length?`<div class="bt"><label>Thiên phú mang theo kiếp sau: <select data-chg="rb_tal">${s.tal.map(t=>`<option value="${t.u}"${ui.rbTal===t.u?' selected':''}>${TD[t.id].n} Lv${t.lv}</option>`).join('')}</select></label></div>`:''}<div class="bt">${btn('reborn','','♻ Binh Giải Chuyển Thế (New Game+)')}</div></div>`:'')
  +`<div class="pn"><h3>Nhật ký</h3>${s.log.map(l=>`<div class="mu">• ${esc(l)}</div>`).join('')||'<span class="mu">Chưa có</span>'}</div>`;
}

function vInv(){
  let l=s.inv.filter(i=>(ui.f<0||ID[i.id].r===ui.f)&&(!ui.ft||ID[i.id].t===ui.ft));
  l.sort((a,b)=>ui.sort==='n'?ID[a.id].n.localeCompare(ID[b.id].n):ui.sort==='t'?ID[a.id].t.localeCompare(ID[b.id].t):ID[b.id].r-ID[a.id].r);
  return `<div class="pn"><h3>Kho đồ · Linh thạch: ${s.stones.toLocaleString('vi-VN')} · Đan độc: ${s.toxin}/100</h3><div class="bt"><button class="chip ${ui.f<0?'on':''}" data-a="flt" data-x="-1">Tất cả</button>${RN.map((n,i)=>`<button class="chip ${ui.f===i?'on':''}" data-a="flt" data-x="${i}">${n}</button>`).join('')}<select data-chg="sort"><option value="r"${ui.sort==='r'?' selected':''}>Sắp theo phẩm chất</option><option value="n"${ui.sort==='n'?' selected':''}>Theo tên</option><option value="t"${ui.sort==='t'?' selected':''}>Theo loại</option></select></div><div class='bt'>${Object.keys(TL).map(k=>`<button class='chip ${ui.ft===k?'on':''}' data-a='ftype' data-x='${k}'>${TL[k]}</button>`).join('')}</div><div class='bt'>${[0,1,2].map(r=>btn('bsell',r,'Bán đồ ≤ '+RN[r])).join('')}${[0,1,2].map(r=>btn('bsalv',r,'♻ Rã đồ ≤ '+RN[r])).join('')}</div><div class='mu'>Nút 🔓/🔒 trên mỗi món để khóa. Bán/Rã hàng loạt chỉ xử lý trang bị, bỏ qua đồ khóa, đang mặc, Cực phẩm và Bản Mệnh.</div></div><div class="grid">${l.map(i=>{const d=ID[i.id],eq=EQT.includes(d.t),on=eq&&s.eq[d.t]===i.u,canUse=d.t==='pill'||d.t==='special';return card(d.r,`${d.n}${i.ex?' (Cực phẩm)':''}${i.ql?' ['+QL[i.ql]+']':''}${i.rf?' ★+'+i.rf:''}${s.bmWeapon&&s.bmWeapon.u===i.u?' ⚔+'+s.bmWeapon.lv:''}${i.q>1?' ×'+i.q:''}`,`${TL[d.t]} · ${d.u?esc(d.u):'<b>'+fx(d.s,eqMul(s,i))+'</b>'}${d.req?`<br>Yêu cầu: ${REALMS[d.req]}`:''}<br>ID: ${d.id}${on?'<br><span class="ok">Đang trang bị</span>':''}`,(eq?(on?btn('uneq',d.t,'Tháo'):btn('eq',i.u,'Trang bị')):(canUse?btn('use',i.u,'Sử dụng')+(i.q>=5&&!inventoryService.noBatch.includes(d.id)?btn('use5',i.u,'Dùng ×5'):''):''))+(on||i.lk?'':btn('sell',i.u,'Bán '+Math.floor(PR[d.r]*.4))+(eq?btn('salv',i.u,'♻ Rã'):''))+btn('lock',i.u,i.lk?'🔒':'🔓'))}).join('')||'<span class="mu">Trống</span>'}</div>`;
}

function vTec(){
  const L=Object.keys(s.tech).map(id=>QD[id]).filter(Boolean),f=L.filter(d=>techniqueService.lv(s,d.id)===3);
  if(!f.some(d=>d.id===ui.cr.f1))ui.cr.f1=f[0]&&f[0].id;
  if(!f.some(d=>d.id===ui.cr.f2&&d.id!==ui.cr.f1))ui.cr.f2=(f.find(d=>d.id!==ui.cr.f1)||{}).id;
  const op=k=>f.map(d=>`<option value="${d.id}"${d.id===ui.cr[k]?' selected':''}>${d.n}</option>`).join(''),A1=QD[ui.cr.f1],B1=QD[ui.cr.f2],r=A1&&B1?Math.max(A1.r,B1.r):0;
  return `<div class="mu" style="margin-bottom:8px">Trang bị tối đa 3 công pháp. Tương thích phụ thuộc linh căn và thể chất.</div><div class="grid">${L.map(d=>{const t=s.tech[d.id],l=techniqueService.lv(s,d.id),p=techniqueService.power(s,d.id);return card(d.r,d.n,`[${TIER[d.r]}] ${d.ty}<br><b>${fx(d.e,p)}</b> <span class="ok">(${Math.round(p*100)}% hiệu lực)</span>${d.d?'<br>'+d.d:''}<br>Thành thạo: ${MAST[l]} (${t.m}/250) · hệ ${d.el==='*'?'vạn năng':ELN[d.el]||d.el}${d.mb?', cần '+BODIES[d.mb].n:''}`,btn('ttg',d.id,t.eq?'Tháo':'Trang bị')+btn('tpr',d.id,t.m>=250?'Đã Viên mãn':'Tu luyện ('+(10*(d.r+1)**2)+' · Ngộ≥'+techniqueService.ngReq(d)+')',t.m>=250))}).join('')}</div>
  <div class="pn" style="margin-top:12px"><h3>Diễn Hóa Công Pháp</h3><div class="mu">Hai công pháp cùng đạt Viên mãn có thể diễn hóa thành một bộ mới mạnh hơn (tổng chỉ số ×1.1, phẩm cấp cao hơn một bậc). Tiêu tốn linh thạch và 2 điểm Ngộ Tính gốc, cần Ngộ Tính đủ cao. Hai công pháp gốc sẽ biến mất.</div>${f.length<2?'<div class="mu">Cần ít nhất 2 công pháp Viên mãn.</div>':`<div class="bt"><select data-chg="cr_f1">${op('f1')}</select><select data-chg="cr_f2">${op('f2')}</select>${btn('fuse','','Diễn Hóa ('+300*(r+1)+' linh thạch, Ngộ Tính ≥ '+(20+8*r)+')')}</div>`}</div>`;
}

function vKt(){
  const m=s.sim,fee=simFee(s);let b='';
  if(!m||m.phase==='claimed')b=`${m?'<div class="pn ok">Đã nhận thưởng mô phỏng gần nhất.</div>':''}<div class="pn">${btn('sim','','Bắt đầu mô phỏng ('+fee.toLocaleString('vi-VN')+' linh thạch)',s.stones<fee)}<div class="mu" style="margin-top:4px">Mô phỏng trong Kim Thủ Chỉ không tiêu hao thọ nguyên của Bản thể.</div></div>`;
  else if(m.phase==='pick')b=`<div class="pn"><h3>Chọn 3 trong 6 thiên phú khởi đầu (${m.pick.length}/3)</h3><div class="grid">${m.six.map(id=>{const d=TD[id];return card(d.r,d.n,fx(d.e)+(d.d?'<br>'+d.d:'')+(m.pick.includes(id)?'<br><span class="ok">Đã chọn</span>':''),btn('sp',id,m.pick.includes(id)?'Bỏ chọn':'Chọn'))}).join('')}</div><div class="bt">${btn('sgo','','Bước vào mô phỏng',m.pick.length<3)}</div></div>`;
  else if(m.phase==='run')b=runUI(m);
  else{const r=m.res;b=`<div class="pn"><h3>${m.dead?'Tử vong ('+m.dead+')':m.age>=m.life?'Thọ tận ở '+m.age+' tuổi':''} · Bình Định Nhân Sinh: hạng ${GR[r.gi]} (điểm ${r.score})${m.br?' · Nhánh Vận Mệnh Mới':''}</h3><div class="mu">Nhiệm vụ đạt: ${r.q.join('; ')||'không'}</div><div>Giữ lại thiên phú: ${r.kept.map(t=>TD[t].n).join(', ')||'không có'}</div><div class="mu">Thiên phú bị mất do chưa đủ hạng: ${m.pick.filter(t=>!r.kept.includes(t)).map(t=>TD[t].n).join(', ')||'không'}</div><div>Di sản khả dụng: ${r.xp.toLocaleString('vi-VN')} tu vi, ${r.stones.toLocaleString('vi-VN')} linh thạch, ${r.items.map(i=>ID[i].n).join(', ')}${r.tech?', công pháp '+QD[r.tech].n:''}</div><div class="bt">${legacyUI(m)}</div></div>`}
  return `<div class="pn"><h3>Kim Thủ Chỉ cấp ${s.kt}/5 · Bàn Tay Vàng</h3><div class="mu">Mỗi cấp tăng 10% tu vi &amp; linh thạch thưởng; cấp 3 (hoặc mô phỏng đạt hạng S trở lên) được chọn 2 di sản. Đạo Quả tích lũy (${s.gfRuns||0} kiếp): <b class="ok">+${Math.round((s.gfBuff||0)*100)}% toàn chỉ số</b> · <b class="ok">-${Math.round((s.gfSup||0)*100)}% Uy Áp</b>.</div>${btn('ukt','','Nâng cấp ('+200*s.kt+' linh thạch)',s.kt>=5)}</div>${aiPanel()}${b}<div class="pn"><h3>Lịch sử mô phỏng</h3>${s.hist.map(h=>`<div class="mu">${new Date(h.t).toLocaleString('vi-VN')} · hạng <b>${h.g}</b> · điểm ${h.score} · +${h.xp.toLocaleString('vi-VN')} tu vi · ${esc(h.tal.join(', ')||'không giữ thiên phú')}${h.ai?' · 🔮 '+h.ai+' biến cố Thiên Cơ':''}</div>`).join('')||'<span class="mu">Chưa có</span>'}</div>`;
}

function aiPanel(){
  const c=thienCoAI.cfg,rd=thienCoAI.ready(),op=ui.aiOpen;

  return h+`<div class="mu">API Key chỉ lưu trên trình duyệt này (localStorage <b>msns_ai_cfg</b>), tách hoàn toàn khỏi dữ liệu nhân vật — không bao giờ có trong «Xuất save». Request gửi thẳng từ trình duyệt tới nhà cung cấp bạn chọn. Nếu thiếu key, mất mạng hoặc API lỗi, game tự quay về kịch bản Cổ Điển.</div>

<div class="bt"><span class="mu">Chọn nhanh model:</span>${(ui.aiList&&ui.aiList.length?ui.aiList:AIMS[c.prov]).map(m=>`<button class="chip ${thienCoAI.model()===m?'on':''}" data-a="aimod" data-x="${esc(m)}">${esc(m)}</button>`).join('')}${c.model?`<button class="chip" data-a="aimod" data-x="">Mặc định</button>`:''}${btn('aimlist','',ui.aiBusy?'Đang quét...':'🔎 Quét model khả dụng',ui.aiBusy||(!c.key&&!(c.prov==='openai'&&c.url)))}</div>
${c.prov==='openai'?`<div class="bt"><label>Endpoint (Base URL)<input data-chg="ai_url" value="${esc(c.url)}" placeholder="https://api.openai.com/v1" autocomplete="off"></label></div>`:''}

<div class="bt"><span class="mu">Tần suất biến cố AI sau mỗi hành động:</span>${[[.4,'Thấp 40%'],[.6,'Vừa 60%'],[1,'Luôn luôn']].map(([v,l])=>`<button class="chip ${c.fq===v?'on':''}" data-a="aifq" data-x="${v}">${l}</button>`).join('')}</div>

function runUI(m){
  const nx=m.rl<8?TH[m.rl+1]:m.xp,aiE=m.cur&&m.cur.ai,e=m.sub==='act'||m.sub==='aiwait'||aiE?null:simView(m),ch=(x,l,d,dis)=>`<div class="card r0" style="--rc:#555"><b>${l}</b><div class="mu">${d}</div><div class="bt">${btn('sa',x,'Chọn',dis||ui.aiBusy)}</div></div>`;
  let h=`<div class="pn"><h3>Bảng trạng thái đời mô phỏng · tuổi ${m.age}/${m.life}${thienCoAI.on(m)?' · <span class="ok">🔮 Thiên Cơ AI</span>':''}</h3><div class="row"><span>Cảnh giới mô phỏng</span><b>${REALMS[m.rl]}</b></div><div class="bar"><i style="width:${clamp((m.xp-TH[m.rl])/Math.max(1,nx-TH[m.rl])*100,0,100)}%"></i></div><div class="row mu"><span>Tu vi ${m.xp}${m.rl<8?' / '+nx:''}</span><span>Thiện ${m.good} · Ác ${m.evil}</span></div><div class="row"><span>Thể trạng</span><b class="${m.st==='ok'?'ok':'bad'}">${SL[m.st]}</b></div>${m.st==='hurt'?'<div class="mu bad">Trọng thương làm tăng mạnh nguy cơ tử vong khi ra ngoài. Hãy Bế Quan để chữa trị.</div>':''}${!m.cal.done&&m.cal.age-m.age<=6?'<div class="warn">⚠ Linh cảm có đại kiếp sắp ập đến...</div>':''}<div class="mu">Dấu ấn nhân quả: ${Object.keys(m.flags).map(f=>`<span class="chip">${esc(FL[f]||f)}</span>`).join(' ')||'chưa có'}</div>${m.aiSummary?`<div class="mu">🧠 Trí nhớ Thiên Cơ: <i>${esc(m.aiSummary)}</i></div>`:''}<div class="mu">Túi Càn Khôn (${m.bag.length}/8): ${m.bag.map(bn).join(', ')||'trống'}</div><div class="mu">Hảo cảm: ${NP.filter(n=>m.bond[n.id]).map(n=>n.n+' '+m.bond[n.id]).join(' · ')||'chưa quen ai'}</div></div>`;
  if(m.aiLast){const L=m.aiLast;h+=`<div class="pn"><h3>📜 Diễn biến · ${esc(L.t)}</h3><div class="mu">Ngươi ${L.c?'tự quyết':'chọn'}: «${esc(L.l)}» → <b class="${L.ok?'ok':'bad'}">${L.ok?'thành công':'thất bại'}</b> (${L.g>=0?'+':''}${L.g} tu vi)</div><div class="ainr${L.ok?'':' bad'}">${esc(L.n)}</div>${L.tags&&L.tags.length?`<div class="bt">${L.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>`:''}</div>`}
  if(m.sub==='aiwait')h+=`<div class="pn"><h3>Biến cố</h3><div class="aiw" role="status" aria-live="polite"><i></i><span>Đang diễn toán thiên cơ... Thiên Đạo đang dệt sợi nhân quả cho năm ${m.age} tuổi</span></div></div>`;
  else if(aiE){const c=m.cur,RS=r=>r<.2?'<span class="ok">an toàn</span>':r<.45?'<span class="mu">rủi ro vừa</span>':'<span class="bad">hiểm cảnh</span>',NPn=c.npc?NP.find(n=>n.id===c.npc):null;
    h+=`<div class="pn"><h3>🔮 Biến cố Thiên Cơ · ${esc(c.t)}${NPn?' · <span class="mu">'+esc(NPn.n)+'</span>':''}</h3><p class="mu"><i>${esc(c.pre||'')}</i></p><p>【Năm ${m.age} tuổi】: ${esc(c.d)}</p>${ui.aiBusy?`<div class="aiw" role="status" aria-live="polite"><i></i><span>Đang diễn toán thiên cơ — phán quyết «${esc(ui.aiPick||'')}»...</span></div>`:''}<div class="bt">${c.o.map((o,i)=>`<button class="aich" data-a="sc" data-x="${i}"${ui.aiBusy?' disabled':''}><span>${esc(o.label)}</span><span class="mu" style="font-size:.8em">${o.style?esc(o.style)+' · ':''}${RS(o.risk)}</span></button>`).join('')}</div><div class="aiin"><input id="ai_in" data-chg="ai_in" maxlength="160" autocomplete="off" placeholder="✍ Hành động tự do, vd: Giả chết, đợi đêm xuống trộm lệnh bài rồi giá họa cho Huyết Ma Tông" value="${esc(ui.aiIn||'')}"${ui.aiBusy?' disabled':''}>${btn('aiact','','⚡ Hành động',ui.aiBusy)}</div><div class="mu" style="margin-top:4px">Thiên Đạo phán xét hành động tự do theo thực lực, thiên phú và nhân quả hiện tại — hành động phi lý sẽ phải trả giá.</div></div>`}
  else if(!e)h+=`<div class="pn"><h3>Hành động năm nay</h3><div class="grid">`+ch(0,'Bế Quan Khổ Tu (3 năm)','Tu vi tăng mạnh, nâng cảnh giới mô phỏng, chữa thương. An toàn, ít cơ duyên.')+ch(1,'Nhập Thế Lịch Luyện (2 năm)','Dễ gặp kỳ ngộ, nhặt bảo vật, chạm trán yêu thú hoặc tà tu. Rủi ro thương vong cao.')+ch(2,'Du Ngoạn Hồng Trần (2 năm)','Kết giao NPC định mệnh, tăng hảo cảm và Thiện/Ác, mở tuyến cốt truyện.')+ch(3,'Thăm Dò Bí Cảnh (2 năm)','Thưởng cực lớn nhưng dễ kích hoạt kiếp nạn. '+(clue(m)?'Đã có manh mối.':'🔒 Cần dấu ấn manh mối hoặc khí vận ≥ 45.'),!clue(m))+`</div></div>`;
  else h+=`<div class="pn"><h3>Biến cố</h3><p class="mu"><i>${esc(m.cur.pre||'')}</i></p><p>${e[0]}</p><div class="bt">${btn('sc',0,e[1][0])}${btn('sc',1,e[2][0])}${e.hid?btn('sc',2,'✨ '+e.hid):e.lock||''}</div></div>`;
  return h+`<div class="pn"><h3>Nhật ký cuộc đời</h3>${m.log.slice(-14).reverse().map(l=>`<div class="mu">• ${l}</div>`).join('')}</div>`;
}

const LG=[['xp','Truyền Thừa Tu Vi'],['en','Kinh nghiệm chiến đấu & lĩnh ngộ'],['ky','Kỳ ngộ & thiên phú bản mệnh'],['gf','Đạo Quả Bàn Tay Vàng (Phá Giới & Tẩy Cốt)']];
function lgText(m,k){const r=m.res;if(k==='xp')return'+'+r.xp.toLocaleString('vi-VN')+' tu vi, +'+r.stones.toLocaleString('vi-VN')+' linh thạch';if(k==='en')return'Thành thạo mọi công pháp +'+10*(r.gi+1)+', ngộ tính và tâm cảnh gốc +'+(1+Math.floor(r.gi/3))+'; phá bình cảnh nếu đang kẹt ở tầng 9, xóa tâm ma';if(k==='gf')return'+'+Math.round((r.gfBuffGain||.04)*100)+'% toàn chỉ số vĩnh viễn, +1 năm thuộc tính gốc (Thể/Linh/Ngộ/Thần/Tâm)'+(r.gfSupGain?', +5% Kháng Uy Áp Cảnh Giới':'')+(r.washChance?`, ${Math.round(r.washChance*100)}% Tẩy Cốt nâng Linh Căn/Đạo Thể`:'');return'Giữ thiên phú: '+(r.kept.map(t=>TD[t].n).join(', ')||'(không đủ hạng)')+'; '+r.items.length+' vật phẩm'+(r.tech?', bí tịch '+QD[r.tech].n:'')}
function legacyUI(m){
  const n=(s.kt>=3||(m.res&&m.res.gi>=5))?2:1;
  let h='<div class=\'mu\'>Chọn tối đa '+n+' trong 4 di sản (Kim Thủ Chỉ cấp 3+ hoặc đạt hạng S+ được chọn 2). Món không chọn sẽ mất.</div>'+LG.map(l=>{const on=m.lg.includes(l[0]);return '<div class=\'card r'+(on?4:0)+'\' style=\'--rc:'+(on?'#fbbf24':'#555')+';margin:6px 0\'><b>'+l[1]+'</b><div class=\'mu\'>'+lgText(m,l[0])+'</div><div class=\'bt\'>'+btn('lg',l[0],on?'Bỏ chọn':'Chọn')+'</div></div>'}).join('')+btn('claim','','Chốt di sản (một lần)',!m.lg.length);
  if(m.res.gi>=5&&m.bag&&m.bag.length)h+='<div class="mu" style="width:100%">Hạng A trở lên: nếu chọn «Kỳ ngộ», được mang thêm 1 món trong Túi Càn Khôn ra ngoài:</div>'+m.bag.map((b,i)=>`<div class="row" style="width:100%"><span>${esc(bn(b))}</span>${btn('lgb',i,(m.lb||0)===i?'✔ Đã chọn':'Chọn')}</div>`).join('');
  return h;
}

}
