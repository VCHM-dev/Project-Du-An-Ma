    <div class="ct"><b>☯ ${esc(s.name)}</b><span class="tag">${REALMS[s.realm]}</span></div>
    <div class="row mu"><span>HP ${Math.max(0,b.hp).toLocaleString('vi-VN')}/${b.maxHp.toLocaleString('vi-VN')}</span><span>Lực ${b.luc.toLocaleString('vi-VN')} · Thủ ${b.thu.toLocaleString('vi-VN')}</span></div>
    <div class="bar"><i style="width:${hpP}%"></i></div>
    <div class="row mu" style="margin-top:4px"><span>Linh lực ${b.mp.toLocaleString('vi-VN')}/${b.maxMp.toLocaleString('vi-VN')}</span><span>Tốc ${b.toc.toLocaleString('vi-VN')}</span></div>
    <div class="bar"><i style="width:${mpP}%;background:linear-gradient(90deg,#38bdf8,#8b5cf6)"></i></div>
    <div class="bt">${pTags.map(t=>`<span class="chip">${t}</span>`).join('')||'<span class="mu">Trạng thái bình thường</span>'}</div>
  </div>
  <div class="card r${b.mut?5:3}" style="--rc:${b.mut?b.mut.c:'var(--vio)'}">
    <div class="ct"><b>${esc(b.fn)}</b><span class="tag">Hệ ${ELN[b.f.el]}</span></div>
    <div class="row mu"><span>HP ${Math.max(0,b.fh).toLocaleString('vi-VN')}/${b.fMaxHp.toLocaleString('vi-VN')}</span><span>Lực ${b.f.luc.toLocaleString('vi-VN')} · Thủ ${b.f.thu.toLocaleString('vi-VN')}</span></div>
    <div class="bar warn"><i style="width:${fhP}%"></i></div>
    <div class="row mu" style="margin-top:4px"><span>Tốc độ ${b.f.toc.toLocaleString('vi-VN')}</span><span>${b.counter?'<b class="ok">Bị khắc hệ</b>':'Cân bằng'}</span></div>
    <div class="bt">${fTags.map(t=>`<span class="chip">${t}</span>`).join('')||'<span class="mu">Chưa dính hiệu ứng</span>'}</div>
  </div>
</div>
${!b.done?`<div class="pn" style="margin-bottom:8px"><h3>Chiêu thức đấu pháp</h3>
<div class="bt">
  ${btn('btla','atk','🗡 Công Kích Thường (+Linh lực)')}
  ${btn('btla','guard',`🛡 Hộ Thể Kim Quang (${gCost.toLocaleString('vi-VN')} MP${b.guardCd?` · CD ${b.guardCd}`:''})`,b.guardCd>0||b.mp<gCost)}
  ${b.skills.map(sk=>{const cost=Math.round(b.maxMp*sk.mpCost),cd=b.cd[sk.id]||0;return `<button class="aich" data-a="btla" data-x="sk_${sk.id}"${cd>0||b.mp<cost?' disabled':''}><span>⚡ ${esc(sk.n)} (×${sk.mul})</span><span class="mu" style="font-size:.78em">${cost.toLocaleString('vi-VN')} MP${cd?` · Hồi ${cd} hiệp`:''} · ${sk.tag}</span></button>`}).join('')}
</div>
<div class="mu" style="margin-top:8px;font-size:.82em">💊 Linh Đan thực chiến (còn ${b.pills}/2 lượt · Cực phẩm không tốn lượt):</div>
<div class="bt" style="margin-top:4px">
  ${btn('btla','pill',`💊 Hồi Phục (${hCnt})${hasEx(['d1','d3','d12'])?' ★':''}`,!hCnt||b.pills<=0)}
  ${btn('btla','pill_d14',`🔥 Bạo Nguyên (${d14Cnt})${hasEx(['d14'])?' ★':''}`,!d14Cnt||b.pills<=0)}
  ${btn('btla','pill_d15',`🛡 Kim Cang (${d15Cnt})${hasEx(['d15'])?' ★':''}`,!d15Cnt||b.pills<=0)}
  ${btn('btla','pill_d16',`🌿 Giải Độc (${d16Cnt})${hasEx(['d16'])?' ★':''}`,!d16Cnt||b.pills<=0)}
</div>
<div class="bt" style="margin-top:6px">
  ${btn('btla','tb_b1',`🧭 Nghịch Chuyển Bàn (${b1Cnt})`,!b1Cnt||b.tb1||b.counter)}
  ${btn('btla','tb_b2',`🔱 Tỏa Linh Bàn (${b2Cnt})`,!b2Cnt||b.tb2||!b.mut)}
  ${btn('btla','auto','🤖 Tự Động Đấu Pháp')}
  ${btn('btla','flee','🏃 Rút Lui (-5% tu vi)')}
</div></div>`:`<div class="pn ${b.win?'ok':'bad'}" style="margin-bottom:8px"><h3>${b.win?'🏆 Đại Thắng Khải Hoàn!':'💀 Chiến Bại Trọng Thương'}</h3><div class="mu">${esc(b.logs[b.logs.length-1]||'')}</div><div class="bt">${btn('btla','close','Đóng chiến trường')}</div></div>`}
<div class="pn" style="margin:0;max-height:175px;overflow-y:auto"><h3>Diễn biến hiệp đấu</h3>${b.logs.slice().reverse().map(l=>`<div class="mu">• ${esc(l)}</div>`).join('')}</div>
</div></div>`;
}

function vAdv(){
  const lb=ui.lastBoss!=null&&ADV[ui.lastBoss]?ui.lastBoss:null,sn=STANCES[clamp(s.stance||0,0,2)];
  const eqSk=Object.keys(s.tech).filter(id=>s.tech[id]&&s.tech[id].eq&&QD[id]).map(id=>skillOf(s,id)).filter(Boolean);
  return `<div class='pn'><h3>Lịch Luyện · mỗi lần khiêu chiến tốn 1 năm tuổi</h3><div class='mu'>Thắng: linh thạch, tu vi, nguyên liệu chế tạo, có thể rơi trang bị, bí tịch. Có 22% cơ hội chạm trán <b>Yêu Thú Biến Dị</b> (thưởng ×1.5 linh thạch &amp; tu vi, ×2 nguyên liệu và tăng mạnh tỷ lệ rơi bảo vật).${ui.forceMut?' <b class="ok">⚡ Trận kế tiếp chắc chắn gặp Yêu Thú Biến Dị!</b>':''}</div>
  <div class='bt' style='margin-top:8px'><span class='mu'>Tâm pháp giao chiến:</span>${STANCES.map(st=>`<button class='chip ${(s.stance||0)===st.id?'on':''}' data-a='stance' data-x='${st.id}' title='${esc(st.d)}'>${st.n}</button>`).join('')}</div>
  <div class='mu' style='margin-top:4px'>Đang vận dụng: <b>${sn.n}</b> (${sn.d}) · Tuyệt kỹ chủ động: ${eqSk.map(k=>`<b>${esc(k.n)}</b> <span class="mu">[${k.tag}]</span>`).join(', ')||'chưa trang bị công pháp'}</div>
  </div><div class='pn'><div class='bt'>${btn('btlfast','',ui.btlFast?'⚡ Chế độ: Khiêu chiến nhanh (Tự động)':'⚔ Chế độ: Đánh tay chiến thuật (Mở Chiến Trường)')}<span class='mu'>Số năm càn quét:</span>${[10,25,50,100].map(n=>`<button class='chip ${(ui.swn||10)===n?'on':''}' data-a='swn' data-x='${n}'>${n}</button>`).join('')}${btn('swr','',ui.swr?'☑ Dừng khi rơi đồ hiếm':'☐ Dừng khi rơi đồ hiếm')}</div></div><div class='grid'>${ADV.map((a,i)=>{const rIdx=Math.min(i,REALMS.length-1),f=foeOf(i),w=(s.advWins||{})[i]||0,diff=i-s.realm,gap=diff<=0?'<span class="chip on">Ngang cấp</span>':diff<=2?`<span class="chip" style="border-color:#f59e0b;color:#fbbf24">Vượt ${diff} cảnh giới</span>`:`<span class="chip" style="border-color:#f43f5e;color:#fb7185">Uy áp tuyệt đối</span>`;return `<div class="card r${Math.min(i,6)}" style="--rc:${RC[Math.min(i,6)]}">${bossBanner(i,w)}<div class="ct"><b>${a[0]} · ${REALMS[rIdx]}</b><span class="tag">${RN[Math.min(i,6)]}</span></div><div class="mu">Lực ${f.luc.toLocaleString('vi-VN')} · Thủ ${f.thu.toLocaleString('vi-VN')} · Tốc ${f.toc.toLocaleString('vi-VN')} · HP ${f.hp.toLocaleString('vi-VN')}</div><div class="bt" style="margin-top:4px">${gap}</div><div class="bt">${btn('adv',i,'Khiêu chiến')}${w>0?btn('sweep',i,'Càn quét (×'+(ui.swn||10)+' năm)'):''}</div></div>`}).join('')}</div><div class='pn'><h3>Nhật ký giao chiến${lb!=null?' · '+ADV[lb][0]:''}</h3>${lb!=null?`<div style="max-width:340px;margin-bottom:8px;border-radius:8px;overflow:hidden;border:1px solid var(--ln)">${bossBanner(lb,(s.advWins||{})[lb]||0)}</div>`:''}${(ui.al||[]).map(l=>`<div class='mu'>${esc(l)}</div>`).join('')||'<span class=\'mu\'>Chưa giao chiến</span>'}</div>`;
}

function vShop(){
  const l=s.shop.l,nx=Math.max(0,s.shop.age+5-s.age),aucNx=Math.max(0,(s.aucNext||26)-s.age);
  let out=`<div class='pn'><h3>Phường Thị · Linh thạch: ${s.stones.toLocaleString('vi-VN')}</h3><div class='mu'>Hàng tự làm mới sau ${nx} năm tuổi nữa. Muốn bán đồ, vào tab Kho đồ (giá bán bằng 40% giá gốc theo phẩm chất).</div>${btn('shopr','','Làm mới ngay (50 linh thạch)')}</div>`;
  if(s.aucRob){
    const rb=s.aucRob,fee=Math.min(s.stones,Math.round(rb.val*.2));
    out+=`<div class='pn' style='border-color:#f43f5e'><h3>⚠ Phục Kích Chặn Đường Cướp Bảo!</h3>
      <div class='mu'>Vừa mang theo <b>${esc(rb.nm)}</b> rời khỏi Vạn Bảo Lâu, một tên tán tu bịt mặt (Lực ${rb.f.luc.toLocaleString('vi-VN')} · Thủ ${rb.f.thu.toLocaleString('vi-VN')}) lao ra chặn đường!</div>
      <div class='bt'>${btn('auc_rob',0,'⚔ Nghênh Chiến Hộ Bảo')}${btn('auc_rob',1,'💨 Thi Triển Thân Pháp Bỏ Chạy')}${btn('auc_rob',2,`💎 Nộp Lộ Phí (${fee.toLocaleString('vi-VN')}💎)`)}</div>
    </div>`;
  }
  const activeAuc=s.auc&&s.auc.lots.some(x=>!x.done);
  out+=`<div class='pn'>${archBanner('auc','🏛 Đấu Giá Hội Vạn Bảo Lâu',activeAuc?'<span class="ok">🔥 Đang diễn ra</span>':btn('auc_open','','Mở Sớm Đấu Giá (200💎)',s.stones<200))}
    <div class='mu'>Đấu giá định kỳ mỗi 10 năm tuổi (kỳ kế tiếp: ${aucNx>0?'sau '+aucNx+' năm':'sắp khai mạc'}). Trúng bảo vật quý có thể kích hoạt kỳ ngộ bị cướp bảo!</div>
    ${s.auc?`<div class='grid' style='margin-top:8px'>${s.auc.lots.map((o,i)=>{const d=o.k==='t'?QD[o.id]:o.k==='a'?TD[o.id]:ID[o.id],ty=o.k==='t'?'Bí tịch: '+d.ty:o.k==='a'?'Mảnh thiên phú':TL[d.t],b15=Math.max(o.cur+10,Math.round(o.cur*1.15)),b30=Math.max(o.cur+20,Math.round(o.cur*1.3));return card(d.r,d.n,`${ty}<br>${o.k==='i'?esc(d.u||fx(d.s)):fx(d.e)}<br>Giá hiện tại: <b>${o.cur.toLocaleString('vi-VN')}💎</b> (${o.done?(o.won?'<span class="ok">Bạn đã trúng!</span>':`<span class="bad">${o.npc} đã thắng</span>`):`Đang giữ giá: ${o.npc} · Lượt ${o.round}/3`})`,o.done?'':btn('auc_bid',i,`Trả +15% (${b15.toLocaleString('vi-VN')}💎)`,s.stones<b15||!!s.aucRob)+btn('auc_bid30',i,`Trả +30% (${b30.toLocaleString('vi-VN')}💎)`,s.stones<b30||!!s.aucRob)+btn('auc_pass',i,'Bỏ qua'))}).join('')}</div>`:''}
  </div>`;
  return out+`<div class='grid'>${l.map((o,i)=>{const d=o.k==='t'?QD[o.id]:o.k==='a'?TD[o.id]:ID[o.id],ty=o.k==='t'?'Bí tịch: '+d.ty:o.k==='a'?'Mảnh thiên phú':TL[d.t];return card(d.r,d.n,`${ty}<br>${o.k==='i'?esc(d.u||fx(d.s)):fx(d.e)}<br>Giá ${o.p} linh thạch${o.sold?' · <span class=\'bad\'>Đã bán</span>':''}`,btn('buy',i,'Mua',o.sold||s.stones<o.p))}).join('')}</div>`;
}

ui.cr={};
const mt=l=>l.map(m=>`<span class="${mq(s,m[0])>=m[1]?'ok':'bad'}">${ID[m[0]].n} ${mq(s,m[0])}/${m[1]}</span>`).join(', '),can=(k,r,mi,sc)=>s.crafts[k].lv>=mi&&r.every(m=>mq(s,m[0])>=m[1])&&s.stones>=sc;
const sel=(k,l)=>`<select data-chg="cr_${k}">${l.map(i=>`<option value="${i.u}"${i.u===ui.cr[k]?' selected':''}>${ID[i.id].n}${i.ql?' ['+QL[i.ql]+']':''}${i.rf?' ★+'+i.rf:''}</option>`).join('')}</select>`,pk=(k,l)=>{if(!l.some(i=>i.u===ui.cr[k]))ui.cr[k]=l[0]&&l[0].u};

function vCraft(){
  const c=s.crafts,eqs=s.inv.filter(i=>['weapon','artifact'].includes(ID[i.id].t)),all=s.inv.filter(i=>EQT.includes(ID[i.id].t)&&(i.ql||0)<3),rfs=s.inv.filter(i=>EQT.includes(ID[i.id].t)&&(i.rf||0)<10);
  pk('kq',all);pk('bm',eqs);pk('rf',rfs);
  const P=(k,d,b)=>{const x=c[k],nx=40*x.lv*x.lv;return`<div class="pn"><h3>${CN[k]} · ${GN[x.lv]}</h3><div class="mu">${d}</div>`+(x.lv?`<div class="bar"><i style="width:${x.lv>=9?100:clamp(x.xp/nx*100,0,100)}%"></i></div><div class="mu">Kinh nghiệm ${x.lv>=9?'(tối đa)':x.xp+'/'+nx}</div></div>`+b:btn('cl',k,'Học nghề (200 linh thạch)',s.stones<200)+'</div>')};
  const bm=s.bmWeapon,bi=bm&&s.inv.find(i=>i.u===bm.u),cf=ui.cf||'all';
  const tabs=[['all','Tất cả'],['dan','Luyện Đan'],['khi','Luyện Khí'],['tran','Trận Pháp'],['bm','Bản Mệnh']];
  let out=`<div class="pn"><h3>Bách Nghệ · Linh thạch: ${s.stones.toLocaleString('vi-VN')}</h3><div class="mu">Nguyên liệu nhặt được khi Lịch Luyện, mua ở Phường Thị hoặc kiếm trong mô phỏng. Đan độc hiện tại: ${s.toxin}/100.</div><div class="bt">${tabs.map(t=>`<button class="chip ${cf===t[0]?'on':''}" data-a="cflt" data-x="${t[0]}">${t[1]}</button>`).join('')}</div></div>`;
  if(cf==='all'||cf==='dan')out+=P('dan','Luyện đan từ Linh Thảo và Yêu Đan. Tỷ lệ thành công phụ thuộc cấp nghề, Ngộ Tính, Thần Hồn và thiên phú; có cơ hội ra Đan Văn (cực phẩm, hiệu quả gấp đôi).',`<div class="grid">${DR.map((r,i)=>{const d=ID[r[0]],dis=!can('dan',r[2],r[1],r[3]);return card(d.r,d.n,`${esc(d.u)}<br>Nguyên liệu: ${mt(r[2])}<br>${r[3]} linh thạch · cần ${GN[r[1]]} · thành công ${Math.round(cch(s,'dan',r[4],r[1])*100)}%`,btn('dc',i,'Luyện chế',dis)+btn('dc5',i,'×5',dis))}).join('')}</div>`);
  if(cf==='all'||cf==='khi')out+=P('khi','Rèn đúc trang bị từ Khoáng Thạch và Tinh Thiết, nâng phẩm chất (+25%/bậc), hoặc Tinh luyện (+1 → +10, mỗi cấp +10% chỉ số).',`<div class="grid">${KR.map((r,i)=>{const d=ID[r[0]],dis=!can('khi',r[2],r[1],r[3]);return card(d.r,d.n,`${fx(d.s)}<br>Nguyên liệu: ${mt(r[2])}<br>${r[3]} linh thạch · cần ${GN[r[1]]} · thành công ${Math.round(cch(s,'khi',r[4],r[1])*100)}%`,btn('kc',i,'Rèn đúc',dis)+btn('kc5',i,'×5',dis))}).join('')}</div><div class="pn"><h3>Nâng phẩm chất trang bị</h3><div class="bt">${all.length?sel('kq',all):'<span class="mu">Chưa có trang bị phù hợp</span>'}${btn('kq','','Nâng phẩm',!all.length)}</div>${(()=>{const it=all.find(i=>i.u===ui.cr.kq);if(!it)return'';const U=QU[it.ql||0];return`<div class="mu">Lên ${QL[(it.ql||0)+1]}: ${mt(U[1])} · ${U[2]} linh thạch · cần ${GN[U[0]]} · thành công ${Math.round(cch(s,'khi',U[3],U[0])*100)}%</div>`})()}</div><div class="pn"><h3>🔨 Tinh luyện trang bị (+1 → +10)</h3><div class="mu">Cường hóa mọi loại trang bị (Vũ khí, Pháp bảo, Giáp, Phụ kiện). Mỗi cấp +10% chỉ số, thất bại không vỡ đồ.</div><div class="bt">${rfs.length?sel('rf',rfs):'<span class="mu">Chưa có trang bị dưới ★+10</span>'}${(()=>{const it=rfs.find(i=>i.u===ui.cr.rf);if(!it)return btn('rf','','Tinh luyện',true);const lv=it.rf||0,R=rfCost(lv),dis=!can('khi',R[1],R[0],R[2]);return btn('rf','','Tinh luyện ★+'+(lv+1),dis)+btn('rf5','','Tinh luyện ×5',dis)})()}</div>${(()=>{const it=rfs.find(i=>i.u===ui.cr.rf);if(!it)return'';const lv=it.rf||0,R=rfCost(lv);return`<div class="mu">Hiện tại: <b>★+${lv} (+${lv*10}%)</b> → Tiếp theo: <b class="ok">★+${lv+1} (+${(lv+1)*10}%)</b> · ${mt(R[1])} · ${R[2]} linh thạch · cần ${GN[R[0]]} · thành công ${Math.round(cch(s,'khi',R[3],R[0])*100)}%</div>`})()}</div><div class="pn"><h3>🔥 Dung luyện trang bị dư (3 đổi 1 lên bậc)</h3><div class="mu">Gộp 3 trang bị dư (không khóa, không đang mặc, không Bản Mệnh) cùng phẩm chất thành 1 trang bị ngẫu nhiên phẩm chất cao hơn 1 bậc (có 15% ra sẵn Linh khí).</div><div class="bt">${[0,1,2,3,4,5].map(r=>{const eqU=Object.values(s.eq),cnt=s.inv.filter(i=>EQT.includes(ID[i.id].t)&&ID[i.id].r===r&&!i.lk&&!eqU.includes(i.u)&&!(s.bmWeapon&&s.bmWeapon.u===i.u)).length,sc=60*(r+1)*(r+1);return btn('smelt',r,`${RN[r]} (${cnt}/3) → ${RN[r+1]} · ${sc}💎`,cnt<3||s.stones<sc)}).join('')}</div></div>`);
  if(cf==='all'||cf==='tran')out+=P('tran','Dùng linh thạch và trận kỳ bố trí trận pháp động phủ, hoặc khắc chế Trận Bàn tiêu hao mang vào Chiến Trường thực chiến.',`<div class="grid">${AR.map(a=>{const on=s.activeArray===a[0],built=s.arrays[a[0]],sc=Math.round(a[4]*(hasT(s,'t35')?.7:1));return card(on?4:1,a[1],`${a[5]}${hasT(s,'t35')?' (+20% nhờ Trận Đạo Tông Sư)':''}<br>${built?'<span class="ok">Đã bố trí</span>':'Nguyên liệu: '+mt(a[3])+' · '+sc+' linh thạch · cần '+GN[a[2]]}${on?'<br><span class="ok">Đang kích hoạt</span>':''}`,built?btn('aa',on?'':a[0],on?'Tắt trận':'Kích hoạt'):btn('ab',a[0],'Bố trí',!can('tran',a[3],a[2],sc)))}).join('')}</div><div class="pn"><h3>Chế Tạo Trận Bàn Thực Chiến</h3><div class="grid">${TR.map((r,i)=>{const d=ID[r[0]],dis=!can('tran',r[2],r[1],r[3]);return card(d.r,d.n,`${esc(d.u)}<br>Nguyên liệu: ${mt(r[2])}<br>${r[3]} linh thạch · cần ${GN[r[1]]} · thành công ${Math.round(cch(s,'tran',r[4],r[1])*100)}%`,btn('tc',i,'Khắc trận',dis)+btn('tc5',i,'×5',dis))}).join('')}</div></div>`);

const BG={c:null,m:null,bus:null,tm:0,nx:0,n:0,k:0,st:{},au:null,url:null,on:0},BNM=['Thanh Tâm Phổ','Vân Hải Tiên Sơn','U Minh Huyền Cảnh'],PEN=[[1,9/8,5/4,3/2,5/3],[1,6/5,4/3,3/2,9/5]],SPB=[1,1.25,1.7],B0=261.63;

  for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i&3)*8);
  w[l>>2]|=0x80<<(24-(l&3)*8);w[((l+8>>6)<<4)+15]=l*8;
  let H=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225],W=new Array(64);
  const R=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<w.length;i+=16){
    let [a,c,d,e,f,g,h,k]=H;
    for(let j=0;j<64;j++){
      W[j]=j<16?(w[i+j]|0):(((R(W[j-2],17)^R(W[j-2],19)^(W[j-2]>>>10))+W[j-7]+(R(W[j-15],7)^R(W[j-15],18)^(W[j-15]>>>3))+W[j-16])|0);

      k=h;h=g;g=f;f=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0;
    }

}

async function verifyAdminPwd(){

  const inp=$('adm-pwd'),val=inp?inp.value:'';

  let hex='';
  if(window.crypto&&crypto.subtle){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(val));hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}

  if(hex===ADMIN_HASH){

function runLab(){
  const bak=s,um=ui.msg,rows=[];s=JSON.parse(JSON.stringify(bak));s.log=[];
  const prep=()=>{
    EQT.forEach(t=>{
      const cands=s.inv.filter(i=>ID[i.id].t===t).sort((a,b)=>(ID[b.id].r*10+(b.ql||0))-(ID[a.id].r*10+(a.ql||0)));
      if(cands[0]&&s.eq[t]!==cands[0].u)s.eq[t]=cands[0].u;
    });
    const useIf=(id,cond)=>{if(!cond)return;const it=s.inv.find(i=>i.id===id&&i.q>0);if(it)inventoryService.use(s,it.u,1)};
    useIf('d3',s.tm);useIf('d11',s.toxin>=70);
    useIf('d13',s.age>cultivationService.life(s)*.85);useIf('d6',s.age>cultivationService.life(s)*.85);
    if(s.xp<cultivationService.need(s)&&s.toxin<60){useIf('d12',true);useIf('d1',true)}
  };
  let t0=s.age,f=0,it=0,farm=0,stop='Hoàn tất';ui._inLab=1;
  try{
    while(it++<6000&&s.realm<REALMS.length-1){
      if(s.age>=cultivationService.life(s)){stop='Hết thọ nguyên ở '+REALMS[s.realm];break}
      prep();
      const c=cultivationService.check(s);
      if(c.every(k=>k[0])){const r0=s.realm;cultivationService.go(s);farm=0;if(s.realm>r0){rows.push([REALMS[s.realm],s.age-t0,f,s.stones]);t0=s.age;f=0}else if(s.layer===8)f++}
      else if(s.xp<cultivationService.need(s))cultivationService.train(s);
      else{if(++farm>300){stop='Kẹt ở '+REALMS[s.realm]+' tầng 9, thiếu: '+c.filter(k=>!k[0]).map(k=>k[1]).join('; ');break}adventureService.fight(s,Math.min(s.realm,ADV.length-1),true)}
    }
    if(it>=6000)stop='Dừng sau 6000 bước';
  }catch(e){stop='Lỗi giả lập: '+e.message}finally{ui._inLab=0;s=bak;ui.msg=um}
  ui.lab={rows,stop};
}

function bulkSell(maxR){const eqU=Object.values(s.eq);let n=0,g=0;s.inv=s.inv.filter(i=>{const d=ID[i.id];if(!EQT.includes(d.t)||d.r>maxR||i.lk||i.ex||eqU.includes(i.u)||(s.bmWeapon&&s.bmWeapon.u===i.u))return true;g+=Math.floor(PR[d.r]*.4)*(i.q||1);n++;return false});s.stones+=g;say(n?`Đã bán ${n} món trang bị, nhận ${g.toLocaleString('vi-VN')} linh thạch`:'Không có món nào đủ điều kiện bán hàng loạt')}
function salvageYield(it){
  const d=ID[it.id],r=d.r,mats={};
  const add=(id,q)=>{if(q>0)mats[id]=(mats[id]||0)+q};
  if(r<=1)add('m7',1+r);
  else if(r===2){add('m7',2);add('m8',1)}
  else if(r===3){add('m8',2);add('m9',1)}
  else if(r===4){add('m8',3);add('m9',2)}
  else{add('m8',2);add('m9',3+r-5)}
  if(it.ql)add('m8',it.ql);
  if(it.rf){for(let lv=0;lv<it.rf;lv++){const R=rfCost(lv);R[1].forEach(([id,q])=>add(id,Math.max(1,Math.floor(q*.6))))}}
  return mats;
}
function salvageItem(u){
  const idx=s.inv.findIndex(i=>i.u===u);if(idx<0)return;
  const it=s.inv[idx],d=ID[it.id];
  if(!EQT.includes(d.t)||it.lk||Object.values(s.eq).includes(it.u)||(s.bmWeapon&&s.bmWeapon.u===it.u))return say('Không thể phân giải trang bị đang mặc, đã khóa hoặc Bản Mệnh');
  const mats=salvageYield(it);
  s.inv.splice(idx,1);
  Object.entries(mats).forEach(([id,q])=>inventoryService.add(s,id,q));
  cxp(s,'khi',4+d.r*3);
  say(`♻ Phân giải ${d.n}: nhận ${Object.entries(mats).map(([id,q])=>ID[id].n+' ×'+q).join(', ')}`);
}
function bulkSalvage(maxR){
  const eqU=Object.values(s.eq),tot={};let n=0,xpG=0;
  s.inv=s.inv.filter(i=>{
    const d=ID[i.id];
    if(!EQT.includes(d.t)||d.r>maxR||i.lk||i.ex||eqU.includes(i.u)||(s.bmWeapon&&s.bmWeapon.u===i.u))return true;
    const mats=salvageYield(i);
    Object.entries(mats).forEach(([id,q])=>{tot[id]=(tot[id]||0)+q});
    xpG+=4+d.r*3;n++;return false;
  });
  if(!n)return say('Không có món nào đủ điều kiện phân giải hàng loạt');
  Object.entries(tot).forEach(([id,q])=>inventoryService.add(s,id,q));
  cxp(s,'khi',xpG);
  say(`♻ Đã phân giải ${n} món trang bị: nhận ${Object.entries(tot).map(([id,q])=>ID[id].n+' ×'+q).join(', ')}`);
}
function smeltEquip(r){
  if(r<0||r>5)return;
  const sc=60*(r+1)*(r+1);
  if(s.stones<sc)return say('Cần '+sc+' linh thạch để dung luyện');
  const eqU=Object.values(s.eq);
  const pool=s.inv.filter(i=>EQT.includes(ID[i.id].t)&&ID[i.id].r===r&&!i.lk&&!eqU.includes(i.u)&&!(s.bmWeapon&&s.bmWeapon.u===i.u));
  if(pool.length<3)return say('Cần ít nhất 3 trang bị dư phẩm chất '+RN[r]+' (không khóa, không đang mặc)');
  pool.sort((a,b)=>((a.rf||0)+(a.ql||0))-((b.rf||0)+(b.ql||0)));
  const used=new Set(pool.slice(0,3).map(i=>i.u));
  const cand=ITEMS.filter(d=>EQT.includes(d.t)&&d.r===r+1);
  if(!cand.length)return;
  s.inv=s.inv.filter(i=>!used.has(i.u));
  s.stones-=sc;
  const pickD=pick(cand);
  inventoryService.add(s,pickD.id,1);
  const ni=s.inv[s.inv.length-1];
  if(Math.random()<.15)ni.ql=1;
  cxp(s,'khi',15+r*10);
  say(`🔥 Dung luyện thành công: nhận ${pickD.n} [${RN[r+1]}]${ni.ql?' ['+QL[ni.ql]+']':''}!`);
}

  ad_item:()=>{const d=ID[ui.ad.item],q=clamp(parseInt(ui.ad.qty)||1,1,99);if(!d)return;if(d.t==='pill'||d.t==='special'||d.t==='material')inventoryService.add(s,d.id,q);else for(let i=0;i<q;i++)inventoryService.add(s,d.id,1);say('Đã thêm '+d.n+' ×'+q+' vào kho')},
  ad_tal:()=>{const d=TD[ui.ad.tal];if(!d)return;say('Thiên phú '+d.n+': '+talentInventoryService.grant(s,d.id,'Admin'))},
  ad_slots:()=>{s.admSlots=(s.admSlots||0)+10;say('Đã mở thêm 10 ô thiên phú (tổng '+talentInventoryService.slots(s)+')')},
  ad_tech:()=>{const d=QD[ui.ad.tech];if(!d)return;if(!s.tech[d.id])techniqueService.learn(s,d.id);s.tech[d.id].m=Math.max(s.tech[d.id].m,250);say('Đã học '+d.n+' và đạt Viên mãn')},
  ad_cr:k=>{s.crafts[k].lv=9;say(CN[k]+' đạt Cửu Giai')},ad_cr1:k=>{const c=s.crafts[k];c.lv=Math.min(9,c.lv+1);c.xp=0;say(CN[k]+' lên '+GN[c.lv])},ad_tox:()=>{s.toxin=0;say('Đã xóa đan độc')},ad_mats:()=>{ITEMS.filter(i=>i.t==='material').forEach(i=>inventoryService.add(s,i.id,20));say('+20 mọi nguyên liệu')},
  ad_mat:()=>{const q=clamp(parseInt(ui.ad.qty)||1,1,99),d=ID[ui.ad.mat||'m1'];inventoryService.add(s,d.id,q);say('Đã thêm '+d.n+' ×'+q)},
  ad_sss:()=>{const m=s.sim;if(!m||m.phase!=='run'||m.pick.length<3)return say('Cần đang trong giai đoạn Hành trình');m.xp+=100000;m.good+=10;rewardIntegrationService.finish(s);say('Mô phỏng kết thúc với hạng '+GR[m.res.gi]+', hãy chọn di sản ở tab Kim Thủ Chỉ')},
  ad_pts:()=>{const m=s.sim;if(!m||m.phase!=='run')return say('Cần đang trong giai đoạn Hành trình');m.xp+=26000;say('+1000 điểm mô phỏng')},
  ad_cp:()=>{try{$('ad-json').select();navigator.clipboard.writeText($('ad-json').value);say('Đã copy JSON')}catch(e){say('Hãy chọn và copy thủ công')}},
  ad_json:()=>{try{const o=JSON.parse($('ad-json').value);if(!o||typeof o.realm!=='number'||!Array.isArray(o.tal)||typeof o.tech!=='object')throw 0;s=o;migrate();say('Đã ghi đè dữ liệu từ JSON')}catch(e){say('JSON không hợp lệ, dữ liệu giữ nguyên')}}
};

const NO_TS={tab:1,flt:1,cflt:1,ui:1,uic:1,aiopen:1,qsave:1,sv_open:1,sv_close:1,sv_slim:1,sv_dl:1,sv_link:1,sv_link_clr:1,sv_share:1,sv_load:1,sv_del:1,sv_leg:1,sv_imp_txt:1,sv_confirm:1,sv_cancel:1,gd_open:1,gd_tab:1,gd_close:1,gd_start_onboard:1,gd_skip_onboard:1,gd_start_wn:1,gd_next:1,gd_prev:1,gd_tour_end:1,gd_jump:1,adm_cls:1};
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-a]');if(!t||t.disabled)return;
  const a=t.dataset.a;if(a==='adm_ok'){verifyAdminPwd();return}
  if(a!=='reset')ui.rs=false;if(a!=='tab')ui.msg='';
  if(A[a])A[a](t.dataset.x);
  if(s){shopService.tick(s);achievementService.check(s);store.save(s,!!NO_TS[a])}
  render();
});

document.addEventListener('change',e=>{
  const k=e.target.dataset.chg,f=e.target.files&&e.target.files[0];
  if(k==='name'&&s){
    const val=e.target.value.trim();
    if(val==='/thiendao'){e.target.value=s.name;openAdminPrompt();return}
    s.name=val.slice(0,24)||'Vô Danh';store.save(s);render();return;
  }
  if(k==='sort'){ui.sort=e.target.value;render();return}
  if(k==='pstatus'&&s){s.profile.status=e.target.value.trim().slice(0,60);store.save(s);render();return}
  if(k==='rb_tal'){ui.rbTal=e.target.value;return}
  if(k&&k.slice(0,3)==='ai_'){const n=k.slice(3),v=e.target.value;if(n==='in'){ui.aiIn=aiS(v,160);return}thienCoAI.set(n,v);ui.aiPing='';render();return}
  if(k&&k.slice(0,3)==='cr_'){ui.cr[k.slice(3)]=e.target.value;render();return}
  if(k&&k.slice(0,3)==='ad_'&&s){const n=k.slice(3),v=e.target.value;if(['realm','layer','body','root'].includes(n)){s[n]=n==='layer'?+v-1:+v;store.save(s);render()}else ui.ad[n]=v;return}
  if(k==='sv_file'&&f){saveService.importFile(f);e.target.value='';return}
  if(s&&k&&f){if(k.slice(0,4)==='img_')imgFile(k.slice(4),f);else if(k==='aud')audFile(f);e.target.value=''}
});

document.addEventListener('input',e=>{
  const k=e.target.dataset.chg;if(!k)return;
  if(k.slice(0,3)==='ai_'){const n=k.slice(3),v=e.target.value;if(n==='in'){ui.aiIn=aiS(v,160);return}if(n==='model'||n==='url'||n==='key')thienCoAI.set(n,v);return}
  if(!s)return;
  if(k==='th_bg'||k==='th_ac'){setT(k==='th_bg'?'bg':'ac',e.target.value);applyTheme();store.save(s);return}
  const v=+e.target.value,u=s.uiCfg;
  if(k==='wp_o'){u.wo=v;applyWp();const o=$('v_wp_o');if(o)o.textContent=v+'%'}
  else if(k==='wp_b'){u.wb=v;applyWp();const o=$('v_wp_b');if(o)o.textContent=v+'px'}
  else if(k==='vol'){u.vol=v;syncVol();const o=$('v_vol');if(o)o.textContent=v+'%'}
  else return;
  store.save(s);
});

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='ai_in'){e.preventDefault();const b=document.querySelector('[data-a="aiact"]');if(b&&!b.disabled)b.click();return}
  if(e.key==='Escape'){
    if(ui.gdTour){guideService.endTour();render();return}
    if(ui.gdModal){guideService.dismissModal();render();return}
    if(ui.svPreview){ui.svPreview=null;render();return}
    if(ui.btl&&ui.btl.done){ui.btl=null;render();return}
    if(ui.admAuth){ui.admAuth=false;ui.admMsg='';render();return}
    if(ui.ap){ui.ap=0;render();return}
    if(ui.sv){ui.sv=false;render();return}
  }
  if(e.altKey&&e.shiftKey&&(e.code==='Backquote'||e.key==='~'||e.key==='`')){
    e.preventDefault();openAdminPrompt();
  }
});
