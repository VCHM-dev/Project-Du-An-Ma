const techniqueService={
  power(x,id){const d=QD[id],b=x.body>=(d.mb||0)?1:.6,r=ROOTS[x.root],c=d.el==='*'?1:r.el===d.el?1.3:!r.el?1.15:.8;return b*c*MF[this.lv(x,id)]},
  lv(x,id){const m=x.tech[id].m;return MT.reduce((a,t,i)=>m>=t?i:a,0)},
  ngReq:d=>10+d.r*8,
  toggle(x,id){const t=x.tech[id];if(t.eq){t.eq=false;return}if(Object.values(x.tech).filter(v=>v.eq).length>=3)return say('Chỉ trang bị tối đa 3 công pháp');t.eq=true},
  practice(x,id){
    const d=QD[id],t=x.tech[id];
    if(t.m>=250)return say(d.n+' đã đạt cảnh giới Viên mãn');
    const ng=characterStatsService.compute(x).attr.ngo,rq=this.ngReq(d);
    if(ng<rq)return say('Ngộ tính chưa đủ để lĩnh ngộ '+d.n+' (cần Ngộ tính ≥ '+rq+', hiện '+ng+')');
    const c=10*(d.r+1)**2;

const inventoryService={
  add(x,id,q=1,ex){
    const d=ID[id];
    if(!ex&&(d.t==='pill'||d.t==='scroll'||d.t==='special'||d.t==='material')){
      const i=x.inv.find(i=>i.id===id&&!i.ex);
      if(i){i.q+=q;return}
    }
    const o={u:uid(),id,q};if(ex)o.ex=1;x.inv.push(o);
  },
  noBatch:['d2','d7','d8','d9','d10'],
  use(x,u,cnt=1){
    const it=x.inv.find(i=>i.u===u),d=it&&ID[it.id];
    if(!d)return;
    if(d.t==='material')return say('Nguyên liệu dùng để chế tạo ở tab Bách Nghệ');
    if(d.t==='scroll')return say('Trận Bàn thực chiến: kích hoạt trực tiếp trong Chiến Trường Lịch Luyện!');
    if(['d14','d15','d16'].includes(d.id))return say('Đan dược thực chiến: sử dụng trực tiếp trong Chiến Trường Lịch Luyện!');
    if(this.noBatch.includes(d.id))cnt=1;
    const f=PE[d.id];if(!f)return;
    const K=it.ex?2:1,hasTox=!!PT[d.id]&&!hasT(x,'t34');
    let used=0,lastMsg='';
    while(used<cnt&&it.q>0){
      if(cnt>1&&hasTox&&x.toxin>=80)break;
      const r=f(x,K);
      if(r&&r.e){if(used===0)return say(r.e);break}
      it.q--;used++;lastMsg=r;
      if(hasTox)x.toxin=Math.min(100,x.toxin+PT[d.id]);
    }
    if(it.q<=0)x.inv=x.inv.filter(i=>i!==it);
    if(used>0){
      const nm=(it.ex?'Cực phẩm ':'')+d.n+(used>1?' ×'+used:'');
      say('Đã dùng '+nm+': '+lastMsg+(hasTox?' · Đan độc '+x.toxin+'/100':''));
    }
  }
};

const talentInventoryService={
  slots(x){return 3+(x.realm>=3)+(x.realm>=6)+(x.kt>=3)+(x.ach.sss?1:0)+(x.admSlots||0)},
  active:x=>x.tal.filter(t=>t.on),

  toggle(x,u){const t=x.tal.find(t=>t.u===u);if(t.on){t.on=false;return}if(!this.ok(x,t))return say('Chưa đạt điều kiện kích hoạt riêng');if(this.active(x).length>=this.slots(x))return say('Hết ô thiên phú, hãy tháo một thiên phú khác');t.on=true},
  cost:t=>100*(TD[t.id].r+1)**2*t.lv,

  grant(x,id,src){const o=x.tal.find(t=>t.id===id);if(o){if(o.lv<5)o.lv++;return'trùng → tăng cấp'}x.tal.push({u:uid(),id,lv:1,on:false,src});return'mới'}
};

const characterStatsService={
  compute(x){
    const b=BODIES[x.body],r=ROOTS[x.root],k=10+x.realm*8+x.layer,m={};
    talentInventoryService.active(x).forEach(t=>addm(m,TD[t.id].e,(1+.25*(t.lv-1))*(1+.08*x.body)));
    for(const t in x.eq){const it=x.inv.find(i=>i.u===x.eq[t]);if(it)addm(m,ID[it.id].s,eqMul(x,it))}
    for(const id in x.tech)if(x.tech[id]&&x.tech[id].eq&&QD[id])addm(m,QD[id].e,techniqueService.power(x,id));
    if(x.tm)m.tam=(m.tam||0)-8;
    const ab=2*Object.keys(x.ach||{}).length+10*(x.reborn||0),base={the:k+b.a+ab+((x.px||{}).the||0),linh:k+Math.round(r.c*4)+ab+((x.px||{}).linh||0),ngo:k+ab+((x.px||{}).ngo||0),than:k+ab,tam:k+ab+((x.px||{}).tam||0),van:10+x.van+ab+(x.activeArray==='van'?Math.round(15*av(x)):0)},a={},bonus={};
    ATTR.forEach(n=>{a[n]=Math.round(base[n]+(m[n]||0));bonus[n]=a[n]-base[n]});
    const flatMul=Math.pow(1.6,x.realm),realmMul=Math.pow(2.1,x.realm)*(1+x.layer*.1);
    let luc=Math.round((a.the*2.5+a.ngo*.5+(m.luc||0)*flatMul)*realmMul);
    let thu=Math.round((a.the*2+a.tam*.8+(m.thu||0)*flatMul)*realmMul);
    let toc=Math.round((a.linh*1.2+a.than*.8+(m.toc||0)*flatMul)*realmMul);
    if(x.activeArray==='ho')thu=Math.round(thu*(1+.25*av(x)));
    if(x.activeArray==='hon')thu=Math.round(thu*(1+.3*av(x)));
    if(x.activeArray==='tru'&&advOn)luc=Math.round(luc*(1+.6*av(x)));
    if(x.activeArray==='hon'&&advOn)luc=Math.round(luc*(1+.4*av(x)));
    return{attr:a,bonus,luc,thu,toc,tc:m.tc||0,realmMul};
  }
};

const cultivationService={
  need:x=>Math.round(100*Math.pow(2.2,x.realm)*(1+x.layer*.35)),
  life:x=>LIFE[x.realm]+x.lifeB,
  cost:x=>Math.max(50*(x.realm+1)**2,Math.round(55*Math.pow(1.75,x.realm))),
  npt:x=>15+x.realm*8,
  chance(x){const st=characterStatsService.compute(x);return clamp(.55+(st.attr.tam-this.npt(x))*.01+x.pb+(x.pity||0)-.004*(x.toxin||0),.1,.95)},
  train(x){
    if(x.age>=this.life(x))return say('Thọ nguyên cạn kiệt, cần đột phá hoặc dùng Thọ Nguyên Đan');
    const st=characterStatsService.compute(x);
    const raw=22*Math.pow(1.95,x.realm)*(1+st.attr.ngo/25)*BODIES[x.body].c*ROOTS[x.root].c*(1+st.tc);
    const g=Math.max(1,Math.round(raw*(1-.004*(x.toxin||0))*(x.activeArray==='tu'?1+.3*av(x):x.activeArray==='hon'?1+.5*av(x):1)));
    x.age++;x.xp+=g;x.total+=g;
    if(x.toxin>0)x.toxin=Math.max(0,x.toxin-(x.activeArray==='duoc'?3:1));
    say('Bế quan 1 năm, thu được '+g+' tu vi'+(x.toxin>0?' (đan độc '+x.toxin+')':''));
  },
  auto(x){let n=0,up=0;while(n<3000){if(x.age>=this.life(x)-5){say(`Dừng: thọ nguyên còn dưới 5 năm (đã bế quan ${n} năm, lên ${up} tầng)`);return}if(this.check(x)[0][0]){if(x.layer<8){this.go(x);up++;continue}say(`Bế quan ${n} năm, lên ${up} tầng, đã tới cửa đột phá cảnh giới`);return}this.train(x);n++}say('Đã bế quan '+n+' năm, lên '+up+' tầng')},
  check(x){
    const n=this.need(x),st=characterStatsService.compute(x),r=[[x.xp>=n,`Tu vi ${x.xp.toLocaleString('vi-VN')}/${n.toLocaleString('vi-VN')}`]];
    if(x.layer===8){
      if(x.realm>=REALMS.length-1)r.push([false,'Hỗn Nguyên viên mãn: đã chứng đắc vô thượng đại đạo']);
      else{
        r.push([st.attr.tam>=this.npt(x),`Tâm cảnh ≥ ${this.npt(x)} (hiện ${st.attr.tam})`],[!x.tm,'Không nhiễm tâm ma'],[x.stones>=this.cost(x),`Linh thạch ≥ ${this.cost(x).toLocaleString('vi-VN')}`]);
        if(x.realm===8)r.push([st.thu>=150000,`Phòng ngự ≥ 150.000 để gánh Phi Thăng Tiên Kiếp (hiện ${st.thu.toLocaleString('vi-VN')})`]);
      }
    }
    return r;
  },
  go(x){
    if(!this.check(x).every(c=>c[0]))return say('Chưa đủ điều kiện đột phá');
    const n=this.need(x);
    if(x.layer<8){x.xp-=n;x.layer++;return log(`Đột phá thành công: ${REALMS[x.realm]} tầng ${x.layer+1}`)}
    x.stones-=this.cost(x);const p=this.chance(x);x.pb=0;
    if(Math.random()>p){x.pity=Math.min(.3,(x.pity||0)+.05);
      x.xp=Math.max(0,x.xp-Math.round(n*.2));
      let msg='Đột phá thất bại, tổn thất tu vi';
      if(Math.random()<.5){
        if(x.activeArray==='khon'&&Math.random()<.5*av(x))msg+=' (Cửu Cung Khốn Ma Trận đã trấn áp tâm ma)';
        else{x.tm=true;msg+=' và nhiễm tâm ma'}
      }
      return log(msg);
    }
    const t=x.realm+1;
    if(t>=2){
      const k=160*Math.pow(2.1,t),ch=clamp(characterStatsService.compute(x).thu/k+(x.pity||0),.15,.95);
      if(Math.random()>ch){x.pity=Math.min(.3,(x.pity||0)+.05);x.xp=Math.max(0,x.xp-Math.round(n*.3));x.tm=true;return log('Thiên kiếp giáng xuống, vượt kiếp thất bại, nhiễm tâm ma')}
    }
    x.xp-=n;x.realm=t;x.layer=0;x.pity=0;
    if(t===9){x.ascended=(x.ascended||0)+1;log('⚡✨ Vượt qua Cửu Trọng Phi Thăng Kiếp, phá toái hư không, phi thăng Tiên Giới thành tựu Chân Tiên!')}
    else log(`Đột phá cảnh giới thành công: ${REALMS[t]}${t>=2?' (đã vượt thiên kiếp)':''}`);
  }
};

const destinyService={
  dest:x=>['Bình Phàm','Phúc Duyên','Thiên Tuyển','Khí Vận Chi Tử','Thiên Đạo Sủng Nhi'][x.van<10?0:x.van<30?1:x.van<60?2:x.van<100?3:4],

};

const foeOf=(i,mut)=>{const L=Math.round(18*Math.pow(2.15,i)),m=mut||null;return{luc:Math.round(2.6*L*(m?m.luc:1)),thu:Math.round(2.1*L*(m?m.thu:1)),toc:Math.round(2*L*(m?m.toc:1)),hp:Math.round(13*L*(m?m.hp:1)),el:ADV[i][2],mut:m}};

function skillOf(x,id){
  const d=QD[id];if(!d)return null;
  const p=techniqueService.power(x,id),sp=d.sp||[];
  let k='heal',cd=3,mp=.22,mul=1.35,tag='Hồi HP & Hộ Thuẫn';
  if(['q4','q11','q18'].includes(id)||/Quyền|Luyện thể/.test(d.ty)){k='break';cd=3;mp=.22;mul=1.45;tag='Phá Giáp -35% & Phản Chấn'}
  else if(['q7','q9','q10','q13'].includes(id)||/Thần hồn|Chưởng|Bí thuật/.test(d.ty)){k='stun';cd=4;mp=.26;mul=1.4;tag='Phong Ấn (Choáng 1 hiệp, ngắt tụ lực)'}
  else if(sp.includes('burst')||['q6','q17','q19'].includes(id)){k='exec';cd=3;mp=.25;mul=1.65;tag='Trảm Sát (×2.4 nếu địch <30% HP)'}
  else if(sp.includes('burn')||['q3','q14'].includes(id)){k='burn';cd=3;mp=.22;mul=1.5;tag='Thiêu Đốt 3 hiệp'}
  else if(sp.includes('drain')||['q12','q15'].includes(id)){k='drain';cd=3;mp=.24;mul=1.5;tag='Hút 35% sát thương thành HP'}
  return{id,n:d.n,k,cd,mpCost:mp,mul:Math.round(mul*(.85+.25*p)*100)/100,tag};
}

function calcSup(x,b){
  const diff=Math.max(0,b.i-x.realm);
  const mit=diff>0?clamp((b.counter?.5:0)+(x.bmWeapon?x.bmWeapon.lv*.025:0),0,.85):0;
  b.diff=diff;b.supMit=mit;
  b.supDealt=diff>0?Math.max(.15,1-diff*.22*(1-mit)):1;
  b.supTaken=diff>0?1+diff*.25*(1-mit):1;
}

const adventureService={
  initBattle(x,i,forceMut){
    advOn=1;let st;try{st=characterStatsService.compute(x)}finally{advOn=0}
    const sn=STANCES[clamp(x.stance||0,0,2)];
    const mut=(forceMut||ui.forceMut||Math.random()<.22)?pick(MUTS):null;
    if(ui.forceMut)ui.forceMut=0;
    const f=foeOf(i,mut);
    const eqTechs=Object.keys(x.tech).filter(id=>x.tech[id]&&x.tech[id].eq&&QD[id]);
    const eqItems=EQT.map(t=>x.eq[t]&&x.inv.find(k=>k.u===x.eq[t])).filter(Boolean);
    const rootEl=ROOTS[x.root].el;
    const counter=x.root===8||(rootEl&&KE[rootEl]===f.el)||eqTechs.some(id=>KE[QD[id].el]===f.el);
    const hasSp=k=>eqTechs.some(id=>(QD[id].sp||[]).includes(k));
    const luc=Math.round(st.luc*sn.luc),thu=Math.round(st.thu*sn.thu),toc=Math.round(st.toc*sn.toc);
    const maxHp=Math.round((st.attr.the*8+st.attr.than*4+100)*st.realmMul),maxMp=Math.round((st.attr.linh*5+st.attr.than*5+60)*st.realmMul);
    const pen=Math.min(.75,eqItems.reduce((a,it)=>a+(it.ql===2?.15:it.ql===3?.3:0),0));
    const hasShield=eqItems.some(it=>it.id==='f1'||it.id==='f7'||it.id==='a2');
    const sh=hasShield?Math.round(thu*1.5):0;
    const skills=eqTechs.map(id=>skillOf(x,id)).filter(Boolean);
    const fn=(mut?`【Biến Dị · ${mut.n}】 `:'')+ADV[i][0];
    const logs=[`⚔ ${x.name} (${sn.n}) đối đầu ${fn} [Hệ ${ELN[f.el]}] tại ${ADV[i][1]}`];
    const b={i,fn,f,mut,sn,luc,thu,toc,maxHp,hp:maxHp,maxMp,mp:maxMp,fh:f.hp,fMaxHp:f.hp,sh,r:0,counter,pen,
      hasDrain:hasSp('drain'),hasBurn:hasSp('burn')||eqItems.some(it=>it.id==='f5'),hasBurst:hasSp('burst'),
      skills,cd:{},guardCd:0,guardTurns:0,reflTurns:0,rageTurns:0,immuneTurns:0,poisonImmTurns:0,tb1:0,tb2:0,
      fBreak:0,fStun:0,fBurn:0,fBurnTurns:0,pPoison:0,fCharge:0,pills:2,logs,done:0,win:0,fled:0};
    calcSup(x,b);
    if(b.diff>0)logs.push(`⚠ Uy Áp Cảnh Giới (vượt ${b.diff} đại cảnh giới): sát thương gây ra ×${b.supDealt.toFixed(2)}, sát thương gánh chịu ×${b.supTaken.toFixed(2)} (đã giảm ${Math.round(b.supMit*100)}% uy áp).`);
    if(mut)logs.push(`👹 Cảnh báo Yêu Thú Biến Dị (${mut.n}): ${mut.d}`);
    if(counter)logs.push(`✨ Ngũ hành tương khắc (${ELN[f.el]} bị khắc chế): sát thương +${Math.round((.3+sn.ke)*100)}%!`);
    if(pen>0)logs.push(`🗡 Xuyên Giáp Pháp Bảo: bỏ qua ${Math.round(pen*100)}% phòng ngự địch.`);
    if(sh>0)logs.push(`🛡 Pháp bảo hộ thể kích hoạt: tạo Hộ Thuẫn ${sh} điểm.`);
    return b;
  },
  step(x,b,act){
    if(b.done)return b;
    const usePill=pid=>{
      const list=pid?[pid]:['d1','d3','d12'];
      const cands=x.inv.filter(k=>list.includes(k.id)&&k.q>0);
      const it=cands.find(k=>k.ex)||cands[0];
      if(!it||b.pills<=0)return{err:'không còn đan dược phù hợp'};
      it.q--;if(it.q<=0)x.inv=x.inv.filter(k=>k!==it);b.pills--;
      if(PT[it.id]&&!hasT(x,'t34'))x.toxin=Math.min(100,(x.toxin||0)+PT[it.id]);
      let msg='';
      if(it.id==='d14'){b.rageTurns=3;msg=`dùng ${it.ex?'Cực phẩm ':''}Bạo Nguyên Đan (+45% Lực chiến, +20% Bạo kích 3 hiệp)`}
      else if(it.id==='d15'){const gSh=Math.round(b.thu);b.sh+=gSh;b.immuneTurns=2;b.pPoison=0;msg=`dùng ${it.ex?'Cực phẩm ':''}Kim Cang Hộ Tâm Đan (+${gSh} Thuẫn, miễn hiệu ứng xấu 2 hiệp)`}
      else if(it.id==='d16'){b.pPoison=0;b.poisonImmTurns=4;msg=`dùng ${it.ex?'Cực phẩm ':''}Bách Thảo Giải Độc Đan (giải độc & miễn độc 4 hiệp)`}
      else{const hm=b.pPoison>0&&b.poisonImmTurns<=0?.5:1,hl=Math.round(b.maxHp*.38*hm),ml=Math.round(b.maxMp*.45);b.hp=Math.min(b.maxHp,b.hp+hl);b.mp=Math.min(b.maxMp,b.mp+ml);b.pPoison=0;msg=`dùng ${it.ex?'Cực phẩm ':''}${ID[it.id].n} hồi +${hl} HP, +${ml} Linh lực, giải độc`}
      return{msg,free:!!it.ex};
    };
    if(act==='pill'||(typeof act==='string'&&act.slice(0,5)==='pill_')){
      const res=usePill(act==='pill'?null:act.slice(5));
      if(res.free){b.logs.push(`✨ Cực phẩm đan dược không tốn lượt (Hiệp ${b.r}): ${res.msg}`);return b}
      act={_pillMsg:res.err||res.msg};
    }
    b.r++;
    const hit=(a,d)=>Math.max(1,Math.round((a-d*.5)*(.88+Math.random()*.24)));
    const dg=(a,d,bon)=>Math.random()<clamp((d-a)*.005+(bon||0),0,.38);
    for(const k in b.cd)if(b.cd[k]>0)b.cd[k]--;
    if(b.guardCd>0)b.guardCd--;
    if(b.guardTurns>0)b.guardTurns--;
    if(b.reflTurns>0)b.reflTurns--;
    if(b.rageTurns>0)b.rageTurns--;
    if(b.immuneTurns>0)b.immuneTurns--;
    if(b.poisonImmTurns>0)b.poisonImmTurns--;
    if(b.fBreak>0)b.fBreak--;
    const healMul=b.pPoison>0&&b.poisonImmTurns<=0?.5:1;
    if(b.sn.regen>0&&b.hp>0){const rg=Math.max(1,Math.round(b.maxHp*b.sn.regen*healMul));b.hp=Math.min(b.maxHp,b.hp+rg)}
    b.mp=Math.min(b.maxMp,b.mp+Math.max(8,Math.round(b.maxMp*.08)));

    const doPlayer=()=>{
      if(b.hp<=0||b.fh<=0)return'';
      if(act&&act._pillMsg)return act._pillMsg;
      if(act==='tb_b1'||act==='tb_b2'){
        const bid=act==='tb_b1'?'b1':'b2',it=x.inv.find(k=>k.id===bid&&k.q>0);
        if(!it)return'không còn Trận Bàn '+ID[bid].n;
        it.q--;if(it.q<=0)x.inv=x.inv.filter(k=>k!==it);
        if(bid==='b1'){b.counter=1;b.tb1=1;calcSup(x,b);return`kích hoạt Ngũ Hành Nghịch Chuyển Bàn (ép khắc hệ +30% ST, giảm 50% Uy Áp)`}
        b.tb2=1;return`kích hoạt Tứ Tượng Tỏa Linh Bàn (áp chế nửa hiệu ứng Yêu Thú Biến Dị)`;
      }
      if(act==='guard'){
        const cost=Math.round(b.maxMp*.2);
        if(b.mp<cost||b.guardCd>0)act='atk';
        else{
          b.mp-=cost;b.guardCd=3;b.guardTurns=2;b.pPoison=0;
          const gainSh=Math.round(b.thu*1.6);b.sh+=gainSh;
          return`vận Hộ Thể Kim Quang (+${gainSh} Hộ Thuẫn, giảm 35% sát thương 2 hiệp)`;
        }
      }
      let sk=null;
      if(typeof act==='string'&&act.slice(0,3)==='sk_'){
        sk=b.skills.find(s=>s.id===act.slice(3));
        const cost=sk?Math.round(b.maxMp*sk.mpCost):0;
        if(!sk||b.cd[sk.id]>0||b.mp<cost)sk=null;
        else{b.mp-=cost;b.cd[sk.id]=sk.cd}
      }
      if(!sk)b.mp=Math.min(b.maxMp,b.mp+Math.round(b.maxMp*.08));
      if(!sk&&dg(b.toc,b.f.toc,0))return'địch né tránh';
      const pLuc=Math.round(b.luc*(b.rageTurns>0?1.45:1));
      const fThu=Math.round(b.f.thu*(b.fBreak>0?.65:1)*(1-(b.pen||0)));
      let d=hit(Math.round(pLuc*(sk?sk.mul:1)),fThu),tags=[];
      if(sk)tags.push(`Tuyệt kỹ ${sk.n}`);
      if(b.counter)d=Math.round(d*(1.3+b.sn.ke));
      if(b.supDealt<1)d=Math.max(1,Math.round(d*b.supDealt));
      if(sk&&sk.k==='exec'&&b.fh<b.fMaxHp*.3){d=Math.round(d*1.45);tags.push('Trảm Sát')}
      if(Math.random()<(b.hasBurst?.25:.1)+b.sn.crit+(b.rageTurns>0?.2:0)){d=Math.round(d*1.5);tags.push('Bạo kích')}
      b.fh-=d;
      if(b.mut&&b.mut.id==='thiet'&&b.fh>0){const rf=Math.max(1,Math.round(d*(b.tb2?.1:.2)));b.hp-=rf;tags.push(`Thiết Giáp phản ${rf}`)}
      if(sk&&sk.k==='break'){b.fBreak=3;b.reflTurns=2;tags.push('Phá Giáp 3 hiệp')}
      if(sk&&sk.k==='stun'){b.fStun=1;if(b.fCharge){b.fCharge=0;tags.push('Ngắt Tụ Lực!')}else tags.push('Phong Ấn 1 hiệp')}
      if((sk&&sk.k==='burn')||(b.hasBurn&&b.fBurnTurns<=0&&Math.random()<.35)){b.fBurn=Math.max(6,Math.round(pLuc*.2));b.fBurnTurns=3;tags.push('Thiêu Đốt')}
      if(sk&&sk.k==='drain'||b.hasDrain){const ratio=(sk&&sk.k==='drain'?.35:.15)*healMul,hl=Math.max(1,Math.round(d*ratio));b.hp=Math.min(b.maxHp,b.hp+hl);tags.push(`Hút máu +${hl}`)}
      if(sk&&sk.k==='heal'){const hl=Math.round(b.maxHp*.22*healMul),sh=Math.round(b.thu*.6);b.hp=Math.min(b.maxHp,b.hp+hl);b.sh+=sh;tags.push(`Hồi +${hl} HP, +${sh} Thuẫn`)}
      return`bạn gây ${d}${tags.length?' ['+tags.join(', ')+']':''}`;
    };

    const doFoe=()=>{
      if(b.fh<=0||b.hp<=0)return'địch gục';
      if(b.fStun>0){b.fStun=0;return'địch bị Phong Ấn, mất lượt!'}
      const loiPeriod=b.tb2?5:3;
      if(b.mut&&b.mut.id==='loi'&&!b.fCharge&&b.r%loiPeriod===(loiPeriod-1)){b.fCharge=1;return'⚡ Địch tụ lực Cuồng Lôi Phạt Thế (sát thương cực đại ở hiệp sau)!'}
      if(!b.fCharge&&dg(b.f.toc,b.toc,b.sn.dodge)){return'bạn thân pháp né tránh'}
      let fLuc=b.f.luc,notes=[];
      if(b.mut&&b.mut.id==='huyet'&&b.fh<b.fMaxHp*.4){fLuc=Math.round(fLuc*(b.tb2?1.2:1.4));notes.push('Huyết Sát Cuồng Nộ')}
      if(b.fCharge){fLuc=Math.round(fLuc*2.2);b.fCharge=0;notes.push('⚡ Lôi Kiếp Đại Chiêu')}
      let d=hit(fLuc,b.thu);
      if(b.supTaken>1)d=Math.round(d*b.supTaken);
      if(b.guardTurns>0)d=Math.round(d*.65);
      if(b.sh>0){const blk=Math.min(b.sh,d);b.sh-=blk;d-=blk;notes.push(`thuẫn chặn ${blk}`)}
      b.hp-=d;
      if(b.reflTurns>0&&d>0){const rf=Math.max(1,Math.round(d*.25));b.fh-=rf;notes.push(`phản chấn ${rf}`)}
      if(b.mut&&b.mut.id==='huyet'&&b.fh<b.fMaxHp*.4&&d>0){const hl=Math.round(d*(b.tb2?.1:.2));b.fh=Math.min(b.fMaxHp,b.fh+hl);notes.push(`hút +${hl}`)}
      if(b.mut&&b.mut.id==='doc'&&d>0&&b.pPoison<=0&&b.immuneTurns<=0&&b.poisonImmTurns<=0&&Math.random()<(b.tb2?.25:.5)){b.pPoison=3;notes.push('gây Trúng Độc')}
      return`địch gây ${d}${notes.length?' ('+notes.join(', ')+')':''}`;
    };

    const first=b.toc>=b.f.toc?doPlayer():doFoe();
    const second=b.toc>=b.f.toc?(b.fh>0?doFoe():'địch gục'):(b.hp>0?doPlayer():'bạn gục');
    let dot='';
    if(b.fBurnTurns>0&&b.fh>0){b.fh-=b.fBurn;b.fBurnTurns--;dot+=`, 🔥 thiêu đốt địch -${b.fBurn}`}
    if(b.pPoison>0&&b.hp>0){const pd=Math.max(2,Math.round(b.maxHp*(b.tb2?.025:.05)));b.hp-=pd;b.pPoison--;dot+=`, ☠ độc phát -${pd}`}
    b.logs.push(`Hiệp ${b.r}: ${first} · ${second}${dot} (HP bạn ${Math.max(0,b.hp)}/${b.maxHp} · MP ${b.mp} · Địch ${Math.max(0,b.fh)}/${b.fMaxHp})`);
    if(b.fh<=0||b.hp<=0||b.r>=25){b.done=1;b.win=b.fh<=0&&b.hp>0}
    return b;
  },
  autoPick(b,x){
    const inv=x?x.inv:(s?s.inv:[]),has=id=>inv.some(k=>k.id===id&&k.q>0);
    if(b.r<3){
      if(b.diff>0&&!b.counter&&!b.tb1&&has('b1'))return'tb_b1';
      if(b.mut&&!b.tb2&&has('b2'))return'tb_b2';
    }
    if(b.pPoison>0&&b.pills>0&&b.poisonImmTurns<=0&&has('d16'))return'pill_d16';
    if(b.hp<b.maxHp*.35&&b.pills>0&&['d1','d3','d12'].some(has))return'pill';
    if(b.hp<b.maxHp*.4&&b.guardCd<=0&&b.mp>=Math.round(b.maxMp*.2))return'guard';
    if(b.fCharge){
      const st=b.skills.find(sk=>sk.k==='stun'&&!b.cd[sk.id]&&b.mp>=Math.round(b.maxMp*sk.mpCost));
      if(st)return'sk_'+st.id;
      if(b.guardCd<=0&&b.mp>=Math.round(b.maxMp*.2))return'guard';
      if(b.pills>0&&b.sh<=0&&has('d15'))return'pill_d15';
    }
    if(b.diff>0&&b.rageTurns<=0&&b.pills>0&&has('d14'))return'pill_d14';
    for(const sk of b.skills)if(!b.cd[sk.id]&&b.mp>=Math.round(b.maxMp*sk.mpCost))return'sk_'+sk.id;
    return'atk';
  },
  simBattle(x,i,logs){
    const b=this.initBattle(x,i,false);
    while(!b.done)this.step(x,b,this.autoPick(b,x));
    if(logs)logs.push(...b.logs.slice(1));
    this.lastB=b;
    return b.win;
  },
  resolve(x,b,quiet){
    const i=b.i,L=quiet?null:(ui.al=b.logs);
    if(b.fled){
      const lo=Math.round(x.xp*.05);x.xp=Math.max(0,x.xp-lo);
      const t=`Rút lui an toàn khỏi ${b.fn}, chỉ hao tổn ${lo} tu vi.`;
      if(L)L.push(t);if(!quiet)say(t);
      return{ok:false,fled:true};
    }
    if(b.win){
      const mMul=b.mut?1.5:1;
      const fm=(x.farm=x.age>=((x.farm||{}).y||0)+10?{y:x.age,n:0}:x.farm),dm=Math.max(.3,Math.pow(.92,fm.n));fm.n++;
      const sn=Math.round(50*Math.pow(1.6,i)*dm*mMul),xp=Math.round(40*Math.pow(1.9,i)*dm*mMul);
      x.stones+=sn;x.xp+=xp;x.total+=xp;x.wins=(x.wins||0)+1;
      x.advWins=x.advWins||{};x.advWins[i]=(x.advWins[i]||0)+1;
      let t=`Thắng ${b.fn}! +${sn} linh thạch, +${xp} tu vi`,drops=[];
      const soulId=Object.keys(x.tech).find(id=>x.tech[id]&&x.tech[id].eq&&QD[id]&&(QD[id].sp||[]).includes('soul'));
      if(soulId){
        const bo=Math.round(xp*.35*techniqueService.power(x,soulId));
        x.xp+=bo;x.total+=bo;t+=`, ${QD[soulId].n} hút +${bo} tu vi`;
      }
      if(Math.random()<(b.mut?.75:.4)){const d=pick(ITEMS.filter(k=>k.t!=='material'&&k.r<=Math.min(6,i)));inventoryService.add(x,d.id);t+=', rơi '+d.n;drops.push(d.n)}
      const u=TECH.filter(k=>!x.tech[k.id]&&k.r<=i+1);
      if(u.length&&Math.random()<(b.mut?.32:.15)){const d=pick(u);techniqueService.learn(x,d.id);t+=', nhặt bí tịch '+d.n;drops.push('Bí tịch '+d.n)}
      const mtTier=Math.min(5,Math.round(i*.7)),pl=ITEMS.filter(k=>k.t==='material'&&k.r<=mtTier&&k.r>=Math.max(0,mtTier-2)),g=[];
      const cnt=(1+(Math.random()<.5?1:0))*(b.mut?2:1);
      for(let k=0;k<cnt;k++)g.push(pick(pl).id);
      const ex=(re,id)=>{const q=pl.filter(k=>re.test(k.id));if(hasT(x,id)&&q.length&&Math.random()<clamp(.25*talMul(x,id),.25,.85))g.push(pick(q).id)};
      ex(/^m[1-3]$/,'t38');ex(/^m([789])$/,'t39');
      g.forEach(id=>inventoryService.add(x,id,1));
      t+=', nguyên liệu: '+g.map(id=>ID[id].n).join(', ');
      if(L)L.push(t);
      if(!quiet)say(t);
      return{ok:true,sn,xp,drops};
    }else{
      const lo=Math.round(x.xp*.15),yr=2+(Math.random()*4|0);
      x.xp-=lo;x.lifeB-=yr;
      let t=`Thất bại trước ${b.fn}! mất ${lo} tu vi, giảm ${yr} năm thọ nguyên`;
      if(Math.random()<.3){x.tm=true;t+=', nhiễm tâm ma'}
      if(L)L.push(t);
      if(!quiet)say(t);
      return{ok:false};
    }
  },
  fight(x,i,quiet){
    if(x.age>=cultivationService.life(x)){if(!quiet)say('Thọ nguyên cạn kiệt, không thể lịch luyện');return{ok:false,stop:true}}
    x.age++;if(!quiet)ui.lastBoss=i;
    if(!quiet&&!ui.btlFast){
      ui.btl=this.initBattle(x,i,false);
      return{ok:false,manual:true};
    }
    this.simBattle(x,i,null);
    return this.resolve(x,this.lastB,quiet);
  },
  act(x,cmd){
    const b=ui.btl;if(!b)return;
    if(cmd==='close'){if(b.done)ui.btl=null;return}
    if(cmd==='flee'){if(!b.done){b.done=1;b.fled=1;this.resolve(x,b,false);ui.btl=null}return}
    if(cmd==='auto'){while(!b.done)this.step(x,b,this.autoPick(b,x));this.resolve(x,b,false);return}
    if(!b.done){
      this.step(x,b,cmd);
      if(b.done)this.resolve(x,b,false);
    }
  },
  sweep(x,i){
    if(!((x.advWins||{})[i]>0))return say('Cần đánh thắng ải này ít nhất 1 lần trước khi càn quét');
    let n=0,sn=0,xp=0,note='',drops=[];
    while(n<(ui.swn||10)){
      if(x.age>=cultivationService.life(x)-5){note='dừng do thọ nguyên còn dưới 5 năm';break}
      const r=this.fight(x,i,true);
      if(r.stop){note='thọ nguyên cạn kiệt';break}
      n++;
      if(!r.ok){note='gặp thất bại ở năm thứ '+n+', dừng càn quét';break}
      sn+=r.sn;xp+=r.xp;if(r.drops)drops.push(...r.drops);if(ui.swr&&r.drops&&r.drops.length){note='dừng vì rơi chiến lợi phẩm hiếm';break}
    }
    if(n===0)return say('Thọ nguyên còn dưới 5 năm, không thể càn quét');
    const dTxt=drops.length?`; chiến lợi phẩm hiếm: ${drops.join(', ')}`:'';
    say(`Càn quét ${ADV[i][0]} (${n} năm): +${sn.toLocaleString('vi-VN')} linh thạch, +${xp.toLocaleString('vi-VN')} tu vi và nguyên liệu${dTxt}${note?' ('+note+')':''}`);
  }
};

const shopService={
  gen(x){
    const l=[];
    for(let i=0;i<6;i++){
      const k=pick(['i','i','i','t','a']),u=TECH.filter(t=>!x.tech[t.id]);
      if(k==='t'&&u.length){const d=pick(u);l.push({k,id:d.id,p:Math.round(PR[d.r]*1.5),sold:0})}
      else if(k==='a'){const d=pick(TAL.filter(t=>t.r<=Math.min(6,x.realm+2)));l.push({k,id:d.id,p:PR[d.r]*2,sold:0})}
      else{const d=pick(ITEMS.filter(t=>t.r<=Math.min(6,x.realm+3)));l.push({k:'i',id:d.id,p:PR[d.r],sold:0})}
    }
    const mp=ITEMS.filter(t=>t.t==='material'&&t.r<=Math.min(5,x.realm+2));
    [5,4].forEach((sl,k)=>{if(k===0||Math.random()<.5){const d=pick(mp);l[sl]={k:'i',id:d.id,p:PR[d.r],sold:0}}});
    x.shop={age:x.age,l};
  },
  tick(x){if(!x.shop||x.age>=x.shop.age+5)this.gen(x)},
  paid(x){if(x.stones<50)return say('Cần 50 linh thạch');x.stones-=50;this.gen(x);say('Đã làm mới gian hàng')},
  buy(x,i){const o=x.shop.l[i];if(o.sold||x.stones<o.p)return say('Không đủ linh thạch hoặc đã bán');x.stones-=o.p;o.sold=1;if(o.k==='t')techniqueService.learn(x,o.id);else if(o.k==='a')say('Mua thiên phú: '+talentInventoryService.grant(x,o.id,'Phường Thị'));else inventoryService.add(x,o.id);if(o.k!=='a')say('Đã mua '+(o.k==='t'?QD[o.id].n:ID[o.id].n))},
  sell(x,u){const it=x.inv.find(i=>i.u===u);if(!it)return;if(it.lk)return say('Vật phẩm đã khóa, hãy mở khóa trước khi bán');if(Object.values(x.eq).includes(u))return say('Hãy tháo trang bị trước khi bán');if(x.bmWeapon&&x.bmWeapon.u===u)return say('Không thể bán Bản Mệnh Pháp Bảo');const p=Math.floor(PR[ID[it.id].r]*.4);it.q--;if(it.q<=0)x.inv=x.inv.filter(i=>i!==it);x.stones+=p;say('Đã bán '+ID[it.id].n+' được '+p+' linh thạch')}
};

  /* Thiên Cơ AI · bước 2: phán quyết lựa chọn (i ≥ 0) hoặc hành động tự do (i = -1, txt) */

  aiErr(m,e){m.aiFail=(m.aiFail||0)+1;say('⚠ Thiên cơ hỗn loạn ('+aiS(e&&e.message||e,90)+') — tạm dùng kịch bản Cổ Điển'+(m.aiFail>=3?'. Lỗi 3 lần liên tiếp: đời này chuyển hẳn sang Chế độ Cổ Điển':''))},

    else if(a===2){const n=pick(NP.filter(n=>n.id!=='ama'||m.evil>=2)),first=!m.bond[n.id];bond(m,n.id,1+(Math.random()<.4?1:0));const g=Math.round(35*mulS(m));gain(m,g);if(n.id==='ama')m.evil+=3;else m.good+=2;if(n.id==='muoi'&&first)m.flags.thieunu=1;
    t='Du Ngoạn Hồng Trần '+Y+' năm: gặp '+n.n+' ('+n.d+'), hảo cảm '+m.bond[n.id]+', +'+g+' tu vi'+(n.id==='muoi'&&first?' [Dấu ấn: '+FL.thieunu+']':'')}
    else{if(Math.random()<clamp(.55+st.attr.van*.003+m.rl*.02,.3,.85)){const g=Math.round(120*mulS(m));gain(m,g);t='Thăm Dò Bí Cảnh '+Y+' năm: đại thu hoạch +'+g+' tu vi, nhận '+loot(m,m.rl+3,.4);if(Math.random()<.3&&!m.flags.truyenthua){m.flags.truyenthua=1;t+=' [Dấu ấn: '+FL.truyenthua+']'}}
    else{t='Thăm Dò Bí Cảnh '+Y+' năm: kích hoạt cấm chế';if(!m.cal.done){m.cal.age=Math.min(m.cal.age,m.age);t+=', kiếp nạn bị dẫn động sớm'}if(Math.random()<.25*sf*(m.st==='hurt'?2.2:1))m.dead='chết trong bí cảnh';else{m.st='hurt';t+=', trọng thương thoát ra'}}}

  choose(x,i){

function migrate(){
  if(!s)return;
  if(typeof s.realm!=='number'||!Array.isArray(s.tal)||!Array.isArray(s.inv)){s=null;store.clear();return}
  s.ach=s.ach||{};s.wins=s.wins||0;s.advWins=s.advWins||{};s.hist=s.hist||[];s.log=s.log||[];s.claimed=s.claimed||{};s.tal=s.tal||[];s.tech=s.tech||{};
  s.tal=s.tal.filter(t=>t&&TD[t.id]);
  s.inv=s.inv.filter(i=>i&&ID[i.id]);
  s.toxin=s.toxin||0;s.crafts=s.crafts||{};['dan','khi','tran'].forEach(k=>{s.crafts[k]=s.crafts[k]||{lv:0,xp:0}});
  s.bmWeapon=s.bmWeapon||null;s.activeArray=s.activeArray||null;s.arrays=s.arrays||{};s.px=s.px||{ngo:0,tam:0};
  if(s.bmWeapon&&!s.inv.some(i=>i.u===s.bmWeapon.u))s.bmWeapon=null;
  for(const id in s.tech)if(s.tech[id]&&s.tech[id].fu)QD[id]=s.tech[id].fu;
  if(s.sim&&s.sim.phase==='run'&&!s.sim.cur&&!s.sim.sub)s.sim=null;
  if(s.sim&&s.sim.phase==='run'&&!s.sim.sub)initSim(s,0);
  if(s.sim&&s.sim.phase==='done'){s.sim.phase='legacy';s.sim.lg=[]}
  if(s.sim){const m=s.sim;m.aiSummary=typeof m.aiSummary==='string'?m.aiSummary:'';m.aiMk=m.aiMk||0;m.aiTurn=m.aiTurn||0;m.aiN=m.aiN||0;m.aiFail=m.aiFail||0;m.aiLt=m.aiLt||0;m.aiLast=m.aiLast||null;if(m.sub==='aiwait'){m.sub='act';m.cur=null}if(m.cur&&m.cur.ai&&!(Array.isArray(m.cur.o)&&m.cur.o.length>=2)){m.sub='act';m.cur=null}}
  s.hist.forEach(h=>{if(h&&typeof h.ai!=='number')h.ai=0});
  s.updatedAt=typeof s.updatedAt==='number'?s.updatedAt:(s.created||Date.now());
  delete s.aiCfg;delete s.apiKey;delete s.cloudCfg;
  if(!s.shop)shopService.gen(s);
  s.profile=Object.assign({},UP,s.profile||{});
  s.theme=Object.assign({},UT,s.theme||thG);
  s.uiCfg=Object.assign({},UC,s.uiCfg||{});
  if(!UB[s.profile.banner])s.profile.banner=0;
  if(!UD[s.profile.decor]||!UD[s.profile.decor].ok(s))s.profile.decor=0;
  s.reborn=s.reborn||0;s.ascended=s.ascended||0;
  s.stance=typeof s.stance==='number'?clamp(s.stance,0,2):0;
  s.realm=clamp(s.realm,0,REALMS.length-1);
}

/* ===== ĐỒNG BỘ VÂN ĐẠO (REAL-TIME CLOUD SYNC) ===== */
/* Cấu hình lưu độc lập tại localStorage 'msns_cloud_cfg' — tuyệt đối không nằm trong object s */
const CLDK='msns_cloud_cfg',CLDDF={on:false,prov:'firebase',url:'',key:'',room:'',slim:true};
const cloudSyncService={
  cfg:(()=>{try{return Object.assign({},CLDDF,JSON.parse(localStorage.getItem(CLDK)||'{}'))}catch(e){return Object.assign({},CLDDF)}})(),
  st:'off',msg:'',tm:0,ptm:0,es:null,lastTs:0,
  saveCfg(){try{localStorage.setItem(CLDK,JSON.stringify(this.cfg))}catch(e){}},
  set(k,v){const c=this.cfg;if(k==='prov')c.prov=v==='custom'?'custom':'firebase';else if(k==='url')c.url=String(v||'').trim().slice(0,240);else if(k==='key')c.key=String(v||'').trim().slice(0,300);else if(k==='room')c.room=String(v||'').trim().replace(/[^a-zA-Z0-9_-]/g,'').slice(0,64);this.saveCfg();this.reconnect()},
  ready(){const c=this.cfg;return!!(c.on&&c.url&&c.room&&navigator.onLine!==false)},
  badge(){if(!this.ready())return'☁ Offline';if(ui.cldCf)return'⚠ Xung đột!';return{idle:'☁ Đã đồng bộ',pushing:'☁ Đang đẩy...',pulling:'☁ Đang tải...',err:'☁ Lỗi kết nối'}[this.st]||'☁ Vân Đạo'},
  ep(){
    const c=this.cfg,b=c.url.replace(/\/+$/,''),rm=encodeURIComponent(c.room);
    if(c.prov==='firebase'){const p=/\.json$/i.test(b)?b:`${b}/msns_rooms/${rm}.json`;return c.key?`${p}${p.includes('?')?'&':'?'}auth=${encodeURIComponent(c.key)}`:p}
    return /\/msns_rooms\//.test(b)?b:`${b}/${rm}`;
  },
  hdr(){const c=this.cfg,h={'Content-Type':'application/json'};if(c.prov==='custom'&&c.key){h.Authorization=/^Bearer\s+/i.test(c.key)?c.key:'Bearer '+c.key;h.apikey=c.key}return h},
  pack(x){
    if(!x)return'{}';
    const c=Object.assign({},x);delete c.aiCfg;delete c.apiKey;delete c.cloudCfg;
    let j=JSON.stringify(c);
    if((this.cfg.slim||j.length>512000)&&c.uiCfg&&(c.uiCfg.av||c.uiCfg.bn||c.uiCfg.wp)){
      const u=Object.assign({},c.uiCfg);
      if(j.length>512000){u.av='';u.bn='';u.wp='';u._stripped=1;c.uiCfg=u;j=JSON.stringify(c)}
    }
    return j;
  },
  sizeKB(x){return Math.round(this.pack(x).length/102.4)/10},
  schedulePush(x){
    if(!this.ready()||!x)return;
    clearTimeout(this.tm);this.st='pushing';
    const sy=$('sys');if(sy){const b=sy.querySelector('[data-a="cld"]');if(b)b.textContent=this.badge()}
    this.tm=setTimeout(()=>this.push(x,false),1500);
  },
  async push(x,manual){
    if(!x)return;if(!this.ready()){if(manual)say('Hãy bật Vân Đạo và nhập đủ Endpoint URL + Mã phòng');return}
    clearTimeout(this.tm);this.st='pushing';if(manual)render();
    try{
      x.updatedAt=x.updatedAt||Date.now();
      const body=this.pack(x),r=await fetch(this.ep(),{method:'PUT',headers:this.hdr(),body});
      if(!r.ok)throw new Error('HTTP '+r.status);
      this.st='idle';this.lastTs=x.updatedAt;this.msg='✅ Đã đẩy lên Vân Đạo lúc '+new Date(x.updatedAt).toLocaleTimeString('vi-VN')+' ('+Math.round(body.length/1024)+' KB)';
      if(manual)toast('☁ Đã đẩy dữ liệu nhân vật lên Vân Đạo');
    }catch(e){
      this.st='err';this.msg='❌ Lỗi đẩy dữ liệu: '+(e.message||e);
      if(manual)toast('Không đẩy được lên Vân Đạo: '+(e.message||e),'wn');
    }
    render();
  },
  async pull(manual){
    if(!this.ready()){if(manual)say('Hãy bật Vân Đạo và nhập đủ Endpoint URL + Mã phòng');return}
    this.st='pulling';if(manual)render();
    try{
      const r=await fetch(this.ep(),{method:'GET',headers:this.hdr()});
      if(!r.ok)throw new Error('HTTP '+r.status);
      const d=await r.json();
      const rem=Array.isArray(d)?(d[0]&&(d[0].payload||d[0])):d&&(d.payload||d);
      if(!rem||typeof rem.realm!=='number'){
        this.st='idle';this.msg='ℹ Phòng Vân Đạo chưa có dữ liệu — đang đẩy bản lưu hiện tại lên...';
        if(s)await this.push(s,false);
        return render();
      }
      this.applyRemote(rem,manual);
    }catch(e){
      this.st='err';this.msg='❌ Lỗi tải dữ liệu: '+(e.message||e);
      if(manual)toast('Không tải được từ Vân Đạo: '+(e.message||e),'wn');
      render();
    }
  },
  isConflict(loc,rem){
    if(!loc||!rem)return false;
    const rDiff=Math.abs((rem.realm||0)-(loc.realm||0)),aDiff=Math.abs((rem.age||16)-(loc.age||16)),tDiff=Math.abs((rem.updatedAt||0)-(loc.updatedAt||0));
    return (rDiff>=1||(aDiff>=25&&tDiff>60000))&&((loc.updatedAt||0)>this.lastTs&&this.lastTs>0||rem.realm<loc.realm);
  },
  applyRemote(rem,manual){
    if(!rem||typeof rem.realm!=='number'||!Array.isArray(rem.tal))return;
    const rTs=rem.updatedAt||rem.created||0,lTs=s?(s.updatedAt||s.created||0):0;
    this.st='idle';
    if(!s){this.acceptRemote(rem);return}
    if(!manual&&rTs<=lTs){this.msg='✔ Dữ liệu bản địa đã là mới nhất ('+new Date(lTs).toLocaleTimeString('vi-VN')+')';return render()}
    if(JSON.stringify(rem)===JSON.stringify(s)){this.lastTs=rTs;this.msg='✔ Đã đồng bộ ('+new Date(rTs).toLocaleTimeString('vi-VN')+')';return render()}
    if(this.isConflict(s,rem)){
      ui.cldCf=rem;this.msg='⚠ Phát hiện xung đột tiến độ giữa 2 thiết bị!';
      return render();
    }
    this.acceptRemote(rem);
  },
  acceptRemote(rem){
    const oldUi=s&&s.uiCfg;
    s=rem;
    if(oldUi&&s.uiCfg&&s.uiCfg._stripped){s.uiCfg.av=s.uiCfg.av||oldUi.av;s.uiCfg.bn=s.uiCfg.bn||oldUi.bn;s.uiCfg.wp=s.uiCfg.wp||oldUi.wp;delete s.uiCfg._stripped}
    migrate();
    this.lastTs=s.updatedAt||Date.now();
    store.save(s,true);
    this.msg='☁ Đã đồng bộ từ Vân Đạo lúc '+new Date(this.lastTs).toLocaleTimeString('vi-VN');
    toast('☁ Đã đồng bộ tiến độ mới nhất từ Vân Đạo');
    render();
  },
  reconnect(){
    if(this.es){try{this.es.close()}catch(e){}this.es=null}
    clearInterval(this.ptm);this.ptm=0;
    if(!this.ready()){this.st='off';return}
    this.st='idle';
    if(this.cfg.prov==='firebase'&&typeof EventSource!=='undefined'){
      try{
        const es=this.es=new EventSource(this.ep());
        es.addEventListener('put',e=>{try{const p=JSON.parse(e.data);if(p&&p.data&&typeof p.data.realm==='number')this.applyRemote(p.data,false)}catch(er){}});
        es.onerror=()=>{try{es.close()}catch(e){}this.es=null};
      }catch(e){}
    }
    this.ptm=setInterval(()=>{if(this.ready()&&(typeof document.visibilityState==='undefined'||document.visibilityState==='visible')&&!ui.cldCf&&this.st!=='pushing')this.pull(false)},15000);
  },
  ping(){
    if(!this.cfg.url||!this.cfg.room)return say('Hãy nhập Endpoint URL và Mã phòng trước');
    this.cfg.on=true;this.saveCfg();this.reconnect();this.pull(true);
  }
};

function vInv(){
  let l=s.inv.filter(i=>(ui.f<0||ID[i.id].r===ui.f)&&(!ui.ft||ID[i.id].t===ui.ft));
  l.sort((a,b)=>ui.sort==='n'?ID[a.id].n.localeCompare(ID[b.id].n):ui.sort==='t'?ID[a.id].t.localeCompare(ID[b.id].t):ID[b.id].r-ID[a.id].r);

}

function vTec(){
  const L=Object.keys(s.tech).map(id=>QD[id]).filter(Boolean),f=L.filter(d=>techniqueService.lv(s,d.id)===3);
  if(!f.some(d=>d.id===ui.cr.f1))ui.cr.f1=f[0]&&f[0].id;
  if(!f.some(d=>d.id===ui.cr.f2&&d.id!==ui.cr.f1))ui.cr.f2=(f.find(d=>d.id!==ui.cr.f1)||{}).id;
  const op=k=>f.map(d=>`<option value="${d.id}"${d.id===ui.cr[k]?' selected':''}>${d.n}</option>`).join(''),A1=QD[ui.cr.f1],B1=QD[ui.cr.f2],r=A1&&B1?Math.max(A1.r,B1.r):0;
  return `<div class="mu" style="margin-bottom:8px">Trang bị tối đa 3 công pháp. Tương thích phụ thuộc linh căn và thể chất.</div><div class="grid">${L.map(d=>{const t=s.tech[d.id],l=techniqueService.lv(s,d.id),p=techniqueService.power(s,d.id);return card(d.r,d.n,`[${TIER[d.r]}] ${d.ty}<br><b>${fx(d.e,p)}</b> <span class="ok">(${Math.round(p*100)}% hiệu lực)</span>${d.d?'<br>'+d.d:''}<br>Thành thạo: ${MAST[l]} (${t.m}/250) · hệ ${d.el==='*'?'vạn năng':ELN[d.el]||d.el}${d.mb?', cần '+BODIES[d.mb].n:''}`,btn('ttg',d.id,t.eq?'Tháo':'Trang bị')+btn('tpr',d.id,t.m>=250?'Đã Viên mãn':'Tu luyện ('+(10*(d.r+1)**2)+' · Ngộ≥'+techniqueService.ngReq(d)+')',t.m>=250))}).join('')}</div>
  <div class="pn" style="margin-top:12px"><h3>Diễn Hóa Công Pháp</h3><div class="mu">Hai công pháp cùng đạt Viên mãn có thể diễn hóa thành một bộ mới mạnh hơn (tổng chỉ số ×1.1, phẩm cấp cao hơn một bậc). Tiêu tốn linh thạch và 2 điểm Ngộ Tính gốc, cần Ngộ Tính đủ cao. Hai công pháp gốc sẽ biến mất.</div>${f.length<2?'<div class="mu">Cần ít nhất 2 công pháp Viên mãn.</div>':`<div class="bt"><select data-chg="cr_f1">${op('f1')}</select><select data-chg="cr_f2">${op('f2')}</select>${btn('fuse','','Diễn Hóa ('+300*(r+1)+' linh thạch, Ngộ Tính ≥ '+(20+8*r)+')')}</div>`}</div>`;
}

function vKt(){
  const m=s.sim;let b='';
  if(!m||m.phase==='claimed')b=`${m?'<div class="pn ok">Đã nhận thưởng mô phỏng gần nhất.</div>':''}<div class="pn">${btn('sim','','Bắt đầu mô phỏng ('+30*(s.realm+1)**2+' linh thạch)',s.stones<30*(s.realm+1)**2)}</div>`;

  return `<div class="pn"><h3>Kim Thủ Chỉ cấp ${s.kt}/5</h3><div class="mu">Mỗi cấp tăng 10% tu vi &amp; linh thạch thưởng; cấp 3 mở thêm 1 ô thiên phú và được chọn 2 di sản. Phần thưởng tự nhân theo cảnh giới bản thể (hiện ×${Math.pow(1.75,s.realm).toFixed(2)}).</div>${btn('ukt','','Nâng cấp ('+200*s.kt+' linh thạch)',s.kt>=5)}</div>${aiPanel()}${b}<div class="pn"><h3>Lịch sử mô phỏng</h3>${s.hist.map(h=>`<div class="mu">${new Date(h.t).toLocaleString('vi-VN')} · hạng <b>${h.g}</b> · điểm ${h.score} · +${h.xp.toLocaleString('vi-VN')} tu vi · ${esc(h.tal.join(', ')||'không giữ thiên phú')}${h.ai?' · 🔮 '+h.ai+' biến cố Thiên Cơ':''}</div>`).join('')||'<span class="mu">Chưa có</span>'}</div>`;

  else if(aiE){const c=m.cur,RS=r=>r<.2?'<span class="ok">an toàn</span>':r<.45?'<span class="mu">rủi ro vừa</span>':'<span class="bad">hiểm cảnh</span>',NPn=c.npc?NP.find(n=>n.id===c.npc):null;

/* ===== BẢO MẬT ADMIN PANEL (SHA-256 + RAM SESSION) ===== */
const ADMIN_HASH='6051fc84a7a0d74c225fb18a496b09952da5642e60723ecae543298edd7d82d6';
function sha256Fallback(str){
  const K=[1116352408,1899447441,3049323471,3921009573,961987163,1508970993,2453635748,2870763221,3624381080,310598401,607225278,1426881987,1925078388,2162078206,2614888103,3248222580,3835390401,4022224774,264347078,604807628,770255983,1249150122,1555081692,1996064986,2554220882,2821834349,2952996808,3210313671,3336571891,3584528711,113926993,338241895,666307205,773529912,1294757372,1396182291,1695183700,1986661051,2177026350,2456956037,2730485921,2820302411,3259730800,3345764771,3516065817,3600352804,4094571909,275423344,430227734,506948616,659060556,883997877,958139571,1322822218,1537002063,1747873779,1955562222,2024104815,2227730452,2361852424,2428436474,2756734187,3204031479,3329325298];
  const b=unescape(encodeURIComponent(str)),l=b.length,w=[];
  for(let i=0;i<l;i++)w[i>>2]|=b.charCodeAt(i)<<(24-(i&3)*8);
  w[l>>2]|=0x80<<(24-(l&3)*8);w[((l+8>>6)<<4)+15]=l*8;
  let H=[1779033703,3144134277,1013904242,2773480762,1359893119,2600822924,528734635,1541459225],W=new Array(64);
  const R=(x,n)=>(x>>>n)|(x<<(32-n));
  for(let i=0;i<w.length;i+=16){
    let [a,c,d,e,f,g,h,k]=H;
    for(let j=0;j<64;j++){
      W[j]=j<16?(w[i+j]|0):(((R(W[j-2],17)^R(W[j-2],19)^(W[j-2]>>>10))+W[j-7]+(R(W[j-15],7)^R(W[j-15],18)^(W[j-15]>>>3))+W[j-16])|0);
      const t1=(k+(R(e,6)^R(e,11)^R(e,25))+((e&f)^(~e&g))+K[j]+W[j])|0,t2=((R(a,2)^R(a,13)^R(a,22))+((a&c)^(a&d)^(c&d)))|0;
      k=h;h=g;g=f;f=(e+t1)|0;e=d;d=c;c=a;a=(t1+t2)|0;
    }
    H=[(H[0]+a)|0,(H[1]+c)|0,(H[2]+d)|0,(H[3]+e)|0,(H[4]+f)|0,(H[5]+g)|0,(H[6]+h)|0,(H[7]+k)|0];
  }
  return H.map(x=>(x>>>0).toString(16).padStart(8,'0')).join('');
}

async function verifyAdminPwd(){
  const lk=+(sessionStorage.getItem('msns_admlk')||0);
  if(Date.now()<lk){ui.admAuth=false;say('Tâm cảnh bất ổn, không thể cảm ứng thiên đạo');return render()}
  const inp=$('adm-pwd'),val=inp?inp.value:'';
  if(!val)return;
  let hex='';
  if(window.crypto&&crypto.subtle){const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(val));hex=Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('')}
  else hex=sha256Fallback(val);
  if(hex===ADMIN_HASH){
    sessionStorage.removeItem('msns_admf');
    ui.admAuth=false;ui.adm=true;ui.tab='admin';
    say('Thiên Đạo Chi Ấn đã mở khóa');
    render();
  }else{
    const f=(+(sessionStorage.getItem('msns_admf')||0))+1;
    sessionStorage.setItem('msns_admf',String(f));
    if(f>=3){
      sessionStorage.setItem('msns_admlk',String(Date.now()+300000));
      sessionStorage.removeItem('msns_admf');
      ui.admAuth=false;
      say('Tâm cảnh bất ổn, không thể cảm ứng thiên đạo');
    }else{
      ui.admMsg='Khẩu quyết sai lệch ('+f+'/3)';
    }
    render();
  }
}

function runLab(){
  const bak=s,um=ui.msg,rows=[];s=JSON.parse(JSON.stringify(bak));s.log=[];
  const prep=()=>{
    EQT.forEach(t=>{
      const cands=s.inv.filter(i=>ID[i.id].t===t).sort((a,b)=>(ID[b.id].r*10+(b.ql||0))-(ID[a.id].r*10+(a.ql||0)));
      if(cands[0]&&s.eq[t]!==cands[0].u)s.eq[t]=cands[0].u;
    });
    const useIf=(id,cond)=>{if(!cond)return;const it=s.inv.find(i=>i.id===id&&i.q>0);if(it)inventoryService.use(s,it.u,1)};
    useIf('d3',s.tm);useIf('d11',s.toxin>=70);
    useIf('d13',s.age>cultivationService.life(s)*.85);useIf('d6',s.age>cultivationService.life(s)*.85);
    if(s.xp<cultivationService.need(s)&&s.toxin<60){useIf('d12',true);useIf('d1',true)}
  };
  let t0=s.age,f=0,it=0,farm=0,stop='Hoàn tất';
  try{
    while(it++<6000&&s.realm<REALMS.length-1){
      if(s.age>=cultivationService.life(s)){stop='Hết thọ nguyên ở '+REALMS[s.realm];break}
      prep();
      const c=cultivationService.check(s);
      if(c.every(k=>k[0])){const r0=s.realm;cultivationService.go(s);farm=0;if(s.realm>r0){rows.push([REALMS[s.realm],s.age-t0,f,s.stones]);t0=s.age;f=0}else if(s.layer===8)f++}
      else if(s.xp<cultivationService.need(s))cultivationService.train(s);
      else{if(++farm>300){stop='Kẹt ở '+REALMS[s.realm]+' tầng 9, thiếu: '+c.filter(k=>!k[0]).map(k=>k[1]).join('; ');break}adventureService.fight(s,Math.min(s.realm,ADV.length-1),true)}
    }
    if(it>=6000)stop='Dừng sau 6000 bước';
  }catch(e){stop='Lỗi giả lập: '+e.message}finally{s=bak;ui.msg=um}
  ui.lab={rows,stop};
}

  if(k==='sort'){ui.sort=e.target.value;render();return}
  if(k==='pstatus'&&s){s.profile.status=e.target.value.trim().slice(0,60);store.save(s);render();return}
  if(k==='rb_tal'){ui.rbTal=e.target.value;return}
  if(k&&k.slice(0,3)==='ai_'){const n=k.slice(3),v=e.target.value;if(n==='in'){ui.aiIn=aiS(v,160);return}thienCoAI.set(n,v);ui.aiPing='';render();return}
  if(k&&k.slice(0,4)==='cld_'){cloudSyncService.set(k.slice(4),e.target.value);render();return}
  if(k&&k.slice(0,3)==='cr_'){ui.cr[k.slice(3)]=e.target.value;render();return}
  if(k&&k.slice(0,3)==='ad_'&&s){const n=k.slice(3),v=e.target.value;if(['realm','layer','body','root'].includes(n)){s[n]=n==='layer'?+v-1:+v;store.save(s);render()}else ui.ad[n]=v;return}
  if(s&&k&&f){if(k.slice(0,4)==='img_')imgFile(k.slice(4),f);else if(k==='aud')audFile(f);e.target.value=''}
});

document.addEventListener('input',e=>{
  const k=e.target.dataset.chg;if(!k)return;
  if(k.slice(0,3)==='ai_'){const n=k.slice(3),v=e.target.value;if(n==='in'){ui.aiIn=aiS(v,160);return}if(n==='model'||n==='url'||n==='key')thienCoAI.set(n,v);return}
  if(k.slice(0,4)==='cld_'){cloudSyncService.set(k.slice(4),e.target.value);return}
  if(!s)return;
  if(k==='th_bg'||k==='th_ac'){setT(k==='th_bg'?'bg':'ac',e.target.value);applyTheme();store.save(s);return}
  const v=+e.target.value,u=s.uiCfg;
  if(k==='wp_o'){u.wo=v;applyWp();const o=$('v_wp_o');if(o)o.textContent=v+'%'}
  else if(k==='wp_b'){u.wb=v;applyWp();const o=$('v_wp_b');if(o)o.textContent=v+'px'}
  else if(k==='vol'){u.vol=v;syncVol();const o=$('v_vol');if(o)o.textContent=v+'%'}
  else return;
  store.save(s);
});

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target&&e.target.id==='ai_in'){e.preventDefault();const b=document.querySelector('[data-a="aiact"]');if(b&&!b.disabled)b.click();return}
  if(e.key==='Escape'){
    if(ui.btl&&ui.btl.done){ui.btl=null;render();return}
    if(ui.admAuth){ui.admAuth=false;ui.admMsg='';render();return}
    if(ui.ap){ui.ap=0;render();return}
  }
  if(e.altKey&&e.shiftKey&&(e.code==='Backquote'||e.key==='~'||e.key==='`')){
    e.preventDefault();openAdminPrompt();
  }
});
